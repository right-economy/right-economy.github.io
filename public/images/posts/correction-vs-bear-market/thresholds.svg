<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img"
     aria-label="고점 대비 하락률을 구간으로 나눈 띠 도식. 0에서 5퍼센트 미만은 흔한 되돌림, 5퍼센트에서 10퍼센트 미만은 눌림, 10퍼센트 이상은 조정, 20퍼센트 이상은 하락장으로 부른다. 10퍼센트와 20퍼센트는 법정 정의가 없고 시장에서 널리 쓰는 관행적인 선이다.">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="24" y="34" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#1f2937">고점 대비 얼마나 내렸나 — 구간을 부르는 이름</text>

  <rect x="24"  y="60" width="168" height="54" fill="#e8f0fe" stroke="#b7c9e8"/>
  <rect x="192" y="60" width="168" height="54" fill="#dbe7fb" stroke="#b7c9e8"/>
  <rect x="360" y="60" width="168" height="54" fill="#fde7cf" stroke="#e8c49a"/>
  <rect x="528" y="60" width="168" height="54" fill="#f9d2d2" stroke="#e3a5a5"/>

  <text x="108" y="84" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2a3b55">0% ~ -5% 미만</text>
  <text x="108" y="104" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1f2937">흔한 되돌림</text>
  <text x="276" y="84" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2a3b55">-5% ~ -10% 미만</text>
  <text x="276" y="104" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1f2937">눌림</text>
  <text x="444" y="84" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#6b4a1f">-10% 이상</text>
  <text x="444" y="104" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#8a5a16">조정</text>
  <text x="612" y="84" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#7a2b2b">-20% 이상</text>
  <text x="612" y="104" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#9c2c2c">하락장</text>

  <line x1="24" y1="134" x2="696" y2="134" stroke="#9aa6b8" stroke-width="1"/>
  <line x1="360" y1="128" x2="360" y2="140" stroke="#8a5a16" stroke-width="2"/>
  <line x1="528" y1="128" x2="528" y2="140" stroke="#9c2c2c" stroke-width="2"/>
  <text x="360" y="156" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#8a5a16">-10%</text>
  <text x="528" y="156" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#9c2c2c">-20%</text>

  <text x="24" y="192" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#4a5568">10%와 20%는 법정 정의가 없습니다. 시장에서 널리 쓰는 관행적인 선입니다.</text>
  <text x="24" y="214" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#4a5568">그래서 매체마다 조금씩 다르게 쓰기도 합니다.</text>
  <text x="24" y="236" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#8a94a6">기준은 장중 고가보다 종가 고점을 쓰는 게 보통이다.</text>
</svg>
