<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Pretendard, sans-serif" role="img" aria-label="VI가 발동되면 실시간으로 하나씩 체결되던 거래가 2분 동안 주문만 모으는 단일가매매로 바뀌고, 2분 뒤 모인 주문이 하나의 가격으로 한꺼번에 체결된 다음 다시 실시간 체결로 돌아온다는 흐름 도식">
  <rect width="720" height="250" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">발동되면 2분 동안 무엇이 달라지나</text>

  <rect x="30" y="74" width="180" height="104" rx="12" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="120" y="108" text-anchor="middle" font-size="22">⚡</text>
  <text x="120" y="136" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c2410c">평소</text>
  <text x="120" y="158" text-anchor="middle" font-size="11.5" fill="#8a5a52">주문이 들어오는 대로</text>
  <text x="120" y="174" text-anchor="middle" font-size="11.5" fill="#8a5a52">하나씩 바로 체결</text>

  <line x1="212" y1="126" x2="258" y2="126" stroke="#c2410c" stroke-width="2.5" marker-end="url(#vi-arrow)"/>

  <rect x="262" y="74" width="196" height="104" rx="12" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="360" y="108" text-anchor="middle" font-size="22">⏸️</text>
  <text x="360" y="136" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c0392b">VI 발동 · 2분</text>
  <text x="360" y="158" text-anchor="middle" font-size="11.5" fill="#8a5a52">주문은 받지만 체결은 멈춤</text>
  <text x="360" y="174" text-anchor="middle" font-size="11.5" fill="#8a5a52">모아서 가격 하나를 찾는다</text>

  <line x1="460" y1="126" x2="506" y2="126" stroke="#c2410c" stroke-width="2.5" marker-end="url(#vi-arrow)"/>

  <rect x="510" y="74" width="180" height="104" rx="12" fill="#eef6ef" stroke="#cfe3d2"/>
  <text x="600" y="108" text-anchor="middle" font-size="22">▶️</text>
  <text x="600" y="136" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2f6b3c">2분 뒤</text>
  <text x="600" y="158" text-anchor="middle" font-size="11.5" fill="#4a6b52">모인 주문을 한 가격에 체결</text>
  <text x="600" y="174" text-anchor="middle" font-size="11.5" fill="#4a6b52">다시 실시간 체결로</text>

  <text x="360" y="212" text-anchor="middle" font-size="12.5" fill="#8a6d5a">거래가 사라지는 게 아니라 체결 방식이 2분 동안 바뀌는 것입니다</text>
  <text x="360" y="233" text-anchor="middle" font-size="12.5" fill="#8a6d5a">발동 횟수에 상한이 없어 하루에 여러 번 걸릴 수 있습니다</text>

  <defs>
    <marker id="vi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
