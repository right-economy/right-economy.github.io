<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="매몰비용에 매달리게 만드는 손실 회피·일관성 욕구·본전 심리 세 가지를 정리한 도식">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">왜 우리는 손해를 알면서도 못 놓을까</text>
  <text x="320" y="58" text-anchor="middle" font-size="13" fill="#6b7280">매몰비용에 매달리게 만드는 세 가지 심리</text>

  <!-- card 1 -->
  <rect x="45" y="90" width="175" height="210" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="132" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">① 손실 회피</text>
  <text x="132" y="162" text-anchor="middle" font-size="12.5" fill="#374151">"쓴 돈을 손해로</text>
  <text x="132" y="182" text-anchor="middle" font-size="12.5" fill="#374151">인정하기 싫다"</text>
  <text x="132" y="216" text-anchor="middle" font-size="12" fill="#9a3412">손실을 이득보다</text>
  <text x="132" y="234" text-anchor="middle" font-size="12" fill="#9a3412">훨씬 아프게 느낌</text>

  <!-- card 2 -->
  <rect x="232" y="90" width="176" height="210" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">② 일관성 욕구</text>
  <text x="320" y="162" text-anchor="middle" font-size="12.5" fill="#374151">"여기까지 왔는데</text>
  <text x="320" y="182" text-anchor="middle" font-size="12.5" fill="#374151">이제 와서 그만?"</text>
  <text x="320" y="216" text-anchor="middle" font-size="12" fill="#475569">과거 선택을 부정</text>
  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#475569">하기 싫은 마음</text>

  <!-- card 3 -->
  <rect x="420" y="90" width="175" height="210" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="507" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">③ 본전 심리</text>
  <text x="507" y="162" text-anchor="middle" font-size="12.5" fill="#374151">"들인 게 있으니</text>
  <text x="507" y="182" text-anchor="middle" font-size="12.5" fill="#374151">뽑아야 한다"</text>
  <text x="507" y="216" text-anchor="middle" font-size="12" fill="#9a3412">이미 못 돌릴 돈에</text>
  <text x="507" y="234" text-anchor="middle" font-size="12" fill="#9a3412">계속 매달림</text>

  <text x="320" y="336" text-anchor="middle" font-size="13" fill="#6b7280">세 심리 모두 '이미 지나간 것'에 집착하게 만든다</text>
</svg>
