<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" width="660" height="320" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" role="img" aria-label="금은 VIX 급등 상위 5일엔 5번 중 4번 올랐지만 상위 15일 30일 전체 하락일로 넓히면 오른 비율이 33에서 41퍼센트로 떨어진다">
  <rect width="660" height="320" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#1a2540">금은 「제일 무서운 날」에만 안전자산처럼 움직였습니다</text>
  <text x="20" y="49" font-size="11" fill="#6b7280">각 구간에서 금이 오른 날의 비율 · 2025년 9월~2026년 9월 264거래일</text>

  <line x1="150" y1="70" x2="150" y2="250" stroke="#374151" stroke-width="1.5"/>
  <text x="150" y="270" font-size="10" fill="#9ca3af" text-anchor="middle">0%</text>
  <text x="300" y="270" font-size="10" fill="#9ca3af" text-anchor="middle">25%</text>
  <text x="450" y="270" font-size="10" fill="#9ca3af" text-anchor="middle">50%</text>
  <text x="600" y="270" font-size="10" fill="#9ca3af" text-anchor="middle">75%</text>
  <line x1="300" y1="70" x2="300" y2="250" stroke="#f3f4f6"/><line x1="450" y1="70" x2="450" y2="250" stroke="#f3f4f6"/><line x1="600" y1="70" x2="600" y2="250" stroke="#f3f4f6"/>

  <text x="20" y="92" font-size="11" font-weight="700" fill="#1a2540">VIX 급등 상위 5일</text>
  <rect x="150" y="80" width="480" height="18" fill="#dc2626"/><text x="622" y="94" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">4/5 · 80%</text>

  <text x="20" y="132" font-size="11" fill="#374151">상위 15일</text>
  <rect x="150" y="120" width="200" height="18" fill="#f59e0b"/><text x="358" y="134" font-size="11" fill="#b45309">5/15 · 33%</text>

  <text x="20" y="172" font-size="11" fill="#374151">상위 30일</text>
  <rect x="150" y="160" width="200" height="18" fill="#f59e0b"/><text x="358" y="174" font-size="11" fill="#b45309">10/30 · 33%</text>

  <text x="20" y="212" font-size="11" fill="#374151">S&amp;P 하락일 전체</text>
  <rect x="150" y="200" width="244" height="18" fill="#9ca3af"/><text x="402" y="214" font-size="11" fill="#6b7280">46/113 · 41%</text>

  <text x="20" y="300" font-size="10" fill="#9ca3af">「몇 날을 볼 것인가」만 바꿔도 결론이 달라집니다 · 자료: Yahoo Finance (GC=F, ^VIX, ^GSPC)</text>
</svg>
