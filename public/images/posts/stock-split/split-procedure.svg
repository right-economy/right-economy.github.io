<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"
     aria-label="액면분할 절차 순서도. 주주총회 특별결의로 정관의 1주 금액을 바꾸고, 1개월 이상 기간을 정해 공고한 뒤, 구주권 제출 마감 전후로 매매거래가 멈추고, 변경상장일에 조정된 가격으로 거래가 다시 열리며, 효력 발생일부터 2주 안에 변경등기를 한다는 흐름.">
  <rect width="720" height="300" fill="#fcfcfd"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a2540">액면분할이 끝나기까지</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#5b6478">기준: 상법 제329조의2, 제433조·제434조, 제440조~제443조</text>

  <rect x="24" y="80" width="200" height="58" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="124" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">주주총회 특별결의</text>
  <text x="124" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">정관의 1주 금액 변경</text>
  <path d="M232 109 L272 109" stroke="#8a93a6" stroke-width="2.2" marker-end="url(#p1)"/>

  <rect x="280" y="80" width="200" height="58" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="380" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">1개월 이상 공고</text>
  <text x="380" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">구주권 제출 기간</text>
  <path d="M488 109 L528 109" stroke="#8a93a6" stroke-width="2.2" marker-end="url(#p2)"/>

  <rect x="536" y="80" width="160" height="58" rx="8" fill="#fdf1e7" stroke="#e0a876"/>
  <text x="616" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">매매거래 정지</text>
  <text x="616" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a5a28">마감일 전후</text>

  <path d="M616 146 L616 176" stroke="#8a93a6" stroke-width="2.2" marker-end="url(#p3)"/>

  <rect x="400" y="184" width="296" height="58" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="548" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">변경상장 — 거래 재개</text>
  <text x="548" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">분할 비율로 조정된 가격에서 시작</text>
  <path d="M392 213 L352 213" stroke="#8a93a6" stroke-width="2.2" marker-end="url(#p4)"/>

  <rect x="104" y="184" width="240" height="58" rx="8" fill="#f7f8fa" stroke="#ccd1da"/>
  <text x="224" y="208" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">변경등기</text>
  <text x="224" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">효력 발생일부터 2주 안에</text>

  <text x="24" y="276" font-family="sans-serif" font-size="12" fill="#5b6478">정지 기간은 종목마다 다릅니다. 결의부터 거래 재개까지 두 달 가까이 걸리는 경우도 있어 공시의 날짜를 봐야 합니다.</text>
  <defs>
    <marker id="p1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8a93a6"/></marker>
    <marker id="p2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8a93a6"/></marker>
    <marker id="p3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8a93a6"/></marker>
    <marker id="p4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8a93a6"/></marker>
  </defs>
</svg>
