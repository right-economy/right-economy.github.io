<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img"
     aria-label="액면가 500원 주식 100주를 1대 5로 액면분할하면 액면가는 100원, 주식 수는 500주가 되고 액면가와 주식 수를 곱한 자본금 5만 원은 분할 전후가 같다는 계산 도식.">
  <rect width="720" height="320" fill="#fcfcfd"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a2540">1대 5 액면분할</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#5b6478">액면가를 5분의 1로 낮추고 주식 수를 5배로 늘립니다</text>

  <rect x="24" y="76" width="260" height="128" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="154" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a2540">분할 전</text>
  <text x="48" y="130" font-family="sans-serif" font-size="13" fill="#1a2540">액면가 500원</text>
  <text x="48" y="154" font-family="sans-serif" font-size="13" fill="#1a2540">주식 수 100주</text>
  <line x1="48" y1="166" x2="260" y2="166" stroke="#9fb3d9"/>
  <text x="48" y="188" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a2540">자본금 5만 원</text>

  <path d="M296 140 L424 140" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#s1)"/>
  <text x="360" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2f5fb3">1대 5</text>

  <rect x="436" y="76" width="260" height="128" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="566" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a2540">분할 후</text>
  <text x="460" y="130" font-family="sans-serif" font-size="13" fill="#1a2540">액면가 100원</text>
  <text x="460" y="154" font-family="sans-serif" font-size="13" fill="#1a2540">주식 수 500주</text>
  <line x1="460" y1="166" x2="672" y2="166" stroke="#9fb3d9"/>
  <text x="460" y="188" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a2540">자본금 5만 원</text>

  <rect x="24" y="226" width="672" height="70" rx="8" fill="#f7f8fa" stroke="#ccd1da"/>
  <text x="48" y="252" font-family="sans-serif" font-size="13" fill="#1a2540">자본금은 액면가 곱하기 주식 수입니다. 한쪽을 5분의 1로 낮추고 다른 쪽을 5배로 늘렸으니 곱은 같습니다.</text>
  <text x="48" y="278" font-family="sans-serif" font-size="13" fill="#5b6478">회사가 가진 돈도, 주주가 가진 지분율도 이 단계에서는 움직이지 않습니다.</text>
  <defs>
    <marker id="s1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2f5fb3"/></marker>
  </defs>
</svg>
