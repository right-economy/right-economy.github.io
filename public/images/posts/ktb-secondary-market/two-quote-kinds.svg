<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, sans-serif" role="img" aria-label="국채전문유통시장의 호가 두 종류 비교. 조성호가는 전문딜러와 예비전문딜러가 시장조성을 목적으로 제시하는 호가이고, 매매호가는 매매거래를 목적으로 제시하는 호가다">
  <rect width="720" height="280" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">같은 화면의 호가가 두 종류입니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 재정경제부 국채시장 안내(한국거래소 채권시장) · 2026년 11월 17일 조회</text>

  <rect x="56" y="82" width="300" height="150" rx="10" fill="#eaf1f8"/>
  <text x="206" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#1f5c99">조성호가</text>
  <text x="206" y="140" text-anchor="middle" font-size="12.5" fill="#1f5c99">전문딜러와 예비전문딜러가</text>
  <text x="206" y="162" text-anchor="middle" font-size="12.5" fill="#1f5c99">시장조성을 목적으로 냅니다</text>
  <text x="206" y="196" text-anchor="middle" font-size="12" fill="#5a4636">사겠다는 값과 팔겠다는 값을</text>
  <text x="206" y="216" text-anchor="middle" font-size="12" fill="#5a4636">늘 걸어두는 쪽입니다</text>

  <rect x="372" y="82" width="292" height="150" rx="10" fill="#eaf4ec"/>
  <text x="518" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#1e7a46">매매호가</text>
  <text x="518" y="140" text-anchor="middle" font-size="12.5" fill="#1e7a46">매매거래를 목적으로</text>
  <text x="518" y="162" text-anchor="middle" font-size="12.5" fill="#1e7a46">제시하는 호가입니다</text>
  <text x="518" y="196" text-anchor="middle" font-size="12" fill="#5a4636">지금 사거나 팔려고</text>
  <text x="518" y="216" text-anchor="middle" font-size="12" fill="#5a4636">들어오는 쪽입니다</text>

  <text x="60" y="262" font-size="12" fill="#6f5443">호가가 늘 걸려 있어야 팔고 싶을 때 상대를 찾을 수 있습니다.</text>
</svg>
