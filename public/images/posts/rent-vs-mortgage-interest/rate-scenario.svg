<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Noto Sans KR', sans-serif" role="img" aria-label="금리 4%일 때 월세 160만원은 4.8억 대출과 같아 자기자본 2억을 더해 6.8억 집을, 금리 5%일 때는 3.84억 대출로 5.84억 집을 살 수 있다는 비교 막대그래프">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">월세 160만원 = 대출 이자로 맞추면</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#6b7280">자기자본 2억 가정 · 매수 가능 집값 · 단위: 억원</text>

  <!-- baseline -->
  <line x1="90" y1="350" x2="590" y2="350" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="80" y="354" text-anchor="end" font-size="11" fill="#9ca3af">0</text>
  <text x="80" y="270" text-anchor="end" font-size="11" fill="#9ca3af">2</text>
  <text x="80" y="190" text-anchor="end" font-size="11" fill="#9ca3af">4</text>
  <text x="80" y="110" text-anchor="end" font-size="11" fill="#9ca3af">6</text>

  <!-- scale: 40px per 억. baseline y=350. self 2억 = 80px -->
  <!-- 금리 4%: 자기자본 2억(80) + 대출 4.8억(192) = 6.8억(272) -->
  <rect x="170" y="270" width="130" height="80" rx="3" fill="#9ca3af"/>
  <rect x="170" y="78" width="130" height="192" rx="3" fill="#3b82f6"/>
  <text x="235" y="316" text-anchor="middle" font-size="12" fill="#ffffff">자기자본 2억</text>
  <text x="235" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">대출 4.8억</text>
  <text x="235" y="66" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">6.8억</text>
  <text x="235" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">금리 4%</text>

  <!-- 금리 5%: 자기자본 2억(80) + 대출 3.84억(153.6) = 5.84억(233.6) -->
  <rect x="380" y="270" width="130" height="80" rx="3" fill="#9ca3af"/>
  <rect x="380" y="116" width="130" height="154" rx="3" fill="#60a5fa"/>
  <text x="445" y="316" text-anchor="middle" font-size="12" fill="#ffffff">자기자본 2억</text>
  <text x="445" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">대출 3.84억</text>
  <text x="445" y="104" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">5.84억</text>
  <text x="445" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">금리 5%</text>

  <!-- diff callout -->
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#b45309">금리 1%p ↑ → 같은 월세로 살 수 있는 집 약 1억 ↓</text>
</svg>
