<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="통합발행 종목에서 표면금리는 고정되고 발행가격이 움직인다는 설명 도식. 통합기간 안에 열린 입찰마다 결정된 수익률이 다르더라도 표면금리와 만기일은 그대로이고, 수익률 차이는 발행가격으로 조정된다. 결정된 수익률이 표면금리보다 높으면 액면보다 싸게, 낮으면 액면보다 비싸게 발행된다">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">고정된 칸과 움직이는 칸</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 기획재정부 국채시장 안내 · 옳은경제 정리</text>

  <rect x="50" y="82" width="300" height="150" rx="10" fill="#eaf1f8"/>
  <text x="200" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#1f5c99">통합기간 내내 그대로인 것</text>
  <text x="200" y="140" text-anchor="middle" font-size="13" fill="#5a4636">표면금리</text>
  <text x="200" y="166" text-anchor="middle" font-size="13" fill="#5a4636">만기일</text>
  <text x="200" y="192" text-anchor="middle" font-size="13" fill="#5a4636">종목 이름</text>
  <text x="200" y="216" text-anchor="middle" font-size="11.5" fill="#6f5443">그래서 한 종목으로 묶입니다</text>

  <rect x="370" y="82" width="300" height="150" rx="10" fill="#eaf4ec"/>
  <text x="520" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#1e7a46">입찰마다 달라지는 것</text>
  <text x="520" y="140" text-anchor="middle" font-size="13" fill="#5a4636">그날 결정된 수익률</text>
  <text x="520" y="166" text-anchor="middle" font-size="13" fill="#5a4636">발행가격</text>
  <text x="520" y="192" text-anchor="middle" font-size="13" fill="#5a4636">그날 발행된 금액</text>
  <text x="520" y="216" text-anchor="middle" font-size="11.5" fill="#6f5443">차이는 가격으로 맞춥니다</text>

  <text x="60" y="262" font-size="12.5" fill="#5a4636">결정된 수익률이 표면금리보다 높으면 액면보다 싸게, 낮으면 액면보다 비싸게 발행됩니다.</text>
  <text x="60" y="283" font-size="12.5" fill="#5a4636">채권 가격과 금리가 반대로 움직이기 때문입니다.</text>
</svg>
