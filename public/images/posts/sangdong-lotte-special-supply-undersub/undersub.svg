<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="상동역 롯데캐슬 특별공급이 유형별로 배정 대비 얼마나 접수됐는지 보여주는 막대 도식. 생애최초만 배정에 근접하고 나머지는 크게 미달">
  <rect width="760" height="440" fill="#faf9f6"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a2e">특공 유형별 배정 대비 접수율</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#64748b">상동역 롯데캐슬 시그니처 · 청약홈 신청현황(2026.8.24 종료)</text>
  <!-- 100% 기준선 -->
  <line x1="150" y1="90" x2="150" y2="400" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="600" y1="90" x2="600" y2="400" stroke="#e08a2b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="84" text-anchor="middle" font-size="11" fill="#b45309">배정 100% (완료선)</text>
  <!-- 막대: (라벨, 배율, y) 최대 450px=100% → scale 450 -->
  <!-- x0=150, fullwidth=450 -->
  <g font-size="13">
    <!-- 생애최초 0.96 -->
    <text x="140" y="118" text-anchor="end" font-weight="700" fill="#334155">생애최초</text>
    <rect x="150" y="105" width="432" height="20" rx="3" fill="#2f9e5f"/>
    <text x="590" y="120" font-size="12" font-weight="700" fill="#166534">0.96</text>
    <!-- 신생아 0.51 -->
    <text x="140" y="156" text-anchor="end" font-weight="700" fill="#334155">신생아</text>
    <rect x="150" y="143" width="230" height="20" rx="3" fill="#eab308"/>
    <text x="388" y="158" font-size="12" font-weight="700" fill="#a16207">0.51</text>
    <!-- 다자녀 0.42 -->
    <text x="140" y="194" text-anchor="end" font-weight="700" fill="#334155">다자녀</text>
    <rect x="150" y="181" width="189" height="20" rx="3" fill="#eab308"/>
    <text x="347" y="196" font-size="12" font-weight="700" fill="#a16207">0.42</text>
    <!-- 신혼부부 0.33 -->
    <text x="140" y="232" text-anchor="end" font-weight="700" fill="#334155">신혼부부</text>
    <rect x="150" y="219" width="149" height="20" rx="3" fill="#f97316"/>
    <text x="307" y="234" font-size="12" font-weight="700" fill="#c2410c">0.33</text>
    <!-- 노부모 0.11 -->
    <text x="140" y="270" text-anchor="end" font-weight="700" fill="#334155">노부모부양</text>
    <rect x="150" y="257" width="50" height="20" rx="3" fill="#dc2626"/>
    <text x="208" y="272" font-size="12" font-weight="700" fill="#b91c1c">0.11</text>
    <!-- 기관추천 0.07 -->
    <text x="140" y="308" text-anchor="end" font-weight="700" fill="#334155">기관추천</text>
    <rect x="150" y="295" width="32" height="20" rx="3" fill="#dc2626"/>
    <text x="190" y="310" font-size="12" font-weight="700" fill="#b91c1c">0.07</text>
  </g>
  <!-- 전체 요약 박스 -->
  <rect x="150" y="340" width="450" height="52" rx="8" fill="#1a1a2e"/>
  <text x="375" y="363" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">특공 전체: 배정 815 → 접수 323</text>
  <text x="375" y="383" text-anchor="middle" font-size="14" font-weight="800" fill="#fbbf24">채움률 40% (미달)</text>
  <text x="380" y="420" text-anchor="middle" font-size="11" fill="#94a3b8">배율 1.0 미만 = 미달 · 생애최초만 배정에 근접 · 옳은경제 정리</text>
</svg>
