<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="2021년 12월 125만원에서 2026년 6월 159만원으로 오른 서울 아파트 평균 월세 추이">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">서울 아파트 평균 월세, 5년 새 27% 뛰었다</text>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#6b7280">월별 평균 월세(만원) · 2011년 통계 공개 이후 역대 최고 · 출처: 한국부동산원(뉴스핌 보도)</text>

  <!-- baseline -->
  <line x1="90" y1="300" x2="560" y2="300" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- bar 1: 2021.12 = 125만 -->
  <rect x="150" y="180" width="110" height="120" rx="4" fill="#93c5fd"/>
  <text x="205" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">125만원</text>
  <text x="205" y="322" text-anchor="middle" font-size="14" fill="#374151">2021년 12월</text>

  <!-- bar 2: 2026.6 = 159만 -->
  <rect x="390" y="97" width="110" height="203" rx="4" fill="#2563eb"/>
  <text x="445" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">159만원</text>
  <text x="445" y="322" text-anchor="middle" font-size="14" fill="#374151">2026년 6월</text>

  <!-- arrow / delta -->
  <text x="320" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626">▲ +34만원 (+27.2%)</text>

  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#9ca3af">※ 보증금을 뺀 매달 내는 임대료 평균. 전세의 '월세화'가 진행된 결과예요.</text>
</svg>
