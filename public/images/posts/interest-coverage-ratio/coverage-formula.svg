<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="영업이익을 이자비용으로 나눈 값이 1보다 크면 영업이익으로 이자를 내고 남고, 1보다 작으면 영업이익만으로는 이자를 못 낸다는 것을 나타낸 도식">
  <rect width="720" height="320" fill="#fcfcfd"/>
  <text x="36" y="40" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">이자보상배율은 나눗셈 하나입니다</text>
  <text x="36" y="64" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">분자와 분모 모두 손익계산서에 적힌 값 · 단위: 배</text>

  <rect x="36" y="88" width="250" height="44" rx="8" fill="#fdf3e6" stroke="#d9b07f"/>
  <text x="161" y="116" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#7a5320">영업이익</text>
  <line x1="36" y1="142" x2="286" y2="142" stroke="#1a2540" stroke-width="2"/>
  <rect x="36" y="152" width="250" height="44" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="161" y="180" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14.5" font-weight="700" fill="#2b3f66">이자비용</text>
  <text x="310" y="152" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700" fill="#1a2540">=</text>

  <rect x="348" y="88" width="312" height="52" rx="8" fill="#eaf5ee" stroke="#7fb894"/>
  <text x="368" y="110" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#1f5c38">1보다 크면</text>
  <text x="368" y="130" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">이자를 내고도 영업이익이 남습니다</text>

  <rect x="348" y="150" width="312" height="30" rx="6" fill="#f1f2f5" stroke="#c4c8d2"/>
  <text x="368" y="170" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#3a4357">1이면 영업이익과 이자비용이 같습니다</text>

  <rect x="348" y="190" width="312" height="52" rx="8" fill="#fdeeee" stroke="#d99f9f"/>
  <text x="368" y="212" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#8f2f2f">1보다 작으면</text>
  <text x="368" y="232" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">영업이익만으로는 이자를 못 냅니다</text>

  <text x="36" y="272" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" fill="#1a2540">예를 들어 영업이익 120억원, 이자비용 100억원이면 1.2배입니다.</text>
  <text x="36" y="296" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" fill="#1a2540">같은 회사가 영업이익 80억원에 이자비용이 그대로면 0.8배로 내려갑니다.</text>
</svg>
