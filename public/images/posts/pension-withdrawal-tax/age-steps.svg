<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="사적연금 원천징수 세율이 나이가 많을수록 5퍼센트에서 4퍼센트, 3퍼센트로 낮아지는 계단 그림">
  <rect width="640" height="260" fill="#fbfaf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">나이가 많을수록 떼는 비율이 내려갑니다</text>

  <line x1="70" y1="200" x2="590" y2="200" stroke="#bbb" stroke-width="1"/>

  <rect x="110" y="90" width="110" height="110" fill="#dfe6f2" stroke="#8b9dc3"/>
  <text x="165" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2b2b2b">5%</text>
  <text x="165" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">70세 미만</text>

  <rect x="265" y="112" width="110" height="88" fill="#e4ecdf" stroke="#7a9a72"/>
  <text x="320" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2b2b2b">4%</text>
  <text x="320" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">70~79세</text>

  <rect x="420" y="134" width="110" height="66" fill="#f0e9df" stroke="#b39a72"/>
  <text x="475" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#2b2b2b">3%</text>
  <text x="475" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">80세 이상</text>

  <text x="320" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">소득세 기준 · 지방소득세가 따로 붙습니다 · 출처: 국세청</text>
</svg>
