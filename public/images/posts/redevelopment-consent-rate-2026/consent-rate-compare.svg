<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="조합설립 동의율 비교 막대. 재개발 현행 75%, 개편안 70%, 재건축 70%">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2937">조합설립 동의율 — 재개발도 재건축과 같은 70%로</text>
  <text x="40" y="66" font-size="14" fill="#6b7280">재건축은 작년(2025.1)부터 70% · 재개발만 75%로 남아 있던 걸 맞추는 개편안</text>

  <!-- scale: 0~80% over 480px, x0=170, 1%=6px -->
  <line x1="170" y1="100" x2="170" y2="270" stroke="#e5e7eb"/>

  <!-- 재개발 현행 75 -> 450px -->
  <rect x="170" y="110" width="450" height="38" rx="4" fill="#9ca3af"/>
  <text x="160" y="134" font-size="14" fill="#374151" text-anchor="end">재개발(현행)</text>
  <text x="630" y="134" font-size="14" font-weight="700" fill="#4b5563">75%</text>

  <!-- 재개발 개편 70 -> 420 -->
  <rect x="170" y="158" width="420" height="38" rx="4" fill="#f59e0b"/>
  <text x="160" y="182" font-size="14" fill="#374151" text-anchor="end">재개발(개편안)</text>
  <text x="600" y="182" font-size="14" font-weight="700" fill="#b45309">70%</text>

  <!-- 재건축 70 -> 420 -->
  <rect x="170" y="206" width="420" height="38" rx="4" fill="#cbd5e1"/>
  <text x="160" y="230" font-size="14" fill="#374151" text-anchor="end">재건축(현행)</text>
  <text x="600" y="230" font-size="14" font-weight="700" fill="#475569">70%</text>

  <text x="170" y="298" font-size="12" fill="#9ca3af">토지등소유자 동의율 기준(토지면적 50% 요건은 유지) · 출처: 국토교통부 2026.8.13 개편안(법 개정 전 발표안)</text>
</svg>
