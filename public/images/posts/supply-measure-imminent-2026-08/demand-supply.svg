<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="수요 억제와 공급 확대를 비교한 도식 — 수요 억제는 빠르나 총량이 그대로, 공급 확대는 느리나 살 집이 늘어남">
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="370" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">집값 대책의 두 축 — 수요 억제 vs 공급 확대</text>
  <text x="370" y="60" text-anchor="middle" font-size="13" fill="#888">지금까지는 수요 억제가 앞섰고, 이번엔 공급 대책이 초점이에요</text>

  <!-- 수요 억제 -->
  <rect x="40" y="88" width="320" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">🔻 수요 억제</text>
  <text x="60" y="152" font-size="13.5" fill="#444">• 세금(종부세·양도세) 강화</text>
  <text x="60" y="178" font-size="13.5" fill="#444">• 대출 규제(DSR·LTV)</text>
  <text x="60" y="204" font-size="13.5" fill="#444">• '사려는 힘'을 누르는 방식</text>
  <text x="60" y="238" font-size="13" fill="#1d4ed8">→ 빠르지만 공급 총량은 그대로</text>
  <text x="60" y="262" font-size="12" fill="#999">억눌린 수요는 사라지지 않고 대기</text>

  <!-- 공급 확대 -->
  <rect x="380" y="88" width="320" height="200" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">🔺 공급 확대</text>
  <text x="400" y="152" font-size="13.5" fill="#444">• 택지·정비사업(재건축·재개발)</text>
  <text x="400" y="178" font-size="13.5" fill="#444">• 인허가~입주까지 시간 소요</text>
  <text x="400" y="204" font-size="13.5" fill="#444">• '실제 살 집'을 늘리는 방식</text>
  <text x="400" y="238" font-size="13" fill="#15803d">→ 느리지만 총량을 바꿈</text>
  <text x="400" y="262" font-size="12" fill="#999">효과 나오려면 수년의 시차</text>

  <text x="370" y="315" text-anchor="middle" font-size="11" fill="#aaa">개념 비교 · 옳은경제 정리 · 2026.08</text>
</svg>
