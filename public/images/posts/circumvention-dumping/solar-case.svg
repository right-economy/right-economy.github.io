<line x1="160" y1="78" x2="160" y2="268" stroke="#5b6b7a" stroke-width="2"/>
<line x1="340" y1="78" x2="340" y2="268" stroke="#eaf0f6"/>
<line x1="520" y1="78" x2="520" y2="268" stroke="#eaf0f6"/>
<line x1="700" y1="78" x2="700" y2="268" stroke="#eaf0f6"/>
<text class="c" x="156" y="286">0</text>
<text class="c" x="330" y="286">3곳</text>
<text class="c" x="510" y="286">6곳</text>
<text class="c" x="690" y="286">9곳</text>

<text class="n" x="28" y="100">캄보디아</text>
<rect x="160" y="88" width="60" height="18" fill="#2f6fb5"/>
<text class="v" x="228" y="102">1</text>

