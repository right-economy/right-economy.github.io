<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="2023년 미국 태양광 우회 조사 결과를 나라별로 그린 막대그래프입니다. 불리한 사실이 적용된 기업은 캄보디아 1곳, 말레이시아 5곳, 태국 8곳, 베트남 9곳이고, 우회가 아니라고 판정된 기업은 말레이시아 2곳과 베트남 1곳입니다.">
<style>
text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1b2733}
.t{font-size:17px;font-weight:700}
.n{font-size:13px;font-weight:700}
.v{font-size:12px;font-weight:700;fill:#1b2733}
.c{font-size:12px;fill:#5b6b7a}
.lg{font-size:12px;fill:#2a3542}
</style>
<rect width="720" height="340" fill="#ffffff"/>
<text class="t" x="28" y="34">태양광 우회 조사 결과의 나라별 기업 수</text>

<rect x="176" y="48" width="12" height="12" fill="#2f6fb5"/>
