<rect x="160" y="184" width="480" height="18" fill="#2f6fb5"/>
<text class="v" x="648" y="198">8</text>

<text class="n" x="28" y="240">베트남</text>
<rect x="160" y="228" width="540" height="18" fill="#2f6fb5"/>
<text class="v" x="676" y="242">9</text>
<rect x="160" y="250" width="60" height="14" fill="#b4531a"/>
<text class="v" x="228" y="262">1</text>

<text class="c" x="28" y="312">네 나라 모두 국가 단위로 우회가 있다고 판정됐고, 위 막대에 없는 기업은 공고의 부록 목록에 따라 다르게 다뤄진다.</text>
<text class="c" x="28" y="330">기준: 2023.08.23 최종 판정 공고 · 단위: 기업 수 · 출처: 미국 연방관보 88 FR 57419 부록 2·3</text>
