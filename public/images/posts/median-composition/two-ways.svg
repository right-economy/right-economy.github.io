<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" role="img" aria-label="구 전체 중앙값으로는 송파 -13.5%, 서초 -11.7%, 강남 -5.9%인데 같은 단지끼리 묶으면 각각 +5.4%, +1.9%, +3.1%로 부호가 바뀐다. 내렸다고 나온 여섯 구가 전부 오름으로 바뀌고, 크게 오른 양천·동대문도 폭이 6%대로 줄어든다. 양쪽 끝이 다 과장돼 있었다는 뜻이다">
  <rect width="640" height="496" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">같은 자료를 두 가지로 세면 부호가 바뀌어요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">서울 전용 84㎡대 · 2026년 3~4월 대비 7~8월 · 국토교통부 실거래 · 2026년 9월 14일 집계</text>

  <text x="96" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A8F98">자치구</text>
  <text x="250" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A8F98">구 전체 중앙값</text>
  <text x="410" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1F2328">같은 단지끼리</text>
  <text x="520" y="98" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#8A8F98">단지 수</text>
  <line x1="32" y1="108" x2="608" y2="108" stroke="#E5E0D0"/>

  <text x="96" y="136" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">송파</text>
  <text x="250" y="136" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">−13.5%</text>
  <text x="410" y="136" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+5.4%</text>
  <text x="520" y="136" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">46곳</text>

  <text x="96" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">서초</text>
  <text x="250" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">−11.7%</text>
  <text x="410" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+1.9%</text>
  <text x="520" y="168" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">18곳</text>

  <text x="96" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">강남</text>
  <text x="250" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">−5.9%</text>
  <text x="410" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+3.1%</text>
  <text x="520" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">17곳</text>

  <text x="96" y="232" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">용산</text>
  <text x="250" y="232" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">−6.6%</text>
  <text x="410" y="232" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+5.7%</text>
  <text x="520" y="232" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">13곳</text>

  <text x="96" y="264" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">금천</text>
  <text x="250" y="264" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">−3.8%</text>
  <text x="410" y="264" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+6.5%</text>
  <text x="520" y="264" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">16곳</text>

  <text x="96" y="296" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">노원</text>
  <text x="250" y="296" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">−1.0%</text>
  <text x="410" y="296" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+5.3%</text>
  <text x="520" y="296" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">83곳</text>

  <line x1="32" y1="316" x2="608" y2="316" stroke="#E5E0D0" stroke-dasharray="4 3"/>
  <text x="32" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">아래 둘은 구 전체가 크게 오른 곳이에요 — 이쪽도 폭이 줄어듭니다</text>

  <text x="96" y="366" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#4B5563">양천</text>
  <text x="250" y="366" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">+22.4%</text>
  <text x="410" y="366" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+6.9%</text>
  <text x="520" y="366" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">45곳</text>

  <text x="96" y="398" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#4B5563">동대문</text>
  <text x="250" y="398" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">+21.6%</text>
  <text x="410" y="398" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">+5.8%</text>
  <text x="520" y="398" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">47곳</text>

  <line x1="32" y1="420" x2="608" y2="420" stroke="#E5E0D0"/>
  <text x="32" y="444" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">내린 여섯 구 모두 「같은 단지끼리」로 세면 올랐어요</text>
  <text x="32" y="466" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">「같은 단지끼리」는 두 기간에 모두 거래된 단지의 변화율 중앙값이에요 · 용산 13곳·금천 16곳·강남 17곳·서초 18곳은 표본이 작습니다</text>
  <text x="32" y="484" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">해제 신고분 제외 · 실거래는 신고가 계속 들어와 집계 시점에 따라 건수가 달라집니다</text>
</svg>
