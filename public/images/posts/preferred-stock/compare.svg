<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="보통주는 의결권이 있고 배당은 나중이며, 우선주는 의결권이 없는 대신 배당을 먼저 받는다는 비교표">
  <style>
    .t{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .h{font-size:17px;font-weight:700}
    .k{font-size:14px;fill:#78716c}
    .v{font-size:16px;font-weight:700;fill:#292524}
  </style>
  <rect width="720" height="330" fill="#fffdfa"/>
  <text class="t" x="24" y="36" font-size="16" font-weight="700" fill="#292524">같은 회사가 발행한 두 가지 주식</text>

  <rect x="24" y="58" width="320" height="212" rx="12" fill="#fff2ec" stroke="#ece4d6"/>
  <text class="t h" x="44" y="92" fill="#c2410c">보통주</text>
  <text class="t k" x="44" y="126">의결권</text><text class="t v" x="200" y="126">있음</text>
  <text class="t k" x="44" y="166">배당 순서</text><text class="t v" x="200" y="166">우선주 다음</text>
  <text class="t k" x="44" y="206">거래</text><text class="t v" x="200" y="206">대체로 활발</text>
  <text class="t k" x="44" y="246">종목명</text><text class="t v" x="200" y="246">회사이름</text>

  <rect x="376" y="58" width="320" height="212" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text class="t h" x="396" y="92" fill="#c2410c">우선주</text>
  <text class="t k" x="396" y="126">의결권</text><text class="t v" x="552" y="126">원칙적으로 없음</text>
  <text class="t k" x="396" y="166">배당 순서</text><text class="t v" x="552" y="166">보통주보다 먼저</text>
  <text class="t k" x="396" y="206">거래</text><text class="t v" x="552" y="206">대체로 적음</text>
  <text class="t k" x="396" y="246">종목명</text><text class="t v" x="552" y="246">회사이름 + 우</text>

  <text class="t" x="24" y="300" font-size="13" fill="#78716c">회사는 하나인데 주식이 둘이라 주가도 따로 붙습니다 · 옳은경제 개념 정리</text>
  <text class="t" x="24" y="322" font-size="12" fill="#a8a29e">우선주 종류·조건은 회사마다 다릅니다. 개별 종목의 정관을 확인해야 정확합니다.</text>
</svg>
