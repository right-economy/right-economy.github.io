<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="대출을 갈아탈 때 한 번 내는 비용과 남은 기간 동안 아끼는 이자를 저울처럼 두 줄로 비교해 아끼는 쪽이 크면 갈아타고 작으면 기다리는 판단 구조를 보여주는 도식">
  <rect width="760" height="330" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .note{font-size:12px;fill:#7a7066}
    .lbl{font-size:13.5px;font-weight:700}
    .sub{font-size:11.5px;fill:#7a7066}
    .val{font-size:13px;font-weight:700}
    .who{font-size:12.5px;font-weight:700;fill:#7a7066}
  </style>

  <text class="title" x="30" y="34">갈아탈지는 두 숫자를 견줘서 정한다</text>
  <text class="note" x="30" y="56">금액은 설명을 위한 예시다. 실제 수수료율·절감액은 상품과 잔여기간에 따라 다르다</text>

  <text class="who" x="30" y="100">지금 한 번 나가는 돈</text>
  <rect x="30" y="110" width="300" height="42" rx="5" fill="#7c2d12"/>
  <text class="val" x="180" y="136" text-anchor="middle" fill="#ffffff">중도상환수수료 + 부대비용</text>
  <text class="sub" x="30" y="170">인지세·근저당 설정비도 여기 들어간다</text>

  <text class="who" x="30" y="214">남은 기간에 아끼는 돈</text>
  <rect x="30" y="224" width="520" height="42" rx="5" fill="#c2410c"/>
  <text class="val" x="290" y="250" text-anchor="middle" fill="#ffffff">금리 차이 × 남은 원금 × 남은 기간</text>
  <text class="sub" x="30" y="284">기간이 짧으면 이 막대가 짧아진다 — 금리 차가 커도 뒤집힐 수 있다</text>

  <text class="sub" x="30" y="312">아래가 길면 갈아타고, 위가 길면 면제 시점까지 기다리는 쪽을 본다. 금리 차이만 보고 정하면 위쪽을 빠뜨리게 된다.</text>
</svg>
