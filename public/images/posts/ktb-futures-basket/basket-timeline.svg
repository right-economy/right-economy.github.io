<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="2026년 12월물과 2027년 3월물의 거래 기간이 겹쳐 있고, 각 결제월물의 최종결제기준채권이 거래개시일 하루 전에 발표됐음을 시간 축 위에 보여주는 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:17px;font-weight:700;}
    .n{font-size:15px;font-weight:700;}
    .s{font-size:13px;}
    .cap{font-size:12px;}
  </style>
  <rect x="0" y="0" width="720" height="420" style="fill:#ffffff"/>
  <text x="24" y="34" class="h" style="fill:#1f2933">기준채권은 거래가 시작되기 하루 전에 발표됩니다</text>

  <path d="M80 300 H690" style="stroke:#cbd2d9;stroke-width:2"/>
  <text x="80" y="326" class="s" text-anchor="middle" style="fill:#616e7c">2026.6</text>
  <text x="260" y="326" class="s" text-anchor="middle" style="fill:#616e7c">2026.9</text>
  <text x="440" y="326" class="s" text-anchor="middle" style="fill:#616e7c">2026.12</text>
  <text x="620" y="326" class="s" text-anchor="middle" style="fill:#616e7c">2027.3</text>
  <path d="M80 294 V306 M260 294 V306 M440 294 V306 M620 294 V306" style="stroke:#cbd2d9;stroke-width:2"/>

  <rect x="112" y="98" width="356" height="46" rx="8" style="fill:#fff3e6;stroke:#e8743b;stroke-width:2"/>
  <text x="290" y="127" class="n" text-anchor="middle" style="fill:#8a3b12">2026년 12월물 거래 기간</text>
  <text x="112" y="88" class="s" style="fill:#8a3b12">6.17 거래개시</text>
  <text x="468" y="88" class="s" text-anchor="end" style="fill:#8a3b12">12.15 최종거래일</text>
  <path d="M112 144 V294 M468 144 V294" style="stroke:#e8743b;stroke-width:1;stroke-dasharray:4 4"/>

  <rect x="290" y="186" width="360" height="46" rx="8" style="fill:#eef6ff;stroke:#2f6fa8;stroke-width:2"/>
  <text x="470" y="215" class="n" text-anchor="middle" style="fill:#1b4a73">2027년 3월물 거래 기간</text>
  <text x="290" y="176" class="s" style="fill:#1b4a73">9.16 거래개시</text>
  <text x="650" y="176" class="s" text-anchor="end" style="fill:#1b4a73">2027.3.16 최종거래일</text>
  <path d="M290 232 V294 M650 232 V294" style="stroke:#2f6fa8;stroke-width:1;stroke-dasharray:4 4"/>

  <circle cx="106" cy="60" r="5" style="fill:#8a3b12"/>
  <text x="120" y="65" class="s" style="fill:#8a3b12">6.16 기준채권 지정 발표</text>
  <circle cx="284" cy="60" r="5" style="fill:#1b4a73"/>
  <text x="298" y="65" class="s" style="fill:#1b4a73">9.15 기준채권 지정 발표</text>

  <text x="24" y="356" class="cap" style="fill:#616e7c">그림이 보여주는 것: 두 결제월물의 거래 기간이 겹치는 동안 각각 다른 기준채권 묶음을 들고 있다는 것</text>
  <text x="24" y="376" class="cap" style="fill:#616e7c">기준: 2026.6.16 및 2026.9.15 지정 · 출처: 한국거래소 최종결제기준채권 지정 내역 보도</text>
  <text x="24" y="396" class="cap" style="fill:#616e7c">최종거래일은 결제월 세 번째 화요일이라는 상품명세에서 계산한 날짜이며 공휴일이면 앞당겨집니다.</text>
</svg>
