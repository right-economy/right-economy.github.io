<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img"
     aria-label="2026년 3월 6일 시행된 개정 상법의 자기주식 소각 기한 도식. 시행일 이후 새로 취득한 자기주식은 취득일로부터 1년 이내, 시행 전부터 보유하던 자기주식은 시행일로부터 1년 6개월 이내에 소각해야 한다.">
  <rect width="720" height="260" fill="#fcfcfd"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a2540">언제까지 없애야 하나</text>
  <text x="24" y="56" font-family="sans-serif" font-size="12" fill="#5b6478">개정 상법 2026년 3월 6일 공포·시행 기준</text>

  <text x="24" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a2540">새로 사들인 자사주</text>
  <rect x="24" y="110" width="300" height="34" rx="6" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="174" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">취득일부터 1년</text>
  <path d="M332 127 L372 127" stroke="#2f5fb3" stroke-width="2.2" marker-end="url(#d1)"/>
  <text x="382" y="132" font-family="sans-serif" font-size="13" fill="#2f5fb3">소각</text>

  <text x="24" y="186" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a2540">시행 전부터 들고 있던 자사주</text>
  <rect x="24" y="198" width="450" height="34" rx="6" fill="#f7f8fa" stroke="#ccd1da"/>
  <text x="249" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a2540">시행일부터 1년 6개월 (유예 6개월 포함)</text>
  <path d="M482 215 L522 215" stroke="#2f5fb3" stroke-width="2.2" marker-end="url(#d2)"/>
  <text x="532" y="220" font-family="sans-serif" font-size="13" fill="#2f5fb3">소각</text>

  <defs>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2f5fb3"/></marker>
    <marker id="d2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2f5fb3"/></marker>
  </defs>
</svg>
