<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"
     aria-label="자사주 매입과 소각의 단계별 변화 도식. 매입 단계에서는 발행주식 수와 자본금이 그대로이고 유통주식 수만 줄며, 소각 단계에서 발행주식 수가 줄고 배당가능이익으로 산 주식이면 자본금은 그대로 남는다는 비교.">
  <rect width="720" height="330" fill="#fcfcfd"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a2540">같은 자사주라도 단계마다 줄어드는 것이 다릅니다</text>

  <rect x="24" y="56" width="200" height="92" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="124" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a2540">① 매입</text>
  <text x="124" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">회사가 시장에서 사들임</text>
  <text x="124" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">회사 돈이 나간다</text>

  <path d="M232 102 L278 102" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#t1)"/>

  <rect x="286" y="56" width="200" height="92" rx="8" fill="#f7f8fa" stroke="#ccd1da"/>
  <text x="386" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a2540">② 보유</text>
  <text x="386" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">금고에 들고 있는 상태</text>
  <text x="386" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">다시 팔 수도 있다</text>

  <path d="M494 102 L540 102" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#t2)"/>

  <rect x="548" y="56" width="148" height="92" rx="8" fill="#eef7ef" stroke="#8fbf9a"/>
  <text x="622" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a2540">③ 소각</text>
  <text x="622" y="108" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">주식을 없앤다</text>
  <text x="622" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">되돌릴 수 없다</text>

  <line x1="24" y1="176" x2="696" y2="176" stroke="#d7dbe3"/>
  <text x="24" y="202" font-family="sans-serif" font-size="13" font-weight="700" fill="#5b6478">무엇이 어떻게 바뀌나</text>

  <text x="24" y="232" font-family="sans-serif" font-size="13" fill="#1a2540">유통주식 수</text>
  <text x="300" y="232" font-family="sans-serif" font-size="13" fill="#2f5fb3">줄어든다</text>
  <text x="548" y="232" font-family="sans-serif" font-size="13" fill="#2f5fb3">줄어든 채 그대로</text>

  <text x="24" y="262" font-family="sans-serif" font-size="13" fill="#1a2540">발행주식 수</text>
  <text x="300" y="262" font-family="sans-serif" font-size="13" fill="#8a93a6">그대로</text>
  <text x="548" y="262" font-family="sans-serif" font-size="13" fill="#2f5fb3">줄어든다</text>

  <text x="24" y="292" font-family="sans-serif" font-size="13" fill="#1a2540">자본금</text>
  <text x="300" y="292" font-family="sans-serif" font-size="13" fill="#8a93a6">그대로</text>
  <text x="548" y="292" font-family="sans-serif" font-size="13" fill="#8a93a6">그대로 (이익으로 산 경우)</text>

  <defs>
    <marker id="t1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2f5fb3"/></marker>
    <marker id="t2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#2f5fb3"/></marker>
  </defs>
</svg>
