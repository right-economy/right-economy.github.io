<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="상생임대 사례에서 2027년 3.6억이던 양도세가 2028년 6.98억, 2029년 7.84억으로 늘어나는 모의계산">
  <rect width="640" height="400" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">언제 파느냐로 갈리는 양도세 — 상생임대 모의사례</text>
  <text x="320" y="59" text-anchor="middle" font-size="12.5" fill="#6b7280">같은 집을 매도 시점만 달리했을 때 · 출처: 헤럴드경제(2026.8) 모의계산</text>

  <line x1="80" y1="320" x2="600" y2="320" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 2027: 3.6억, 장특 50% -->
  <rect x="120" y="230" width="90" height="90" rx="4" fill="#86efac"/>
  <text x="165" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">3.6억</text>
  <text x="165" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">2027년</text>
  <text x="165" y="360" text-anchor="middle" font-size="11" fill="#6b7280">장특공제 50%</text>

  <!-- 2028: 6.98억, 장특 10% -->
  <rect x="275" y="146" width="90" height="174" rx="4" fill="#fbbf24"/>
  <text x="320" y="134" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">6.98억</text>
  <text x="320" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">2028년</text>
  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#6b7280">장특공제 10%</text>

  <!-- 2029: 7.84억, 장특 0% -->
  <rect x="430" y="118" width="90" height="202" rx="4" fill="#f87171"/>
  <text x="475" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">7.84억</text>
  <text x="475" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">2029년</text>
  <text x="475" y="360" text-anchor="middle" font-size="11" fill="#6b7280">장특공제 0%</text>

  <text x="320" y="388" text-anchor="middle" font-size="11.5" fill="#9ca3af">※ 개편안 단계별 축소 가정에 따른 모의치 — 국회 통과 전이라 확정 아님. 실제는 개인 조건별로 달라져요.</text>
</svg>
