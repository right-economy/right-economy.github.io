<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="정상가격은 먼저 수출국 내수 판매가격으로 정하고, 내수 판매가 없거나 수입국 판매량의 5퍼센트에 못 미치는 등 제대로 비교할 수 없을 때 적절한 제3국 수출가격이나 생산비에 관리판매비와 이윤을 더한 구성가격으로 넘어간다는 순서를 보여주는 도식입니다.">
<style>
text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1b2733}
.t{font-size:17px;font-weight:700}
.h{font-size:15px;font-weight:700}
.s{font-size:12px;fill:#3b4754}
.c{font-size:12px;fill:#5b6b7a}
</style>
<rect width="720" height="340" fill="#ffffff"/>
<text class="t" x="28" y="36">정상가격은 내수가격부터 보고, 못 쓰면 넘어갑니다</text>

<rect x="28" y="58" width="300" height="92" rx="8" fill="#eaf0f6" stroke="#2f6fb5" stroke-width="2"/>
<text class="h" x="46" y="84">① 수출국 내수 판매가격</text>
<text class="s" x="46" y="108">통상적인 거래에서 소비용으로 팔린</text>
<text class="s" x="46" y="128">같은 물건의 가격</text>

<path d="M180 152 L180 180 L180 186" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="180,194 175,184 185,184" fill="#5b6b7a"/>
<rect x="28" y="200" width="300" height="76" rx="8" fill="#ffffff" stroke="#c2562f"/>
<text class="h" x="46" y="226">쓸 수 없는 경우</text>
<text class="s" x="46" y="248">내수 판매 없음, 수입국 판매량의 5% 미만,</text>
<text class="s" x="46" y="266">특수한 시장 상황</text>

<path d="M332 238 L360 238" fill="none" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="368,238 358,233 358,243" fill="#5b6b7a"/>

<rect x="382" y="100" width="310" height="86" rx="8" fill="#eaf0f6" stroke="#2f6fb5"/>
<text class="h" x="400" y="126">② 제3국 수출가격</text>
<text class="s" x="400" y="150">적절한 제3국으로 수출한 가격</text>
<text class="c" x="400" y="170">대표성이 있어야 합니다</text>

<rect x="382" y="200" width="310" height="86" rx="8" fill="#eaf0f6" stroke="#2f6fb5"/>
<text class="h" x="400" y="226">② 구성가격</text>
<text class="s" x="400" y="250">원산지국 생산비 + 관리비·판매비 + 이윤</text>
<text class="c" x="400" y="270">이윤 출처에 따라 값이 달라집니다</text>
<path d="M368 238 L374 238 L374 143 L380 143" fill="none" stroke="#5b6b7a" stroke-width="2"/>

<text class="c" x="28" y="314">기준: WTO 반덤핑협정 제2조 1항·2항 및 제2조 2항 각주 · 출처: WTO 협정문</text>
</svg>
