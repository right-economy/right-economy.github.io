<line x1="590" y1="60" x2="590" y2="248" stroke="#eaf0f6"/>
<text class="c" x="186" y="266">0</text>
<text class="c" x="313" y="266">10%</text>
<text class="c" x="446" y="266">20%</text>
<text class="c" x="580" y="266">30%</text>

<text class="n" x="28" y="92">넥스틸</text>
<rect x="190" y="76" width="399" height="12" fill="none" stroke="#7fa6cc" stroke-dasharray="4 3"/>
<rect x="190" y="76" width="389" height="26" fill="#2f6fb5"/>
<text class="v" x="594" y="96">29.18%</text>
