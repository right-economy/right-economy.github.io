<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="2023년에서 2024년 한국산 유정용 강관 반덤핑 연례재심의 가중평균 덤핑률 막대그래프입니다. 넥스틸은 29.94퍼센트에서 29.18퍼센트로 정정됐고, 세아제강은 9.80퍼센트이며, 개별 조사를 받지 않은 기업은 19.87퍼센트에서 19.49퍼센트로 정정됐습니다.">
<style>
text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1b2733}
.t{font-size:17px;font-weight:700}
.n{font-size:13px;font-weight:700}
.v{font-size:13px;font-weight:700;fill:#1b2733}
.s{font-size:12px;fill:#3b4754}
.c{font-size:12px;fill:#5b6b7a}
</style>
<rect width="720" height="330" fill="#ffffff"/>
<text class="t" x="28" y="34">유정용 강관 2023~2024년 연례재심 덤핑률</text>

<line x1="190" y1="60" x2="190" y2="248" stroke="#5b6b7a" stroke-width="2"/>
<line x1="323" y1="60" x2="323" y2="248" stroke="#eaf0f6"/>
