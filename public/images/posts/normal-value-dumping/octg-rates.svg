<text class="c" x="28" y="294">점선은 2026년 9월 24일 최종 결과, 막대는 11월 16일 정정 공고 기준입니다.</text>
<text class="c" x="28" y="314">단위: 퍼센트 · 출처: 미국 연방관보 91 FR 60583, FR Doc 2026-23258</text>
