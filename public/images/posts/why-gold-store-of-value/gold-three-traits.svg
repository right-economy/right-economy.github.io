<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="금이 가치 저장 수단인 세 가지 이유 — 희소성(못 늘림)·불변성(안 썩음)·보편적 신뢰(어디서나 인정)를 카드로 정리한 도식">
  <rect width="740" height="360" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#1a1a1a">금이 수천 년 '가치 저장' 수단인 세 가지 이유</text>
  <text x="40" y="56" font-size="13" fill="#6b7280">국가·기업의 신용과 무관하게 가치를 지켜온 실물</text>

  <!-- 1 희소성 -->
  <rect x="40" y="92" width="215" height="210" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="147" y="128" font-size="34" text-anchor="middle">⛏️</text>
  <text x="147" y="164" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">① 희소성</text>
  <text x="147" y="196" font-size="13" fill="#78350f" text-anchor="middle">양이 한정돼 있고</text>
  <text x="147" y="216" font-size="13" fill="#78350f" text-anchor="middle">쉽게 못 늘려요</text>
  <text x="147" y="248" font-size="12.5" fill="#92400e" text-anchor="middle">돈처럼 '찍어낼' 수 없어</text>
  <text x="147" y="266" font-size="12.5" fill="#92400e" text-anchor="middle">가치가 잘 안 희석돼요</text>

  <!-- 2 불변성 -->
  <rect x="262" y="92" width="215" height="210" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="369" y="128" font-size="34" text-anchor="middle">✨</text>
  <text x="369" y="164" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">② 불변성</text>
  <text x="369" y="196" font-size="13" fill="#78350f" text-anchor="middle">녹슬거나 썩지 않고</text>
  <text x="369" y="216" font-size="13" fill="#78350f" text-anchor="middle">오래 보관돼요</text>
  <text x="369" y="248" font-size="12.5" fill="#92400e" text-anchor="middle">수천 년 전 금도</text>
  <text x="369" y="266" font-size="12.5" fill="#92400e" text-anchor="middle">그대로 남아 있어요</text>

  <!-- 3 보편 신뢰 -->
  <rect x="484" y="92" width="215" height="210" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="591" y="128" font-size="34" text-anchor="middle">🌍</text>
  <text x="591" y="164" font-size="17" font-weight="700" fill="#b45309" text-anchor="middle">③ 보편적 신뢰</text>
  <text x="591" y="196" font-size="13" fill="#78350f" text-anchor="middle">어느 나라·시대든</text>
  <text x="591" y="216" font-size="13" fill="#78350f" text-anchor="middle">가치를 인정받아요</text>
  <text x="591" y="248" font-size="12.5" fill="#92400e" text-anchor="middle">특정 국가 신용에</text>
  <text x="591" y="266" font-size="12.5" fill="#92400e" text-anchor="middle">기대지 않아요</text>

  <text x="370" y="340" font-size="11.5" fill="#9ca3af" text-anchor="middle">개념 도식 · 특정 자산의 매수·매도를 권유하지 않아요 · 옳은경제 정리</text>
</svg>
