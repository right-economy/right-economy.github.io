<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="개인투자용 국채의 가산금리가 청약한 달에 따라 달라진 것을 비교한 막대 그래프. 2026년 1월 청약분은 5년물 0.3퍼센트, 10년물 1.0퍼센트, 20년물 1.25퍼센트였고, 같은 해 10월 청약분은 5년물 0.05퍼센트, 10년물 0.28퍼센트, 20년물 0.43퍼센트였다. 세 종목 모두 1월보다 10월에 크게 낮아졌고 10년물은 1.0퍼센트에서 0.28퍼센트로 0.72퍼센트포인트 줄었다">
  <rect width="760" height="400" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .note{font-size:12px;fill:#7a7066}
    .axis{font-size:11.5px;fill:#7a7066}
    .val{font-size:13px;font-weight:900}
    .cat{font-size:13px;font-weight:700}
    .legend{font-size:12px;fill:#7a7066}
  </style>

  <text class="title" x="30" y="34">같은 종목인데 청약한 달에 따라 가산금리가 달랐다</text>
  <text class="note" x="30" y="56">개인투자용 국채 종목별 가산금리 · 단위: % · 기준: 2026.01 청약분과 2026.10 청약분</text>

  <line x1="80" y1="300" x2="720" y2="300" stroke="#c9bfae" stroke-width="1.5"/>
  <line x1="80" y1="225" x2="720" y2="225" stroke="#e8e2d6" stroke-width="1"/>
  <line x1="80" y1="150" x2="720" y2="150" stroke="#e8e2d6" stroke-width="1"/>
  <text class="axis" x="48" y="304">0</text>
  <text class="axis" x="40" y="229">0.5</text>
  <text class="axis" x="40" y="154">1.0</text>

  <rect x="129" y="255" width="56" height="45" rx="4" fill="#c2410c"/>
  <text class="val" x="137" y="247" style="fill:#c2410c">0.30</text>
  <rect x="195" y="292" width="56" height="8" rx="3" fill="#f4a97b"/>
  <text class="val" x="203" y="284" style="fill:#7a7066">0.05</text>
  <text class="cat" x="167" y="328">5년물</text>

  <rect x="329" y="150" width="56" height="150" rx="4" fill="#c2410c"/>
  <text class="val" x="337" y="142" style="fill:#c2410c">1.00</text>
  <rect x="395" y="258" width="56" height="42" rx="4" fill="#f4a97b"/>
  <text class="val" x="403" y="250" style="fill:#7a7066">0.28</text>
  <text class="cat" x="363" y="328">10년물</text>

  <rect x="529" y="112" width="56" height="188" rx="4" fill="#c2410c"/>
  <text class="val" x="537" y="104" style="fill:#c2410c">1.25</text>
  <rect x="595" y="235" width="56" height="65" rx="4" fill="#f4a97b"/>
  <text class="val" x="603" y="227" style="fill:#7a7066">0.43</text>
  <text class="cat" x="563" y="328">20년물</text>

  <rect x="80" y="352" width="13" height="13" rx="3" fill="#c2410c"/>
  <text class="legend" x="100" y="363">2026년 1월 청약분</text>
  <rect x="226" y="352" width="13" height="13" rx="3" fill="#f4a97b"/>
  <text class="legend" x="246" y="363">2026년 10월 청약분</text>
  <text class="legend" x="420" y="363">출처: 기획재정부 발행계획, 미래에셋증권 청약 공고</text>
</svg>
