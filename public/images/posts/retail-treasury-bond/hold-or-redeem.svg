<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="개인투자용 국채를 만기까지 보유한 경우와 중도환매한 경우에 받는 이자가 어떻게 달라지는지 비교한 도식. 만기까지 보유하면 표면금리와 가산금리를 합산한 금리가 연복리로 쌓이고, 5년물 이상이면 매입금액 2억원 한도에서 이자소득이 14퍼센트로 분리과세된다. 중도환매하면 원금과 표면금리에 따른 이자만 돌아오고 가산금리와 분리과세는 빠진다">
  <rect width="760" height="350" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .note{font-size:12px;fill:#7a7066}
    .step{font-size:12.5px;font-weight:700;fill:#7a7066}
    .amt{font-size:18px;font-weight:900}
    .sub{font-size:11.5px;fill:#7a7066}
  </style>

  <text class="title" x="30" y="34">붙는 조건이 서로 다른 세 가지가 한 상품에 들어 있다</text>
  <text class="note" x="30" y="56">개인투자용 국채의 이자 계산 방식 · 기준: 2026.10 청약 기준 · 출처: 기획재정부 발행계획</text>

  <rect x="30" y="86" width="340" height="196" rx="12" fill="#f4f1ea" stroke="#c9bfae" stroke-width="1.5"/>
  <text class="step" x="52" y="114">만기까지 들고 있었을 때</text>
  <text class="amt" x="52" y="148" style="fill:#c2410c">세 가지가 전부 붙는다</text>
  <text class="sub" x="52" y="178">표면금리 + 가산금리를 합산한 금리</text>
  <text class="sub" x="52" y="200">이자가 해마다 원금에 더해지는 연복리</text>
  <text class="sub" x="52" y="222">5년물 이상이면 매입금액 2억원 한도에서</text>
  <text class="sub" x="52" y="242">이자소득을 14%로 분리과세</text>
  <text class="sub" x="52" y="266">가산금리는 만기 상환 때 한 번에 정산된다.</text>

  <rect x="392" y="86" width="338" height="196" rx="12" fill="#2a2521"/>
  <text class="step" x="414" y="114" style="fill:#c9bfae">중간에 되팔았을 때</text>
  <text class="amt" x="414" y="148" style="fill:#ffb877">표면금리 이자만 남는다</text>
  <text class="sub" x="414" y="178" style="fill:#c9bfae">원금과 표면금리에 따른 이자는 돌아온다</text>
  <text class="sub" x="414" y="200" style="fill:#ffb877">가산금리는 빠진다</text>
  <text class="sub" x="414" y="222" style="fill:#ffb877">분리과세도 적용되지 않는다</text>
  <text class="sub" x="414" y="246" style="fill:#c9bfae">언제부터 신청할 수 있는지와 한도는</text>
  <text class="sub" x="414" y="266" style="fill:#c9bfae">판매대행기관 공고에서 확인해야 한다.</text>

  <text class="sub" x="30" y="316">10년물을 2026년 10월에 청약했다면 표면금리 4.510%에 가산금리 0.28%가 더해지는데, 그 0.28%는 10년을 채운 경우에만 받는다.</text>
</svg>
