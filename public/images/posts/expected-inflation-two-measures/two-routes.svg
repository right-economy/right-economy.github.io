<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img"
     aria-label="기대인플레이션을 재는 두 경로 도식. 왼쪽은 설문 경로로, 가계와 전문가에게 앞으로의 물가상승률을 직접 물어 답을 집계한다. 오른쪽은 시장 경로로, 명목 국고채와 물가연동 국고채의 금리 차이를 계산해 손익분기 인플레이션을 얻는다. 두 경로가 재는 기간과 대상이 다르므로 같은 날에도 다른 숫자가 나온다.">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="24" y="34" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#1f2937">기대인플레이션은 직접 관측되지 않는다</text>
  <text x="24" y="54" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#8a94a6">그래서 묻거나(설문), 값에서 거꾸로 꺼낸다(시장)</text>

  <rect x="24" y="82" width="320" height="200" rx="10" fill="#eef4fb" stroke="#b9cfe6"/>
  <text x="44" y="110" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#1f4e79">① 물어본다 (설문)</text>
  <text x="44" y="140" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#33475b">한국은행 소비자동향조사</text>
  <text x="44" y="160" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5a6b7d">56개 도시 2,200가구 · 매월</text>
  <text x="44" y="180" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5a6b7d">앞으로 1년간 소비자물가 상승률</text>
  <text x="44" y="212" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#33475b">전문가 서베이</text>
  <text x="44" y="232" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5a6b7d">경제전문가 50명 · 분기 첫 달</text>
  <text x="44" y="262" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#7a5a2a">재는 기간: 1년</text>

  <rect x="376" y="82" width="320" height="200" rx="10" fill="#f1f6ef" stroke="#bcd6b8"/>
  <text x="396" y="110" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#2f5d33">② 값에서 꺼낸다 (시장)</text>
  <text x="396" y="140" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#33475b">손익분기 인플레이션(BEI)</text>
  <text x="396" y="166" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5a6b7d">명목 국고채 10년물 금리</text>
  <text x="396" y="186" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5a6b7d">− 물가연동 국고채 10년물 금리</text>
  <line x1="396" y1="196" x2="676" y2="196" stroke="#bcd6b8"/>
  <text x="396" y="216" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#2f5d33">= 채권시장이 보는 연평균 물가상승률</text>
  <text x="396" y="262" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#7a5a2a">재는 기간: 10년</text>

  <text x="24" y="306" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#8a94a6">기간도 응답 주체도 다르므로 두 숫자는 같아야 할 이유가 없다</text>
</svg>
