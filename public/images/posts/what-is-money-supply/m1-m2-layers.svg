<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="현금이 M1 안에, M1이 M2 안에 포함되는 통화량의 계층 구조를 나타낸 개념 도식">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#1a1a1a">통화량은 '얼마나 쉽게 쓸 수 있나'로 층을 나눠요</text>
  <text x="40" y="56" font-size="13" fill="#6b7280">바깥으로 갈수록 범위는 넓어지고, 당장 쓰긴 조금 덜 편해져요</text>

  <!-- M2 (바깥) -->
  <rect x="50" y="86" width="620" height="256" rx="14" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="68" y="112" font-size="16" font-weight="700" fill="#0369a1">M2 (광의통화)</text>
  <text x="68" y="132" font-size="12.5" fill="#0c4a6e">= M1 + 정기 예·적금, MMF, CD 등 (만기 2년 미만)</text>

  <!-- M1 (중간) -->
  <rect x="80" y="150" width="560" height="170" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="98" y="176" font-size="16" font-weight="700" fill="#1d4ed8">M1 (협의통화)</text>
  <text x="98" y="196" font-size="12.5" fill="#1e3a8a">= 현금 + 요구불·수시입출식 예금 (바로 찾아 쓰는 돈)</text>

  <!-- 현금 (안쪽) -->
  <rect x="110" y="214" width="500" height="90" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="128" y="242" font-size="16" font-weight="700" fill="#c2410c">현금 (지폐·동전)</text>
  <text x="128" y="264" font-size="12.5" fill="#7c2d12">지금 당장 손에 쥐고 쓸 수 있는, 가장 '즉시성' 높은 돈</text>
  <text x="128" y="286" font-size="12" fill="#9a3412">← 유동성(쓰기 쉬움) 가장 높음</text>

  <text x="360" y="366" font-size="11" fill="#9ca3af" text-anchor="middle">개념 도식 · 한국은행 통화지표 기준 정리 · 옳은경제</text>
</svg>
