<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="중앙은행이 RP를 매각하면 시중 자금이 흡수되고 RP를 매입하면 자금이 공급되는 두 방향을 나란히 보여주는 도식">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#1a1a1a">중앙은행은 RP 로 시중 자금의 양을 조절한다</text>
  <text x="40" y="58" font-size="13" fill="#6b7280">같은 계약을 어느 쪽에서 맺느냐에 따라 방향이 반대가 된다</text>

  <defs>
    <marker id="bR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#dc2626"/>
    </marker>
    <marker id="bG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 왼쪽: RP 매각 -->
  <rect x="40" y="86" width="330" height="200" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="205" y="116" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">RP 매각</text>
  <text x="205" y="138" font-size="12" fill="#991b1b" text-anchor="middle">중앙은행이 채권을 넘기고 현금을 받는다</text>

  <rect x="70" y="156" width="110" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="125" y="184" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">시중 은행</text>
  <line x1="186" y1="179" x2="224" y2="179" stroke="#dc2626" stroke-width="2.5" marker-end="url(#bR)"/>
  <rect x="230" y="156" width="110" height="46" rx="8" fill="#ffffff" stroke="#fca5a5"/>
  <text x="285" y="184" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">중앙은행</text>

  <text x="205" y="228" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">시중 자금이 빨려 들어간다</text>
  <text x="205" y="252" font-size="12" fill="#991b1b" text-anchor="middle">단기 금리를 올리는 쪽으로 작용</text>
  <text x="205" y="272" font-size="11.5" fill="#b91c1c" text-anchor="middle">돈이 너무 많이 풀렸다고 볼 때</text>

  <!-- 오른쪽: RP 매입 -->
  <rect x="390" y="86" width="330" height="200" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="555" y="116" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">RP 매입</text>
  <text x="555" y="138" font-size="12" fill="#166534" text-anchor="middle">중앙은행이 채권을 받고 현금을 내준다</text>

  <rect x="420" y="156" width="110" height="46" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="475" y="184" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">중앙은행</text>
  <line x1="536" y1="179" x2="574" y2="179" stroke="#16a34a" stroke-width="2.5" marker-end="url(#bG)"/>
  <rect x="580" y="156" width="110" height="46" rx="8" fill="#ffffff" stroke="#86efac"/>
  <text x="635" y="184" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">시중 은행</text>

  <text x="555" y="228" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">시중에 자금이 풀린다</text>
  <text x="555" y="252" font-size="12" fill="#166534" text-anchor="middle">단기 금리를 내리는 쪽으로 작용</text>
  <text x="555" y="272" font-size="11.5" fill="#15803d" text-anchor="middle">자금이 마른다고 볼 때</text>

  <text x="40" y="314" font-size="11" fill="#94a3b8">공개시장운영의 방향만 단순화한 개념 도식 · 실제 운영 규모·주기는 중앙은행이 그때그때 정한다</text>
</svg>
