<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="소형·저가주택이 청약에서는 무주택으로 인정되지만 세금에서는 제도마다 주택 수 포함 여부가 달라진다는 것을 보여주는 갈래 도식">
  <rect width="760" height="400" fill="#faf9f6"/>
  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a2e">작은 집 한 채, 제도마다 다르게 봐요</text>
  <rect x="305" y="62" width="150" height="62" rx="12" fill="#1a1a2e"/>
  <text x="380" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">🏠 소형·저가주택</text>
  <text x="380" y="110" text-anchor="middle" font-size="12" fill="#cbd5e1">작은 집 1채</text>
  <g stroke="#c9a227" stroke-width="2" fill="none">
    <path d="M340 124 C 250 165, 170 175, 150 205"/>
    <path d="M380 124 L 380 205"/>
    <path d="M420 124 C 510 165, 590 175, 610 205"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="55" y="205" width="190" height="120" rx="10" fill="#e6f5ec" stroke="#2f9e5f"/>
    <text x="150" y="232" fill="#166534">청약</text>
    <text x="150" y="258" font-size="14" font-weight="800" fill="#15803d">✅ 무주택 인정</text>
    <text x="150" y="284" font-size="11.5" font-weight="500" fill="#475569">비아파트 전용 85㎡·</text>
    <text x="150" y="302" font-size="11.5" font-weight="500" fill="#475569">공시 수도권 5억 이하</text>

    <rect x="285" y="205" width="190" height="120" rx="10" fill="#e8f0fe" stroke="#3b6fd4"/>
    <text x="380" y="232" fill="#1e40af">취득세</text>
    <text x="380" y="258" font-size="14" font-weight="800" fill="#1d4ed8">➖ 주택 수 제외</text>
    <text x="380" y="284" font-size="11.5" font-weight="500" fill="#475569">공시 1억 이하</text>
    <text x="380" y="302" font-size="11.5" font-weight="500" fill="#475569">(지방 2억, 2025~)</text>

    <rect x="515" y="205" width="190" height="120" rx="10" fill="#fdecec" stroke="#dc2626"/>
    <text x="610" y="232" fill="#b91c1c">양도세·종부세</text>
    <text x="610" y="258" font-size="14" font-weight="800" fill="#dc2626">➕ 원칙 포함</text>
    <text x="610" y="284" font-size="11.5" font-weight="500" fill="#475569">청약과 다른</text>
    <text x="610" y="302" font-size="11.5" font-weight="500" fill="#475569">별도 기준(특례)</text>
  </g>
  <text x="380" y="360" text-anchor="middle" font-size="14" fill="#334155">'청약 무주택'이라고 <tspan font-weight="700" fill="#b91c1c">'세금도 무주택'은 아니에요</tspan></text>
  <text x="380" y="384" text-anchor="middle" font-size="11" fill="#94a3b8">제도별 소형·저가주택 취급 · 기준 금액은 개정될 수 있음 · 옳은경제 정리</text>
</svg>
