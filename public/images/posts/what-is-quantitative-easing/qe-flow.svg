<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="중앙은행의 자산 매입이 유동성 증가·장기금리 하락을 거쳐 대출·투자·소비 회복으로 이어지는 양적완화의 작동 흐름 도식">
  <rect width="740" height="430" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#1a1a1a">양적완화(QE)는 어떻게 작동할까</text>
  <text x="40" y="58" font-size="13" fill="#6b7280">중앙은행이 자산을 사들여 시중에 돈을 직접 공급하는 흐름</text>

  <defs>
    <marker id="qeArrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- step boxes -->
  <rect x="60" y="86" width="620" height="50" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="370" y="117" font-size="15" font-weight="700" fill="#3730a3" text-anchor="middle">① 중앙은행이 국채·주택저당증권(MBS) 등을 시장에서 대량 매입</text>

  <rect x="60" y="154" width="620" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="185" font-size="15" fill="#334155" text-anchor="middle">② 그 대금이 은행·시장에 풀려 시중 현금(유동성)이 늘어난다</text>

  <rect x="60" y="222" width="620" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="253" font-size="15" fill="#334155" text-anchor="middle">③ 국채 수요가 늘어 장기금리가 내려간다</text>

  <rect x="60" y="290" width="620" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="370" y="321" font-size="15" fill="#334155" text-anchor="middle">④ 대출·투자·소비가 살아나고 주식·부동산 등 자산값이 오른다</text>

  <rect x="60" y="358" width="620" height="50" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="370" y="389" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">⑤ 얼어붙은 경기에 온기 → 물가·성장 회복을 노린다</text>

  <!-- arrows -->
  <line x1="370" y1="136" x2="370" y2="152" stroke="#94a3b8" stroke-width="2" marker-end="url(#qeArrow)"/>
  <line x1="370" y1="204" x2="370" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#qeArrow)"/>
  <line x1="370" y1="272" x2="370" y2="288" stroke="#94a3b8" stroke-width="2" marker-end="url(#qeArrow)"/>
  <line x1="370" y1="340" x2="370" y2="356" stroke="#94a3b8" stroke-width="2" marker-end="url(#qeArrow)"/>
</svg>
