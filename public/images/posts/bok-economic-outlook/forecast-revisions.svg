<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="한국은행이 발표한 2026년 성장률 전망치가 2월 2.0퍼센트, 5월 2.6퍼센트, 8월 3.3퍼센트로 두 번 올라간 것을 세로 막대로 비교한 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:19px;font-weight:700;}
    .n{font-size:15px;}
    .v{font-size:20px;font-weight:700;}
    .s{font-size:13px;}
  </style>
  <rect x="0" y="0" width="720" height="400" style="fill:#ffffff"/>
  <text class="h" x="32" y="40" style="fill:#1b2733">같은 해 성장률 전망이 반년 사이 1.3%포인트 올랐습니다</text>

  <line x1="100" y1="272" x2="660" y2="272" style="stroke:#c8d0d8;stroke-width:1.5"/>

  <rect x="140" y="152" width="96" height="120" rx="5" style="fill:#7fa6cc"/>
  <text class="v" x="160" y="140" style="fill:#1b2733">2.0%</text>
  <text class="n" x="155" y="296" style="fill:#3b4754">2월 전망</text>

  <rect x="312" y="116" width="96" height="156" rx="5" style="fill:#2f6fb5"/>
  <text class="v" x="332" y="104" style="fill:#1b2733">2.6%</text>
  <text class="n" x="327" y="296" style="fill:#3b4754">5월 전망</text>

  <rect x="484" y="74" width="96" height="198" rx="5" style="fill:#c2562f"/>
  <text class="v" x="504" y="62" style="fill:#1b2733">3.3%</text>
  <text class="n" x="499" y="296" style="fill:#3b4754">8월 전망</text>

  <text class="s" x="252" y="140" style="fill:#c2562f">+0.6%p</text>
  <text class="s" x="424" y="104" style="fill:#c2562f">+0.7%p</text>

  <text class="n" x="32" y="336" style="fill:#3b4754">세 번 모두 같은 해(2026년) 성장률을 가리킵니다. 막대 높이는 0%에서 시작합니다.</text>
  <text class="s" x="32" y="364" style="fill:#5a6672">단위: 전년 대비 %  ·  2월 전망은 직전 1.8%에서 상향, 8월 전망은 반도체 경기 호조를 상향 근거로 들었습니다.</text>
  <text class="s" x="32" y="384" style="fill:#5a6672">출처: 한국은행 경제전망(2026년 2월·5월·8월) 발표 보도 종합</text>
</svg>
