<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="전망이 붙는 금통위 날에는 통화정책방향 결정문과 총재 기자간담회에 더해 경제전망보고서가 함께 나오고, 전망이 없는 날에는 앞의 두 가지만 나온다는 것을 두 상자로 나란히 비교한 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:19px;font-weight:700;}
    .t{font-size:16px;font-weight:700;}
    .n{font-size:14px;}
    .s{font-size:13px;}
  </style>
  <rect x="0" y="0" width="720" height="330" style="fill:#ffffff"/>
  <text class="h" x="32" y="40" style="fill:#1b2733">같은 금통위라도 그날 손에 쥐는 자료가 다릅니다</text>

  <rect x="32" y="66" width="312" height="188" rx="8" style="fill:#fdf3ee;stroke:#c2562f;stroke-width:1.5"/>
  <text class="t" x="52" y="96" style="fill:#c2562f">2·5·8·11월 회의</text>
  <rect x="52" y="112" width="272" height="34" rx="5" style="fill:#ffffff;stroke:#e0cabd;stroke-width:1"/>
  <text class="n" x="66" y="134" style="fill:#3b4754">통화정책방향 결정문</text>
  <rect x="52" y="154" width="272" height="34" rx="5" style="fill:#ffffff;stroke:#e0cabd;stroke-width:1"/>
  <text class="n" x="66" y="176" style="fill:#3b4754">총재 기자간담회</text>
  <rect x="52" y="196" width="272" height="34" rx="5" style="fill:#c2562f"/>
  <text class="n" x="66" y="218" style="fill:#ffffff">경제전망보고서</text>

  <rect x="376" y="66" width="312" height="188" rx="8" style="fill:#f2f5f8;stroke:#7fa6cc;stroke-width:1.5"/>
  <text class="t" x="396" y="96" style="fill:#2f6fb5">1·4·7·10월 회의</text>
  <rect x="396" y="112" width="272" height="34" rx="5" style="fill:#ffffff;stroke:#cfdbe6;stroke-width:1"/>
  <text class="n" x="410" y="134" style="fill:#3b4754">통화정책방향 결정문</text>
  <rect x="396" y="154" width="272" height="34" rx="5" style="fill:#ffffff;stroke:#cfdbe6;stroke-width:1"/>
  <text class="n" x="410" y="176" style="fill:#3b4754">총재 기자간담회</text>
  <text class="n" x="410" y="218" style="fill:#6b7682">전망 숫자 없음</text>

  <line x1="32" y1="276" x2="688" y2="276" style="stroke:#c8d0d8;stroke-width:1"/>
  <text class="s" x="32" y="300" style="fill:#5a6672">의사록은 두 경우 모두 회의 약 2주 뒤에 따로 공개됩니다.</text>
  <text class="s" x="32" y="320" style="fill:#5a6672">기준: 2017년 이후 운영 방식 · 출처: 한국은행 통화정책 운영 안내</text>
</svg>
