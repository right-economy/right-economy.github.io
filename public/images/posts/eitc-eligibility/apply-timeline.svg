<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="근로장려금 신청 시기를 두 갈래로 보여주는 도식. 정기신청은 2026년 5월 1일부터 6월 1일까지이고 산정액의 100%를 받는다. 기한 후 신청은 2026년 6월 2일부터 12월 1일까지이고 95%만 받으며 신청일로부터 4개월 이내에 지급된다. 반기신청은 근로소득만 있는 사람만 고를 수 있고 상반기분은 2026년 9월 1일부터 15일까지, 하반기분은 2027년 3월 1일부터 15일까지다">
  <rect width="760" height="360" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .note{font-size:12px;fill:#6b6157}
    .way{font-size:13.5px;font-weight:800}
    .date{font-size:13px;font-weight:700}
    .pct{font-size:19px;font-weight:900;fill:#c2410c}
    .sub{font-size:11.5px;fill:#6b6157}
  </style>

  <text class="title" x="30" y="34">언제 신청하느냐로 받는 비율이 갈린다</text>
  <text class="note" x="30" y="56">2026년 신청분(2025년 귀속) 기준</text>

  <rect x="30" y="78" width="700" height="60" rx="10" fill="#f4f1ea" stroke="#c9bfae" stroke-width="1.5"/>
  <text class="way" x="52" y="104">정기신청</text>
  <text class="date" x="170" y="104">2026. 5. 1. ~ 6. 1.</text>
  <text class="pct" x="620" y="108">100%</text>
  <text class="sub" x="170" y="124">산정된 금액을 그대로 받는다</text>

  <rect x="30" y="148" width="700" height="60" rx="10" fill="#2a2521"/>
  <text class="way" x="52" y="174" style="fill:#ffb877">기한 후 신청</text>
  <text class="date" x="170" y="174" style="fill:#ffffff">2026. 6. 2. ~ 12. 1.</text>
  <text class="pct" x="628" y="178" style="fill:#ffb877">95%</text>
  <text class="sub" x="170" y="194" style="fill:#9a8f7a">5%가 깎인다 · 신청일로부터 4개월 안에 지급</text>

  <rect x="30" y="226" width="700" height="72" rx="10" fill="#ffffff" stroke="#c9bfae" stroke-width="1.5"/>
  <text class="way" x="52" y="252">반기신청</text>
  <text class="sub" x="52" y="272">근로소득만</text>
  <text class="sub" x="52" y="289">있는 사람만</text>
  <text class="date" x="170" y="252">상반기분  2026. 9. 1. ~ 9. 15.</text>
  <text class="date" x="170" y="277">하반기분  2027. 3. 1. ~ 3. 15.</text>
  <text class="sub" x="440" y="252">사업소득이나 종교인소득이 섞여 있으면</text>
  <text class="sub" x="440" y="277">이 길은 못 고르고 정기신청으로 간다</text>

  <text class="sub" x="30" y="332">출처: 국세청 「근로·자녀장려금 신청기간 및 방법」, 2026년 10월 19일 확인</text>
  <text class="sub" x="30" y="352">기한 후 신청의 5% 감액은 재산에 따른 감액과 별개로 겹쳐서 적용된다</text>
</svg>
