<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 205" role="img" aria-label="계좌정보통합관리와 Msafer로 내 이름의 계좌와 휴대폰 수를 세고 모르는 것이 있으면 신고로 넘어간다는 흐름 그림">
  <rect width="660" height="205" fill="#fbfaf7"/>
  <text x="330" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">막는 것과 이미 생긴 것을 찾는 것은 다릅니다</text>

  <rect x="40" y="56" width="165" height="62" rx="7" fill="#f3f1e8" stroke="#b5a86a"/>
  <text x="122" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#2b2b2b">계좌정보통합관리</text>
  <text x="122" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#555">내 계좌·카드를 셈</text>

