  <text x="330" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#2b2b2b">Msafer</text>
  <text x="330" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#555">내 휴대폰을 셈</text>

  <rect x="456" y="56" width="165" height="62" rx="7" fill="#f5eeee" stroke="#c38b8b"/>
  <text x="538" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#2b2b2b">모르는 게 있으면</text>
  <text x="538" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8a5a5a">해지·신고로</text>

  <path d="M210 87 L243 87" stroke="#999" stroke-width="2"/>
  <path d="M236 81 L244 87 L236 93 Z" fill="#999"/>
  <path d="M418 87 L451 87" stroke="#999" stroke-width="2"/>
  <path d="M444 81 L452 87 L444 93 Z" fill="#999"/>

  <text x="330" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">차단을 걸어도 이미 만들어진 것은 그대로 남습니다</text>
