<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="금융감독원은 계좌와 카드 발급을 막고 Msafer는 휴대폰 개통을 막으며 계좌정보통합관리는 차단이 아니라 확인용이라는 비교 그림">
  <rect width="660" height="250" fill="#fbfaf7"/>
  <text x="330" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">세 곳이 각각 다른 문을 잠급니다</text>

  <rect x="28" y="58" width="190" height="112" rx="8" fill="#eef3ec" stroke="#7a9a72"/>
  <text x="123" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">금융감독원</text>
  <text x="123" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#666">개인정보노출자</text>
