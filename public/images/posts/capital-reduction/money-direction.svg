<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img"
     aria-label="유상감자는 회사가 주주에게 현금을 주고 주식을 없애 자산과 자본금이 함께 줄고, 무상감자는 현금 이동 없이 자본금을 결손금과 상계해 자기자본 총액이 그대로인 구조를 비교한 도식.">
  <rect width="720" height="340" fill="#fcfcfd"/>
  <text x="24" y="34" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a2540">유상감자</text>
  <text x="24" y="56" font-family="sans-serif" font-size="13" fill="#5b6478">회사 밖으로 현금이 나간다</text>
  <rect x="24" y="72" width="150" height="76" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="99" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a2540">회사</text>
  <text x="99" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">자산 ↓</text>
  <path d="M182 110 L286 110" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#a1)"/>
  <text x="234" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2f5fb3">현금</text>
  <rect x="294" y="72" width="150" height="76" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="369" y="104" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a2540">주주</text>
  <text x="369" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">주식 수 ↓</text>
  <text x="470" y="104" font-family="sans-serif" font-size="13" fill="#1a2540">자본금도 줄고</text>
  <text x="470" y="126" font-family="sans-serif" font-size="13" fill="#1a2540">자기자본 총액도 줄어듭니다</text>

  <line x1="24" y1="178" x2="696" y2="178" stroke="#d7dbe3" stroke-dasharray="4 4"/>

  <text x="24" y="212" font-family="sans-serif" font-size="17" font-weight="700" fill="#1a2540">무상감자</text>
  <text x="24" y="234" font-family="sans-serif" font-size="13" fill="#5b6478">현금은 움직이지 않는다</text>
  <rect x="24" y="250" width="420" height="66" rx="8" fill="#f7f8fa" stroke="#ccd1da"/>
  <text x="54" y="278" font-family="sans-serif" font-size="13" fill="#1a2540">자본금</text>
  <path d="M110 274 L196 274" stroke="#8a93a6" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="206" y="278" font-family="sans-serif" font-size="13" fill="#1a2540">쌓인 결손금과 상계</text>
  <text x="54" y="302" font-family="sans-serif" font-size="12" fill="#5b6478">회사 안에서 계정만 옮깁니다</text>
  <text x="470" y="278" font-family="sans-serif" font-size="13" fill="#1a2540">자기자본 총액은</text>
  <text x="470" y="300" font-family="sans-serif" font-size="13" fill="#1a2540">그대로입니다</text>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2f5fb3"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8a93a6"/></marker>
  </defs>
</svg>
