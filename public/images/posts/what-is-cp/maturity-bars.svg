<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="국고채 10년, 회사채 3년, 기업어음 3개월로 만기 길이를 비교한 가로 막대 그래프. 기업어음이 압도적으로 짧다">
  <rect width="760" height="300" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .note{font-size:12px;fill:#7a7066}
    .lbl{font-size:13.5px;font-weight:600}
    .val{font-size:13.5px;font-weight:700;fill:#c2410c}
    .b1{fill:#d9d2c6}.b2{fill:#f4a97b}.b3{fill:#c2410c}
    .axis{stroke:#c9bfae;stroke-width:1.5}
  </style>
  <text class="title" x="30" y="34">얼마나 짧은가</text>
  <text class="note" x="30" y="56">같은 「빌린 돈」인데 갚기까지의 시간이 크게 다르다</text>
  <line class="axis" x1="190" y1="78" x2="190" y2="240"/>

  <text class="lbl" x="30" y="107">국고채 10년물</text>
  <rect class="b1" x="190" y="90" width="500" height="28" rx="4"/>
  <text class="val" x="700" y="109" fill="#8a8172">10년</text>

  <text class="lbl" x="30" y="165">회사채 3년물</text>
  <rect class="b2" x="190" y="148" width="150" height="28" rx="4"/>
  <text class="val" x="350" y="167">3년</text>

  <text class="lbl" x="30" y="223">기업어음(CP)</text>
  <rect class="b3" x="190" y="206" width="13" height="28" rx="3"/>
  <text class="val" x="213" y="225">3개월</text>

  <text class="note" x="30" y="272">막대 길이는 기간을 그대로 비례해 그렸다(10년=500px). 만기는 상품마다 다르며 여기 값은 흔한 예시다.</text>
</svg>
