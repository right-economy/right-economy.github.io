  <text x="524" y="197" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2c5c3f">225.3%</text>

  <rect x="60" y="210" width="320" height="28" rx="5" fill="#f7efe2"/>
  <text x="76" y="229" font-size="12.5" fill="#5a4636">응찰금리 범위</text>
