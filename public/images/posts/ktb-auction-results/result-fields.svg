  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">30년물 「국고02625-5509」 통합발행 경쟁입찰 · 2025년 9월 30일 · 출처: 한국은행 공시</text>

  <rect x="60" y="78" width="320" height="30" rx="5" fill="#eaf1f8"/>
