<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, sans-serif" role="img" aria-label="한국은행 국고채 경쟁입찰 결과 공시에 적히는 항목과 2025년 9월 30일 30년물 국고02625-5509 통합발행 입찰의 실제 값. 발행예정금액 44,000억원, 응찰금액 99,140억원, 응찰률 225.3%, 응찰금리 범위 2.790에서 2.850%, 최저낙찰금리 2.820%, 최고낙찰금리 2.820%, 가중평균낙찰금리 2.820%, 부분낙찰률 30.5%, 낙찰금액 44,000억원">
  <rect width="720" height="330" fill="#fffaf5"/>
