<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="장 종료 시점에 그날 체결이 있었으면 가장 나중에 성립된 약정가격을, 체결이 없었으면 당일 정산기준가격을 정산가격으로 쓴다는 것을 두 갈래로 보여주는 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:17px;font-weight:700;}
    .n{font-size:19px;font-weight:700;}
    .s{font-size:14px;}
    .cap{font-size:12px;}
  </style>
  <rect x="0" y="0" width="720" height="420" style="fill:#ffffff"/>
  <text x="24" y="36" class="h" style="fill:#1f2933">장 종료 시점에 정산가격을 고르는 자리</text>

  <rect x="238" y="56" width="244" height="60" rx="10" style="fill:#f5f7fa;stroke:#9aa5b1;stroke-width:2"/>
  <text x="360" y="83" class="s" text-anchor="middle" style="fill:#1f2933">장 종료</text>
  <text x="360" y="105" class="s" text-anchor="middle" style="fill:#616e7c">그날 체결된 거래가 있었나</text>

  <path d="M300 116 V146 H160 V172" style="stroke:#9aa5b1;stroke-width:2;fill:none"/>
  <path d="M160 172 l-5 -10 h10 z" style="fill:#9aa5b1"/>
  <path d="M420 116 V146 H560 V172" style="stroke:#9aa5b1;stroke-width:2;fill:none"/>
  <path d="M560 172 l-5 -10 h10 z" style="fill:#9aa5b1"/>
  <text x="196" y="140" class="s" style="fill:#616e7c">있다</text>
  <text x="482" y="140" class="s" text-anchor="end" style="fill:#616e7c">없다</text>

  <rect x="24" y="178" width="272" height="124" rx="10" style="fill:#fff3e6;stroke:#e8743b;stroke-width:2"/>
  <text x="160" y="208" class="n" text-anchor="middle" style="fill:#8a3b12">가장 나중에</text>
  <text x="160" y="232" class="n" text-anchor="middle" style="fill:#8a3b12">성립된 약정가격</text>
  <text x="160" y="262" class="s" text-anchor="middle" style="fill:#8a3b12">그날 마지막으로 체결된</text>
  <text x="160" y="284" class="s" text-anchor="middle" style="fill:#8a3b12">값을 그대로 씁니다</text>

  <rect x="424" y="178" width="272" height="124" rx="10" style="fill:#eef6ff;stroke:#2f6fa8;stroke-width:2"/>
  <text x="560" y="208" class="n" text-anchor="middle" style="fill:#1b4a73">당일 정산기준가격</text>
  <text x="560" y="236" class="s" text-anchor="middle" style="fill:#1b4a73">이론가격 등으로 만든 값</text>
  <text x="560" y="266" class="s" text-anchor="middle" style="fill:#1b4a73">체결이 한 건도 없는 날은</text>
  <text x="560" y="288" class="s" text-anchor="middle" style="fill:#1b4a73">시장가가 없기 때문입니다</text>

  <text x="24" y="340" class="cap" style="fill:#616e7c">그림이 보여주는 것: 선물 종목의 하루치 정산가격이 어느 값으로 정해지는지의 두 갈래</text>
  <text x="24" y="360" class="cap" style="fill:#616e7c">기준: 2025.10 · 출처: 한국거래소, 2025년 파생상품시장 제도개선사항 설명회 자료 중 결제제도 표</text>
  <text x="24" y="380" class="cap" style="fill:#616e7c">위 자료의 표는 그해 새로 상장한 선물의 제도 칸이며, 국채선물 상품명세 공시본에서</text>
  <text x="24" y="400" class="cap" style="fill:#616e7c">같은 문장을 직접 확인하지는 못했습니다.</text>
</svg>
