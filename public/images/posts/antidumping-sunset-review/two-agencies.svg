<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="미국 일몰재심에서 상무부는 덤핑의 지속 또는 재발 가능성과 철회 시 예상 덤핑률을 판정하고 국제무역위원회는 미국 산업의 실질적 피해의 지속 또는 재발 가능성을 판정하며, 두 판정이 모두 긍정일 때만 명령이 유지된다는 것을 보여주는 도식입니다.">
<style>
text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1b2733}
.t{font-size:17px;font-weight:700}
.h{font-size:15px;font-weight:700}
.s{font-size:12px;fill:#3b4754}
.c{font-size:12px;fill:#5b6b7a}
.b{font-size:13px;font-weight:700}
</style>
<rect width="720" height="330" fill="#ffffff"/>
<text class="t" x="28" y="36">두 기관이 각각 판정하고 둘 다 긍정이어야 남습니다</text>

<rect x="28" y="58" width="310" height="112" rx="8" fill="#eaf0f6" stroke="#2f6fb5"/>
<text class="h" x="46" y="84">상무부</text>
<text class="s" x="46" y="110">명령을 철회하면 덤핑이 지속되거나</text>
<text class="s" x="46" y="130">재발할 가능성이 있는지</text>
<text class="c" x="46" y="154">예상 덤핑률 규모를 ITC에 통보</text>

<rect x="382" y="58" width="310" height="112" rx="8" fill="#eaf0f6" stroke="#2f6fb5"/>
<text class="h" x="400" y="84">국제무역위원회(ITC)</text>
<text class="s" x="400" y="110">명령을 철회하면 미국 산업의 실질적</text>
<text class="s" x="400" y="130">피해가 지속되거나 재발할 가능성이</text>
<text class="s" x="400" y="150">있는지</text>

<rect x="28" y="196" width="310" height="62" rx="8" fill="#ffffff" stroke="#2f6fb5" stroke-width="2"/>
<text class="b" x="46" y="222">두 판정 모두 긍정</text>
<text class="c" x="46" y="244">명령 유지 공고, 다시 5년</text>

<rect x="382" y="196" width="310" height="62" rx="8" fill="#ffffff" stroke="#c2562f" stroke-width="2"/>
<text class="b" x="400" y="222">한쪽이라도 부정</text>
<text class="c" x="400" y="244">명령 철회</text>

<text class="c" x="28" y="294">재심 폭은 응답 정도에 따라 전면재심 또는 신속재심으로 나뉩니다.</text>
<text class="c" x="28" y="314">기준: 1930년 관세법 제751조·제752조 · 출처: 미국 연방관보 유지 공고문</text>
</svg>
