<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" role="img" aria-label="개인은 보통 한 종목을 따로 주문하지만 프로그램 매매는 코스피200 종목 열다섯 개 이상을 한 번에 묶어서 주문한다">
  <rect width="660" height="290" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#1a2540">한 종목씩이 아니라 여럿을 묶어서 냅니다</text>
  <text x="20" y="49" font-size="11" fill="#6b7280">한국거래소 기준 · 같은 사람이 코스피200 종목 15개 이상을 한꺼번에 사고파는 주문</text>

  <rect x="20" y="72" width="300" height="180" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="98" font-size="12.5" font-weight="700" fill="#475569">보통의 주문</text>
  <rect x="40" y="112" width="80" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="132" font-size="12" fill="#1a2540" text-anchor="middle">A 종목</text>
  <text x="40" y="172" font-size="11.5" fill="#64748b">고르고 · 한 종목씩 · 값을 보고</text>
  <text x="40" y="194" font-size="11.5" fill="#64748b">「이 회사가 좋아 보여서」</text>

  <rect x="340" y="72" width="300" height="180" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="360" y="98" font-size="12.5" font-weight="700" fill="#c2410c">프로그램 매매</text>
  <g fill="#ffffff" stroke="#fdba74">
    <rect x="360" y="112" width="52" height="26" rx="5"/><rect x="418" y="112" width="52" height="26" rx="5"/>
    <rect x="476" y="112" width="52" height="26" rx="5"/><rect x="534" y="112" width="52" height="26" rx="5"/>
    <rect x="360" y="142" width="52" height="26" rx="5"/><rect x="418" y="142" width="52" height="26" rx="5"/>
    <rect x="476" y="142" width="52" height="26" rx="5"/><rect x="534" y="142" width="52" height="26" rx="5"/>
  </g>
  <text x="592" y="146" font-size="13" font-weight="700" fill="#c2410c">…15+</text>
  <text x="360" y="194" font-size="11.5" fill="#9a3412">묶음 하나로 · 한꺼번에</text>
  <text x="360" y="214" font-size="11.5" fill="#9a3412">「이 회사가 좋아서」가 아닐 수 있음</text>

  <text x="20" y="278" font-size="11.5" fill="#475569">📌 종목을 고른 게 아니라 <tspan font-weight="700">지수를 통째로 사고판 것</tspan>에 가깝습니다.</text>
</svg>
