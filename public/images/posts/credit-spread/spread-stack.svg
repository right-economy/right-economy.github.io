<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="같은 만기 채권의 금리를 국채금리 부분과 신용스프레드 부분으로 나눠 쌓아 보여주는 막대그래프. 국채는 국채금리만, 우량 회사채는 국채금리에 작은 스프레드가, 신용도가 낮은 회사채는 국채금리에 훨씬 큰 스프레드가 얹힌다">
  <rect width="760" height="330" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .lbl{font-size:13px;font-weight:600}
    .note{font-size:12px;fill:#7a7066}
    .base{fill:#d9d2c6}
    .sp{fill:#c2410c}
    .val{font-size:12.5px;font-weight:700}
    .axis{stroke:#c9bfae;stroke-width:1.5}
  </style>

  <text class="title" x="30" y="34">채권 금리 = 국채금리 + 신용스프레드</text>
  <text class="note" x="30" y="56">만기가 같아도 「떼일 걱정」이 얹히는 만큼 금리가 올라간다</text>

  <line class="axis" x1="150" y1="76" x2="150" y2="286"/>

  <text class="lbl" x="30" y="108">국채</text>
  <rect class="base" x="150" y="88" width="180" height="30" rx="4"/>
  <text class="val" x="340" y="108">국채금리만</text>

  <text class="lbl" x="30" y="176">우량 회사채</text>
  <rect class="base" x="150" y="156" width="180" height="30" rx="4"/>
  <rect class="sp" x="330" y="156" width="55" height="30" rx="4"/>
  <text class="val" x="395" y="176" fill="#c2410c">+ 작은 스프레드</text>

  <text class="lbl" x="30" y="244">신용도 낮은 회사채</text>
  <rect class="base" x="150" y="224" width="180" height="30" rx="4"/>
  <rect class="sp" x="330" y="224" width="215" height="30" rx="4"/>
  <text class="val" x="555" y="244" fill="#c2410c">+ 큰 스프레드</text>

  <rect class="base" x="150" y="298" width="16" height="12" rx="2"/>
  <text class="note" x="172" y="309">국채금리(돈의 기본값)</text>
  <rect class="sp" x="330" y="298" width="16" height="12" rx="2"/>
  <text class="note" x="352" y="309">신용스프레드(떼일 걱정의 값)</text>

  <text class="note" x="30" y="76">막대 길이는 관계를 보여주는 예시다. 실제 값이 아니다.</text>
</svg>
