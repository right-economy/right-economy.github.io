  <text x="60" y="124" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#8c3a30">계약부채 잔액 (받은 날 120)</text>
  <text x="36" y="318" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">열두 달 뒤 잔액은 0이 되고, 그 사이 매출로 인식된 금액이 합계 120입니다.</text>
