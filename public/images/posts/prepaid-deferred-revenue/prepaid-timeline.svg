  <text x="476" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5b6478">9월</text>
  <rect x="504" y="249" width="40" height="23" rx="3" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="524" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5b6478">10월</text>
