<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="미리 받은 회비 120이 열두 달에 걸쳐 매출로 옮겨가며 계약부채 잔액이 줄어드는 그래프">
  <rect width="720" height="340" fill="#fcfcfd"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">달마다 10씩 매출로 옮겨가고, 남은 금액이 계약부채 잔액</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">1월에 1년치 120을 받은 가상의 예시 · 막대는 그 달이 끝난 뒤 남은 잔액</text>
  <line x1="60" y1="272" x2="672" y2="272" stroke="#c9cfdb"/>
  <rect x="72" y="144" width="40" height="128" rx="3" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="92" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#5b6478">1월</text>
  <text x="92" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" font-weight="700" fill="#8c3a30">110</text>
  <rect x="120" y="156" width="40" height="116" rx="3" fill="#fdeeec" stroke="#d9a79f"/>
