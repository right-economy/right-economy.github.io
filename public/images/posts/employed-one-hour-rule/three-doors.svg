<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="경제활동인구조사에서 취업자로 분류되는 세 가지 경로. 첫째는 조사대상주간에 수입을 목적으로 1시간 이상 일한 사람, 둘째는 같은 가구원이 운영하는 농장이나 사업체에서 무급으로 18시간 이상 일한 사람, 셋째는 직업이나 사업체는 있지만 질병 사고 연가 교육 노사분규 등으로 그 주에 일하지 못한 일시휴직자다. 세 경로 중 하나만 걸려도 취업자 한 명으로 센다">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">취업자로 세는 문은 셋입니다</text>
  <text x="360" y="61" text-anchor="middle" font-size="12.5" fill="#8a6d5a">하나만 걸려도 취업자 한 명으로 들어갑니다</text>

  <rect x="30" y="88" width="208" height="128" rx="12" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="134" y="116" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b3261e">수입 목적 1시간</text>
  <text x="134" y="144" text-anchor="middle" font-size="12" fill="#5a4636">조사대상주간에 돈 벌 목적으로</text>
  <text x="134" y="163" text-anchor="middle" font-size="12" fill="#5a4636">1시간 이상 일했으면</text>
  <text x="134" y="192" text-anchor="middle" font-size="12" fill="#8a6d5a">고용 형태는 묻지 않습니다</text>

  <rect x="256" y="88" width="208" height="128" rx="12" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="360" y="116" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c2410c">무급 가족 일 18시간</text>
  <text x="360" y="144" text-anchor="middle" font-size="12" fill="#5a4636">같은 가구원의 농장·사업체를</text>
  <text x="360" y="163" text-anchor="middle" font-size="12" fill="#5a4636">보수 없이 18시간 이상 도왔으면</text>
  <text x="360" y="192" text-anchor="middle" font-size="12" fill="#8a6d5a">본인 수입은 0원이어도 들어갑니다</text>

  <rect x="482" y="88" width="208" height="128" rx="12" fill="#f3f0ea" stroke="#ded7cc"/>
  <text x="586" y="116" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6b5b4a">일시휴직</text>
  <text x="586" y="144" text-anchor="middle" font-size="12" fill="#5a4636">직업·사업체는 있는데 질병·사고,</text>
  <text x="586" y="163" text-anchor="middle" font-size="12" fill="#5a4636">연가·교육·노사분규로 못 일했으면</text>
  <text x="586" y="192" text-anchor="middle" font-size="12" fill="#8a6d5a">그 주에 0시간 일해도 취업자입니다</text>

  <rect x="30" y="238" width="660" height="56" rx="11" fill="#fff6f4" stroke="#f2c4c4"/>
  <text x="360" y="262" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">세 경로 중 하나만 통과하면 취업자 1명</text>
  <text x="360" y="283" text-anchor="middle" font-size="11.5" fill="#8a6d5a">몇 시간 일했는지는 취업자 수에 반영되지 않고 취업시간 통계에만 남습니다</text>
</svg>
