<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="2026년 9월 취업자는 2926만 6천명으로 전년 같은 달보다 11만 3천명 늘었다. 취업시간대별로 보면 주 36시간 이상 취업자는 19만 4천명 0.9퍼센트 늘었고 주 36시간 미만 취업자는 6만 6천명 1.0퍼센트 줄어 두 구간이 반대 방향으로 움직였다. 주당 평균 취업시간은 38.4시간으로 전년 같은 달과 같았다">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">같은 달에 두 구간이 반대로 갔습니다</text>
  <text x="360" y="58" text-anchor="middle" font-size="12.5" fill="#8a6d5a">2026년 9월 · 전년 같은 달 대비 증감</text>

  <line x1="40" y1="160" x2="680" y2="160" stroke="#c2410c" stroke-width="2"/>
  <text x="46" y="153" font-size="11" fill="#8a6d5a">0</text>

  <rect x="150" y="96" width="120" height="64" fill="#c2410c"/>
  <text x="210" y="88" text-anchor="middle" font-size="14" font-weight="800" fill="#b3261e">+19만 4천명</text>
  <text x="210" y="182" text-anchor="middle" font-size="12.5" fill="#5a4636">주 36시간 이상</text>
  <text x="210" y="201" text-anchor="middle" font-size="11.5" fill="#8a6d5a">+0.9%</text>

  <rect x="450" y="160" width="120" height="22" fill="#8a6d5a"/>
  <text x="510" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#6b5b4a">−6만 6천명</text>
  <text x="510" y="146" text-anchor="middle" font-size="12.5" fill="#5a4636">주 36시간 미만</text>
  <text x="510" y="128" text-anchor="middle" font-size="11.5" fill="#8a6d5a">−1.0%</text>

  <rect x="40" y="228" width="640" height="52" rx="11" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="360" y="251" text-anchor="middle" font-size="12.5" fill="#5a4636">전체 취업자 2,926만 6천명 (+11만 3천명, +0.4%) · 주당 평균 취업시간 38.4시간으로 전년 같은 달과 동일</text>
  <text x="360" y="271" text-anchor="middle" font-size="11.5" fill="#8a6d5a">단위: 명 · 막대 길이는 증감폭에 비례</text>
</svg>
