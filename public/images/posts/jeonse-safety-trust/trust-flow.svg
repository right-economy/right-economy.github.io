<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Noto Sans KR', sans-serif" role="img" aria-label="세입자가 전세금을 HUG 기구에 예치하면 기구가 이를 운용해 나온 수익을 집주인에게 월세로 지급하고, 세입자는 전세로 거주하는 3자 구조 도식">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="330" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">전월세 안심신탁 — 3자 구조</text>

  <!-- 세입자 -->
  <rect x="40" y="120" width="140" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#1e40af">세입자</text>
  <text x="110" y="182" text-anchor="middle" font-size="12" fill="#3b82f6">전세로 거주</text>

  <!-- HUG 기구 -->
  <rect x="260" y="115" width="150" height="100" rx="10" fill="#fef9e7" stroke="#f5b301" stroke-width="2"/>
  <text x="335" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">HUG 기구</text>
  <text x="335" y="173" text-anchor="middle" font-size="12" fill="#a16207">전세금 운용</text>
  <text x="335" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207">(연 4%대 수익)</text>

  <!-- 집주인 -->
  <rect x="490" y="120" width="140" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">집주인</text>
  <text x="560" y="182" text-anchor="middle" font-size="12" fill="#22c55e">월세로 수령</text>

  <!-- 화살표: 세입자 → HUG (전세금 예치) -->
  <line x1="180" y1="150" x2="255" y2="150" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <text x="217" y="140" text-anchor="middle" font-size="11" fill="#1e40af">전세금 예치</text>

  <!-- 화살표: HUG → 집주인 (월세 지급) -->
  <line x1="410" y1="150" x2="485" y2="150" stroke="#22c55e" stroke-width="2" marker-end="url(#a)"/>
  <text x="447" y="140" text-anchor="middle" font-size="11" fill="#15803d">월세 지급</text>

  <!-- 집주인 → 세입자 (거주 제공, 아래로 곡선 느낌 직선) -->
  <line x1="490" y1="195" x2="180" y2="195" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#g)"/>
  <text x="335" y="212" text-anchor="middle" font-size="11" fill="#6b7280">집(전세 거주) 제공</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#334155"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker>
  </defs>

  <text x="330" y="256" text-anchor="middle" font-size="13" fill="#374151">세입자는 <tspan font-weight="700" fill="#1e40af">전세</tspan>로, 집주인은 <tspan font-weight="700" fill="#15803d">월세</tspan>로 — 그 간극을 HUG가 운용수익으로 메운다</text>
  <text x="330" y="292" text-anchor="middle" font-size="11" fill="#9ca3af">출처: 국토교통부 '전월세 안심신탁' (2026.8.20 발표)</text>
</svg>
