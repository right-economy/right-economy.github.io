<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="3년 국채선물 위탁증거금률 0.960퍼센트와 유지증거금률 0.640퍼센트를 두 층으로 그리고, 유지 아래로 내려가면 추가증거금이 발생함을 보여주는 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:17px;font-weight:700;}
    .n{font-size:22px;font-weight:700;}
    .s{font-size:14px;}
    .cap{font-size:12px;}
  </style>
  <rect x="0" y="0" width="720" height="440" style="fill:#ffffff"/>
  <text x="24" y="36" class="h" style="fill:#1f2933">3년 국채선물 기준 두 개의 선</text>

  <rect x="24" y="56" width="430" height="72" rx="10" style="fill:#fff3e6;stroke:#e8743b;stroke-width:2"/>
  <text x="44" y="84" class="s" style="fill:#8a3b12">들어갈 때 넣는 돈 — 위탁증거금률</text>
  <text x="44" y="114" class="s" style="fill:#8a3b12">주문을 내려면 이만큼이 계좌에 있어야 합니다</text>
  <text x="434" y="100" class="n" text-anchor="end" style="fill:#8a3b12">0.960%</text>

  <path d="M239 134 V162" style="stroke:#9aa5b1;stroke-width:2;fill:none"/>
  <path d="M239 162 l-5 -10 h10 z" style="fill:#9aa5b1"/>
  <text x="256" y="156" class="s" style="fill:#616e7c">손실이 쌓여 평가액이 줄면</text>

  <rect x="24" y="168" width="430" height="72" rx="10" style="fill:#f5f7fa;stroke:#9aa5b1;stroke-width:2"/>
  <text x="44" y="196" class="s" style="fill:#1f2933">버틸 수 있는 하한 — 유지증거금률</text>
  <text x="44" y="226" class="s" style="fill:#1f2933">위탁증거금률의 3분의 2 수준입니다</text>
  <text x="434" y="212" class="n" text-anchor="end" style="fill:#1f2933">0.640%</text>

  <path d="M239 246 V274" style="stroke:#e8743b;stroke-width:2;fill:none"/>
  <path d="M239 274 l-5 -10 h10 z" style="fill:#e8743b"/>

  <rect x="24" y="280" width="672" height="76" rx="10" style="fill:#fdeeee;stroke:#c0392b;stroke-width:2"/>
  <text x="44" y="308" class="s" style="fill:#8a2118">이 선 아래로 내려가면 추가증거금을 넣으라는 요구가 옵니다. 이것이 마진콜입니다.</text>
  <text x="44" y="334" class="s" style="fill:#8a2118">넣지 않으면 포지션이 정리됩니다.</text>

  <rect x="480" y="56" width="216" height="184" rx="10" style="fill:#eef6ff;stroke:#2f6fa8;stroke-width:2"/>
  <text x="588" y="86" class="s" text-anchor="middle" style="fill:#1b4a73">같은 날 코스피200선물</text>
  <text x="588" y="120" class="n" text-anchor="middle" style="fill:#1b4a73">21.000%</text>
  <text x="588" y="146" class="s" text-anchor="middle" style="fill:#1b4a73">유지 14.000%</text>
  <text x="588" y="182" class="s" text-anchor="middle" style="fill:#1b4a73">같은 선물인데 요구액이</text>
  <text x="588" y="204" class="s" text-anchor="middle" style="fill:#1b4a73">20배 넘게 차이 납니다</text>

  <text x="24" y="388" class="cap" style="fill:#616e7c">그림이 보여주는 것: 선물에 들어갈 때의 요구 비율과 버틸 수 있는 하한 비율 · 단위: 계약금액 대비 %</text>
  <text x="24" y="408" class="cap" style="fill:#616e7c">기준: 2026.11.2 · 출처: 한국거래소 파생상품 위탁증거금률표(증권사 공시본)</text>
  <text x="24" y="428" class="cap" style="fill:#616e7c">유지증거금률이 위탁증거금률의 3분의 2라는 서술의 출처: 증권사 장내파생상품 거래설명서</text>
</svg>
