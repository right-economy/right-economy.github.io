<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="국고채 경쟁입찰에서 낙찰이 채워지는 순서 도식. 국고채전문딜러들이 금액과 금리를 함께 써내면 발행자는 낮은 금리부터 차례로 배정하고, 발행예정액이 다 차는 지점의 금리가 최고낙찰금리가 되며 그보다 높은 금리를 써낸 응찰은 떨어진다">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">낙찰은 낮은 금리부터 채워집니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 재정경제부 국채시장 안내(입찰 방법) · 옳은경제 정리</text>

  <rect x="40" y="82" width="186" height="64" rx="8" fill="#f0e4d8"/>
  <text x="133" y="107" text-anchor="middle" font-size="13" font-weight="800" fill="#5a4636">응찰</text>
  <text x="133" y="129" text-anchor="middle" font-size="11.5" fill="#5a4636">금액과 금리를 함께 써냅니다</text>

  <path d="M234 114 L272 114" stroke="#a97c58" stroke-width="2.5"/>
  <path d="M272 108 L284 114 L272 120 Z" fill="#a97c58"/>

  <rect x="292" y="82" width="186" height="64" rx="8" fill="#eaf1f8"/>
  <text x="385" y="107" text-anchor="middle" font-size="13" font-weight="800" fill="#1f5c99">금리순 정렬</text>
  <text x="385" y="129" text-anchor="middle" font-size="11.5" fill="#5a4636">낮은 금리가 앞에 섭니다</text>

  <path d="M486 114 L524 114" stroke="#a97c58" stroke-width="2.5"/>
  <path d="M524 108 L536 114 L524 120 Z" fill="#a97c58"/>

  <rect x="544" y="82" width="136" height="64" rx="8" fill="#eaf4ec"/>
  <text x="612" y="107" text-anchor="middle" font-size="13" font-weight="800" fill="#1e7a46">배정</text>
  <text x="612" y="129" text-anchor="middle" font-size="11.5" fill="#5a4636">발행예정액까지</text>

  <rect x="40" y="172" width="640" height="112" rx="10" fill="#f7efe2"/>
  <text x="60" y="198" font-size="13" font-weight="800" fill="#5a4636">발행예정액이 다 차는 지점</text>

  <rect x="60" y="212" width="112" height="26" rx="5" fill="#cfe3d5"/>
  <text x="116" y="230" text-anchor="middle" font-size="11.5" fill="#2c5c3f">낮은 금리 응찰</text>
  <rect x="180" y="212" width="112" height="26" rx="5" fill="#cfe3d5"/>
  <text x="236" y="230" text-anchor="middle" font-size="11.5" fill="#2c5c3f">그다음 금리</text>
  <rect x="300" y="212" width="112" height="26" rx="5" fill="#cfe3d5"/>
  <text x="356" y="230" text-anchor="middle" font-size="11.5" fill="#2c5c3f">여기서 물량 소진</text>
  <rect x="420" y="212" width="112" height="26" rx="5" fill="#e8d8d2"/>
  <text x="476" y="230" text-anchor="middle" font-size="11.5" fill="#7c2d12">더 높은 금리</text>
  <rect x="540" y="212" width="112" height="26" rx="5" fill="#e8d8d2"/>
  <text x="596" y="230" text-anchor="middle" font-size="11.5" fill="#7c2d12">그보다 더 높은 금리</text>

  <path d="M356 244 L356 258" stroke="#1e7a46" stroke-width="2"/>
  <text x="356" y="272" text-anchor="middle" font-size="12" font-weight="800" fill="#1e7a46">이 지점의 금리가 최고낙찰금리</text>
  <text x="596" y="272" text-anchor="middle" font-size="12" fill="#7c2d12">이쪽은 떨어집니다</text>

  <text x="360" y="306" text-anchor="middle" font-size="11.5" fill="#6f5443">칸의 개수와 폭은 설명을 위한 것이며 실제 입찰 결과가 아닙니다</text>
</svg>
