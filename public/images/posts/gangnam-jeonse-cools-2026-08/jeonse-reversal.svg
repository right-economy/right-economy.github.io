<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="서초구 전세가 49주 연속 상승하다 8월 3주에 처음으로 하락 전환한 흐름을 보여주는 도식. 서울 전체와 경기·인천은 여전히 상승 중이라 강남권만 방향이 다르다는 대비">
  <rect width="760" height="400" fill="#faf9f6"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#1a1a2e">강남권 전세만 방향이 꺾였어요</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#64748b">한국부동산원 주간 전세 동향 · 2026년 8월 3주</text>
  <!-- 축 -->
  <line x1="90" y1="300" x2="700" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="70" y="200" text-anchor="middle" font-size="11" fill="#94a3b8" transform="rotate(-90 70 200)">전셋값 수준</text>
  <text x="120" y="318" font-size="11" fill="#94a3b8">← 지난 49주</text>
  <text x="640" y="318" text-anchor="end" font-size="11" fill="#94a3b8">이번 주 →</text>
  <!-- 경기·인천 라인 (계속 상승, 끝에 더 가팔라짐) -->
  <path d="M110 250 L 330 215 L 520 185 L 660 150" fill="none" stroke="#2f9e5f" stroke-width="3"/>
  <circle cx="660" cy="150" r="5" fill="#2f9e5f"/>
  <text x="668" y="146" font-size="13" font-weight="700" fill="#166534">경기·인천 ↗ 상승폭 확대</text>
  <!-- 서울 전체 (완만 상승 유지) -->
  <path d="M110 235 L 330 210 L 520 192 L 660 178" fill="none" stroke="#3b6fd4" stroke-width="3"/>
  <circle cx="660" cy="178" r="5" fill="#3b6fd4"/>
  <text x="668" y="182" font-size="13" font-weight="700" fill="#1e40af">서울 +0.19%</text>
  <!-- 서초 (49주 상승하다 끝에 꺾임) -->
  <path d="M110 240 L 330 195 L 520 165 L 600 150 L 660 190" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <circle cx="600" cy="150" r="4" fill="#dc2626"/>
  <circle cx="660" cy="190" r="6" fill="#dc2626"/>
  <text x="360" y="150" font-size="12" fill="#b91c1c">49주 연속 상승</text>
  <text x="600" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">서초 -0.08%</text>
  <text x="600" y="240" text-anchor="middle" font-size="11" fill="#dc2626">첫 하락 반전 ▼</text>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#334155">서울·경기·인천은 오르는데 <tspan font-weight="700" fill="#b91c1c">강남·서초 전세만</tspan> 꺾였어요</text>
  <text x="380" y="384" text-anchor="middle" font-size="11" fill="#94a3b8">개념 도식(추세 이미지·실제 지수 그래프 아님) · 출처: 한국부동산원 8월 3주 · 옳은경제 정리</text>
</svg>
