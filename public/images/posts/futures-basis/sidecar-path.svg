<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="코스피200 선물이 기준가 대비 5퍼센트 움직인 상태가 1분 이어지면 사이드카가 걸려 프로그램 호가의 효력이 5분간 멈추는 순서를 세 칸으로 보여주는 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:17px;font-weight:700;}
    .n{font-size:16px;font-weight:700;}
    .s{font-size:14px;}
    .cap{font-size:12px;}
  </style>
  <rect x="0" y="0" width="720" height="400" style="fill:#ffffff"/>
  <text x="24" y="34" class="h" style="fill:#1f2933">사이드카가 보는 값과 멈추는 대상</text>

  <rect x="24" y="58" width="200" height="110" rx="10" style="fill:#eef6ff;stroke:#2f6fa8;stroke-width:2"/>
  <text x="124" y="86" class="n" text-anchor="middle" style="fill:#1b4a73">코스피200 선물</text>
  <text x="124" y="112" class="s" text-anchor="middle" style="fill:#1b4a73">기준가 대비 5% 변동</text>
  <text x="124" y="134" class="s" text-anchor="middle" style="fill:#1b4a73">그 상태가 1분 이어짐</text>
  <text x="124" y="156" class="cap" text-anchor="middle" style="fill:#2f6fa8">보는 값은 현물 지수가 아님</text>

  <path d="M232 113 H288" style="stroke:#9aa5b1;stroke-width:2"/>
  <path d="M288 113 l-10 -5 v10 z" style="fill:#9aa5b1"/>

  <rect x="296" y="58" width="180" height="110" rx="10" style="fill:#fff3e6;stroke:#e8743b;stroke-width:2"/>
  <text x="386" y="94" class="n" text-anchor="middle" style="fill:#8a3b12">사이드카 발동</text>
  <text x="386" y="124" class="s" text-anchor="middle" style="fill:#8a3b12">프로그램 호가의 효력을</text>
  <text x="386" y="146" class="s" text-anchor="middle" style="fill:#8a3b12">5분간 정지</text>

  <path d="M484 113 H540" style="stroke:#9aa5b1;stroke-width:2"/>
  <path d="M540 113 l-10 -5 v10 z" style="fill:#9aa5b1"/>

  <rect x="548" y="58" width="148" height="110" rx="10" style="fill:#f5f7fa;stroke:#9aa5b1;stroke-width:2"/>
  <text x="622" y="94" class="n" text-anchor="middle" style="fill:#1f2933">손으로 내는</text>
  <text x="622" y="116" class="n" text-anchor="middle" style="fill:#1f2933">주문은 그대로</text>
  <text x="622" y="146" class="s" text-anchor="middle" style="fill:#616e7c">거래 자체는 계속됩니다</text>

  <rect x="24" y="196" width="672" height="108" rx="10" style="fill:#f0f4f8;stroke:#cbd2d9;stroke-width:1.5"/>
  <text x="44" y="224" class="n" style="fill:#1f2933">멈추는 대상이 프로그램 주문인 까닭</text>
  <text x="44" y="252" class="s" style="fill:#1f2933">선물과 현물의 값이 벌어지면 비싼 쪽을 팔고 싼 쪽을 사는 주문이 한꺼번에 들어옵니다.</text>
  <text x="44" y="276" class="s" style="fill:#1f2933">그 주문은 종목을 묶어 기계가 내보내기 때문에, 선물 쪽 움직임이 현물 쪽으로 빠르게 옮겨 갑니다.</text>
  <text x="44" y="296" class="cap" style="fill:#616e7c">상승 쪽으로 걸리면 매수호가가, 하락 쪽으로 걸리면 매도호가가 멈춥니다.</text>

  <text x="24" y="334" class="cap" style="fill:#7b8794">5% · 1분 · 5분은 코스피200 선물에 적용되는 코스피 시장 기준입니다. 코스닥 시장은 기준이 따로 정해져 있습니다.</text>
  <text x="24" y="356" class="cap" style="fill:#7b8794">기준: 한국거래소 사이드카 제도 설명을 전한 보도(2026년 11월 조회). 조문 원문은 직접 확인하지 못했습니다.</text>
  <text x="24" y="378" class="cap" style="fill:#7b8794">한계: 발동 건수·시각은 날마다 달라 이 그림에 넣지 않았습니다.</text>
</svg>
