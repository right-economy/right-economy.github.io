<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,sans-serif" role="img" aria-label="574쌍의 격차 분포. 저층이 더 비싼 경우 18.3%, 0~5% 32.6%, 5~10% 28.2%, 10~20% 16.7%, 20% 이상 4.2%">
<rect width="720" height="420" fill="#fffdf9"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#2a2521">저층 대비 고층 가격차, 얼마나 벌어졌나</text>
<text x="24" y="50" font-size="12" fill="#6f665c">같은 단지·같은 면적에서 저층·고층 거래가 모두 있는 574쌍의 분포</text>
<text x="138" y="101.0" font-size="13" fill="#2a2521" text-anchor="end">저층이 더 비쌈</text>
<rect x="150" y="81.0" width="266.7" height="30" fill="#c2410c" rx="4"/>
<text x="426.7" y="101.0" font-size="13" font-weight="700" fill="#2a2521">18.3% <tspan font-weight="400" fill="#6f665c">(105쌍)</tspan></text>
<text x="138" y="161.0" font-size="13" fill="#2a2521" text-anchor="end">0~5%</text>
<rect x="150" y="141.0" width="475.0" height="30" fill="#fdba74" rx="4"/>
<text x="635.0" y="161.0" font-size="13" font-weight="700" fill="#2a2521">32.6% <tspan font-weight="400" fill="#6f665c">(187쌍)</tspan></text>
<text x="138" y="221.0" font-size="13" fill="#2a2521" text-anchor="end">5~10%</text>
<rect x="150" y="201.0" width="410.9" height="30" fill="#fdba74" rx="4"/>
<text x="570.9" y="221.0" font-size="13" font-weight="700" fill="#2a2521">28.2% <tspan font-weight="400" fill="#6f665c">(162쌍)</tspan></text>
<text x="138" y="281.0" font-size="13" fill="#2a2521" text-anchor="end">10~20%</text>
<rect x="150" y="261.0" width="243.3" height="30" fill="#fdba74" rx="4"/>
<text x="403.3" y="281.0" font-size="13" font-weight="700" fill="#2a2521">16.7% <tspan font-weight="400" fill="#6f665c">(96쌍)</tspan></text>
<text x="138" y="341.0" font-size="13" fill="#2a2521" text-anchor="end">20% 이상</text>
<rect x="150" y="321.0" width="61.2" height="30" fill="#fdba74" rx="4"/>
<text x="221.2" y="341.0" font-size="13" font-weight="700" fill="#2a2521">4.2% <tspan font-weight="400" fill="#6f665c">(24쌍)</tspan></text>
<text x="24" y="406" font-size="11" fill="#6f665c">단위: 비중(%) · 표본 574쌍 · 기준: 2026.06~08 계약분, 서울 25개 자치구 · 출처: 국토교통부 실거래가</text>
</svg>