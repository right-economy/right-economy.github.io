<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="전용 84제곱미터대 서울 아파트 4588건을 연식별로 보면 5년 이하 16.75억, 6에서 10년 15.40억, 11에서 20년 12.02억, 21에서 30년 9.25억, 31에서 40년 8.50억으로 계속 내려가다가 41년 이상에서 26.00억으로 튄다. 다만 41년 이상은 80건뿐이라 표본이 작다">
  <rect width="640" height="390" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">내려가다 41년에서 튑니다</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">전용 84㎡대 4,588건의 연식별 중앙값 · 2026년 6~8월 서울 아파트 매매</text>

  <text x="118" y="106" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">5년 이하</text>
  <rect x="128" y="90" width="258" height="24" rx="3" fill="#E8A87C"/>
  <text x="394" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">16.75억</text>
  <text x="474" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">244건</text>

  <text x="118" y="142" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">6~10년</text>
  <rect x="128" y="126" width="237" height="24" rx="3" fill="#E8A87C"/>
  <text x="373" y="144" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">15.40억</text>
  <text x="474" y="144" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">466건</text>

  <text x="118" y="178" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">11~20년</text>
  <rect x="128" y="162" width="185" height="24" rx="3" fill="#B8B2A0"/>
  <text x="321" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4B5563">12.02억</text>
  <text x="474" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">1,079건</text>

  <text x="118" y="214" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">21~30년</text>
  <rect x="128" y="198" width="142" height="24" rx="3" fill="#B8B2A0"/>
  <text x="278" y="216" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4B5563">9.25억</text>
  <text x="474" y="216" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">2,012건</text>

  <text x="118" y="250" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">31~40년</text>
  <rect x="128" y="234" width="131" height="24" rx="3" fill="#D8D2C0"/>
  <text x="267" y="252" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A6A18">8.50억</text>
  <text x="474" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">707건</text>

  <text x="118" y="290" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">41년 이상</text>
  <rect x="128" y="274" width="400" height="24" rx="3" fill="#E8642F"/>
  <text x="148" y="292" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">26.00억</text>
  <text x="540" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#B4501F">80건</text>

  <line x1="32" y1="318" x2="608" y2="318" stroke="#E5E0D0"/>
  <text x="32" y="344" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">31~40년 8.50억이 제일 낮고, 41년 이상이 26.00억으로 가장 높아요</text>
  <text x="32" y="368" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">41년 이상은 80건뿐이라 다른 칸보다 표본이 훨씬 작습니다 · 왜 튀는지는 이 자료로 알 수 없어요</text>
  <text x="32" y="384" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">막대는 0부터 그렸습니다 · 전용 81~87㎡ · 해제 신고분 제외 · 국토교통부 실거래</text>
</svg>
