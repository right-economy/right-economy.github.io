<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="연구개발에 쓴 돈이 연구 단계는 그해 비용으로, 개발 단계는 요건을 모두 채우면 개발비 자산으로 갈라지는 도식">
  <rect width="720" height="340" fill="#fcfcfd"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">연구개발에 쓴 돈이 갈라지는 자리</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">기업회계기준서 제1038호 무형자산 기준 · 금액 없는 흐름도</text>

  <rect x="36" y="140" width="150" height="60" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="111" y="166" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">연구개발에</text>
  <text x="111" y="186" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">쓴 돈</text>

  <path d="M186 160 L250 115" stroke="#9fb3d9" stroke-width="2" fill="none"/>
  <path d="M186 180 L250 225" stroke="#9fb3d9" stroke-width="2" fill="none"/>

  <rect x="250" y="88" width="178" height="56" rx="8" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="339" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#8c3a30">연구 단계</text>
  <text x="339" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#8c3a30">무엇이 될지 아직 모름</text>

  <path d="M428 116 L484 116" stroke="#d9a79f" stroke-width="2" fill="none"/>
  <rect x="484" y="88" width="200" height="56" rx="8" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="584" y="112" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#8c3a30">그해 비용으로 전액</text>
  <text x="584" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#8c3a30">손익계산서에 들어갑니다</text>

  <rect x="250" y="196" width="178" height="56" rx="8" fill="#eef7f0" stroke="#8fb99f"/>
  <text x="339" y="220" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" font-weight="700" fill="#2f6b49">개발 단계</text>
  <text x="339" y="240" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2f6b49">만들 것이 정해진 뒤</text>

  <path d="M428 224 L484 224" stroke="#8fb99f" stroke-width="2" fill="none"/>
  <rect x="484" y="176" width="200" height="96" rx="8" fill="#eef7f0" stroke="#8fb99f"/>
  <text x="584" y="202" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#2f6b49">여섯 가지 요건을 모두</text>
  <text x="584" y="222" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#2f6b49">채웠으면 개발비 자산</text>
  <text x="584" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2f6b49">한 가지라도 못 채우면</text>
  <text x="584" y="264" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2f6b49">개발 단계라도 비용입니다</text>

  <text x="36" y="312" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">같은 지출이 어느 칸에 적히는지는 단계와 요건으로 정해집니다.</text>
</svg>
