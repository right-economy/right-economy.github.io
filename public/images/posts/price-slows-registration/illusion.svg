<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img">
  <rect width="640" height="372" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">천천히 등기한 집이 비싼 게 아니었어요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">같은 자료를 두 가지로 셌습니다 · 서울 아파트 매매 · 2026년 3~5월 계약</text>

  <rect x="32" y="90" width="278" height="158" rx="10" fill="#FFFFFF" stroke="#E5E0D0" stroke-dasharray="5 3"/>
  <text x="52" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">그냥 묶어서 보면</text>
  <text x="52" y="146" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">30일 안에 등기</text>
  <text x="290" y="146" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">4,049만/평</text>
  <text x="52" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">91~120일 걸림</text>
  <text x="290" y="172" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">4,802만/평</text>
  <line x1="52" y1="190" x2="290" y2="190" stroke="#E5E0D0"/>
  <text x="52" y="214" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">느린 쪽이</text>
  <text x="290" y="214" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#8A8F98">15.7% 비쌈</text>
  <text x="52" y="236" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">1,812건 vs 5,862건</text>

  <rect x="330" y="90" width="278" height="158" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <text x="350" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">같은 단지·같은 평형 안에서</text>
  <text x="350" y="146" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">60일 이내 vs 91일 이상</text>
  <text x="350" y="176" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">비교 가능한 조합</text>
  <text x="588" y="176" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">1,472개</text>
  <line x1="350" y1="190" x2="588" y2="190" stroke="#E5E0D0"/>
  <text x="350" y="214" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">느린 쪽이</text>
  <text x="588" y="214" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#E8642F">1.6% 비쌈</text>
  <text x="350" y="236" font-family="system-ui, sans-serif" font-size="11" fill="#B4501F">느린 쪽 916개 · 빠른 쪽 524개 · 같음 32개</text>

  <line x1="32" y1="274" x2="608" y2="274" stroke="#E5E0D0"/>
  <text x="32" y="298" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">단지를 고정하니 15.7%가 1.6%로 줄었습니다</text>
  <text x="32" y="322" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">등기가 늦어서 비싼 게 아니라, 비싼 집이 늦게 등기되는 거예요.</text>
  <text x="32" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">평단가는 만원/평(전용면적 기준) · 오른쪽은 조합별 변화율의 중앙값이에요</text>
  <text x="32" y="368" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">서울 20개 자치구 · 해제 신고분 제외 · 국토교통부 실거래 · 2026년 9월 16일 집계</text>
</svg>
