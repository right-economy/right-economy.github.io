<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="민평수익률이 만들어지는 경로 도식. 채권평가회사들이 각자 내부 평가방법에 따라 평가한 시가평가기준수익률을 당일 18시까지 금융투자협회에 보고하고, 협회는 제출된 수익률을 단순 산술평균해 18시에 발표한다. 발표된 수익률은 누구나 조회할 수 있는 정보제공 목적의 공시다">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">민평수익률이 만들어지는 길</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 금융투자회사의 영업 및 업무에 관한 규정 시행세칙 제51조의2 · 금융투자협회 안내</text>

  <rect x="50" y="86" width="170" height="104" rx="10" fill="#f0e4d8"/>
  <text x="135" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#5a4636">채권평가회사</text>
  <text x="135" y="137" text-anchor="middle" font-size="12" fill="#5a4636">각자 내부 평가방법으로</text>
  <text x="135" y="158" text-anchor="middle" font-size="12" fill="#5a4636">종목별 수익률을 매깁니다</text>
  <text x="135" y="180" text-anchor="middle" font-size="12" fill="#6f5443">당일 18시까지 보고</text>

  <path d="M228 138 L266 138" stroke="#a97c58" stroke-width="2.5"/>
  <path d="M266 132 L278 138 L266 144 Z" fill="#a97c58"/>

  <rect x="286" y="86" width="170" height="104" rx="10" fill="#cfe3d5"/>
  <text x="371" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5c3f">금융투자협회</text>
  <text x="371" y="137" text-anchor="middle" font-size="12" fill="#2c5c3f">제출된 수익률을</text>
  <text x="371" y="158" text-anchor="middle" font-size="12" fill="#2c5c3f">단순 산술평균합니다</text>
  <text x="371" y="180" text-anchor="middle" font-size="12" fill="#2c5c3f">가중치를 두지 않습니다</text>

  <path d="M464 138 L502 138" stroke="#a97c58" stroke-width="2.5"/>
  <path d="M502 132 L514 138 L502 144 Z" fill="#a97c58"/>

  <rect x="522" y="86" width="148" height="104" rx="10" fill="#eaf1f8"/>
  <text x="596" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#1f5c99">18시에 발표</text>
  <text x="596" y="137" text-anchor="middle" font-size="12" fill="#1f5c99">채권정보센터에서</text>
  <text x="596" y="158" text-anchor="middle" font-size="12" fill="#1f5c99">누구나 조회</text>
  <text x="596" y="180" text-anchor="middle" font-size="12" fill="#1f5c99">하루 한 번</text>

  <rect x="50" y="210" width="620" height="80" rx="10" fill="#f7efe2"/>
  <text x="70" y="238" font-size="12.5" fill="#5a4636">평균이라는 점이 중요합니다. 어느 한 평가회사의 숫자가 아니라 제출된 숫자들을 같은 비중으로 더해 나눈 값입니다.</text>
  <text x="70" y="262" font-size="12.5" fill="#5a4636">협회는 이 수익률을 정보제공 목적으로 공시한다고 밝히고 있습니다. 거래 판단을 위한 제공이 아니라고 적혀 있습니다.</text>
  <text x="70" y="283" font-size="12" fill="#6f5443">하루 한 번 정해지는 값이라 장중에 움직인 호가는 여기에 그날 바로 담기지 않습니다.</text>
</svg>
