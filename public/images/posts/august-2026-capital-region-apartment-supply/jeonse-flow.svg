<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="입주 물량 증가가 전·월세 매물 증가를 거쳐 전셋값 상승 압력 완화로 이어지는 흐름을 보여주는 도식">
  <rect width="720" height="240" fill="#ffffff"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#1f2937">입주 물량이 늘면 전셋값은 왜 안정될까?</text>

  <!-- box 1 -->
  <rect x="30" y="80" width="180" height="90" rx="10" fill="#fff7ed" stroke="#ea8a00" stroke-width="1.5"/>
  <text x="120" y="118" font-size="15" font-weight="700" fill="#c2740a" text-anchor="middle">입주 물량 증가</text>
  <text x="120" y="142" font-size="12" fill="#6b7280" text-anchor="middle">새 아파트 집주인이</text>
  <text x="120" y="159" font-size="12" fill="#6b7280" text-anchor="middle">전·월세로 내놓음</text>

  <!-- arrow -->
  <line x1="215" y1="125" x2="255" y2="125" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="255,120 265,125 255,130" fill="#9ca3af"/>

  <!-- box 2 -->
  <rect x="270" y="80" width="180" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="118" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">전·월세 매물 ↑</text>
  <text x="360" y="142" font-size="12" fill="#6b7280" text-anchor="middle">단기간에 매물이</text>
  <text x="360" y="159" font-size="12" fill="#6b7280" text-anchor="middle">한꺼번에 쏟아짐</text>

  <!-- arrow -->
  <line x1="455" y1="125" x2="495" y2="125" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="495,120 505,125 495,130" fill="#9ca3af"/>

  <!-- box 3 -->
  <rect x="510" y="80" width="180" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="118" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">전셋값 상승압력 완화</text>
  <text x="600" y="142" font-size="12" fill="#6b7280" text-anchor="middle">세입자에게 유리,</text>
  <text x="600" y="159" font-size="12" fill="#6b7280" text-anchor="middle">역전세 나타나기도</text>

  <text x="40" y="212" font-size="12" fill="#9ca3af">※ 입주장은 해당 단지·인근에 국한된 일시 효과예요. 지역 전체 흐름과는 다를 수 있어요.</text>
</svg>
