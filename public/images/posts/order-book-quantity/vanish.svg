<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" role="img" aria-label="잔량이 사라지는 두 가지 경로. 하나는 체결되어 거래량으로 바뀌는 것이고 다른 하나는 주문자가 취소해서 그냥 없어지는 것이다. 취소는 수수료도 제한도 없어 화면의 숫자는 약속이 아니라 의사표시에 가깝다">
  <rect width="640" height="344" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">잔량이 없어지는 길은 두 개예요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">둘 중 하나는 거래가 되고, 하나는 그냥 사라집니다</text>

  <rect x="32" y="92" width="278" height="118" rx="10" fill="#FFFFFF" stroke="#9FC69A" stroke-width="2"/>
  <text x="52" y="122" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">① 체결된다</text>
  <text x="52" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">상대 주문과 값이 맞으면</text>
  <text x="52" y="174" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">잔량 → 거래량으로 바뀐다</text>
  <text x="52" y="196" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">실제로 사고판 것이 된다</text>

  <rect x="330" y="92" width="278" height="118" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <text x="350" y="122" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#B4501F">② 취소된다</text>
  <text x="350" y="152" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">주문한 사람이 빼면</text>
  <text x="350" y="174" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">그냥 없어진다</text>
  <text x="350" y="196" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">아무 일도 일어나지 않는다</text>

  <line x1="32" y1="234" x2="608" y2="234" stroke="#E5E0D0"/>
  <text x="32" y="258" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">그래서 화면의 잔량은 약속이 아니라 의사표시에 가깝습니다</text>
  <text x="32" y="282" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">「사려는 사람이 많다」까지는 맞지만 「그러니 오른다」로 이어지진 않아요.</text>
  <text x="32" y="306" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">끝까지 살지는 그 사람들이 정합니다.</text>
  <text x="32" y="334" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">옳은경제 정리 · 주문 취소 가능 여부와 방식은 시장·증권사 규정에 따릅니다</text>
</svg>
