<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="속보치와 잠정치가 쓰는 자료의 차이를 두 상자로 비교한 도식. 속보치는 분기 앞쪽 두 달 실적에 마지막 달 일부 추정을 더해 만들고, 잠정치는 세 달치 실적이 다 들어온 뒤 다시 계산한다">
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#333}
    .hd{font-size:15px;font-weight:700}
    .bd{font-size:12.5px}
    .cap{font-size:11.5px;fill:#757575}
    .solid{fill:#B4561A}
    .est{fill:#F6C9A8}
    .frame{fill:none;stroke:#D9D9D9;stroke-width:1.5}
  </style>
  <rect width="720" height="280" style="fill:#fff"/>

  <text class="hd" x="30" y="36" style="fill:#333">속보치</text>
  <text class="cap" x="100" y="36" style="fill:#757575">— 마지막 달이 덜 채워진 채로 낸다</text>
  <rect class="frame" x="30" y="52" width="660" height="54"/>
  <rect class="solid" x="31" y="53" width="218" height="52"/>
  <rect class="solid" x="251" y="53" width="218" height="52"/>
  <rect class="est" x="471" y="53" width="218" height="52"/>
  <text class="bd" x="112" y="85" style="fill:#fff">첫째 달 실적</text>
  <text class="bd" x="332" y="85" style="fill:#fff">둘째 달 실적</text>
  <text class="bd" x="536" y="85" style="fill:#6b4a2f">셋째 달 일부 추정</text>

  <text class="hd" x="30" y="156" style="fill:#333">잠정치</text>
  <text class="cap" x="100" y="156" style="fill:#757575">— 세 달치가 다 들어온 뒤 다시 계산한다</text>
  <rect class="frame" x="30" y="172" width="660" height="54"/>
  <rect class="solid" x="31" y="173" width="218" height="52"/>
  <rect class="solid" x="251" y="173" width="218" height="52"/>
  <rect class="solid" x="471" y="173" width="218" height="52"/>
  <text class="bd" x="112" y="205" style="fill:#fff">첫째 달 실적</text>
  <text class="bd" x="332" y="205" style="fill:#fff">둘째 달 실적</text>
  <text class="bd" x="552" y="205" style="fill:#fff">셋째 달 실적</text>

  <text class="cap" x="30" y="258" style="fill:#757575">자료가 채워지는 정도를 나타낸 개념 도식 · 실제 비중이 아니다 · 출처: 한국은행 국민계정 공표 체계</text>
</svg>
