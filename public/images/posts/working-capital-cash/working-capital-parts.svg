<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"
     aria-label="운전자본을 이루는 세 항목과 현금의 방향. 매출채권은 팔았지만 아직 못 받은 돈이라 늘면 현금이 묶이고, 재고자산은 사뒀지만 아직 안 팔린 물건이라 늘면 현금이 묶이며, 매입채무는 받았지만 아직 안 준 돈이라 늘면 현금이 남는다는 도식.">
  <rect width="720" height="300" fill="#fcfcfd"/>
  <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a2540">운전자본 세 항목과 현금이 움직이는 방향</text>

  <rect x="24" y="54" width="206" height="150" rx="8" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="127" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a2540">매출채권</text>
  <text x="127" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">팔았지만 아직 못 받은 돈</text>
  <text x="127" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8c3a30">늘면 현금이 묶인다</text>
  <text x="127" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">받는 날이 미뤄진 만큼</text>
  <text x="127" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">내 통장에서 먼저 나간다</text>

  <rect x="256" y="54" width="206" height="150" rx="8" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="359" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a2540">재고자산</text>
  <text x="359" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">사뒀지만 아직 안 팔린 물건</text>
  <text x="359" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8c3a30">늘면 현금이 묶인다</text>
  <text x="359" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">재료비는 이미 치렀고</text>
  <text x="359" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">팔릴 때까지 창고에 있다</text>

  <rect x="488" y="54" width="206" height="150" rx="8" fill="#eaf4ee" stroke="#9cc0a9"/>
  <text x="591" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a2540">매입채무</text>
  <text x="591" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">받았지만 아직 안 준 돈</text>
  <text x="591" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2f6b43">늘면 현금이 남는다</text>
  <text x="591" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">주는 날을 미룬 만큼</text>
  <text x="591" y="186" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">통장에 더 머문다</text>

  <text x="24" y="238" font-family="sans-serif" font-size="13" fill="#1a2540">운전자본 = 매출채권 ＋ 재고자산 － 매입채무</text>
  <text x="24" y="262" font-family="sans-serif" font-size="12" fill="#5b6478">세 항목이 얼마인지가 아니라 지난해보다 얼마나 늘고 줄었는지가 그해 현금을 바꾼다.</text>
  <text x="24" y="282" font-family="sans-serif" font-size="12" fill="#5b6478">기업마다 포함 항목을 더 넓게 잡기도 하므로 보고서끼리 견줄 때는 계산식을 먼저 맞춘다.</text>
</svg>
