<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"
     aria-label="순이익이 플러스인데 영업활동 현금흐름이 마이너스가 되는 가상의 계산. 당기순이익 100에 현금이 나가지 않은 감가상각비 20을 더하고, 매출채권 증가 120과 재고자산 증가 60을 빼고, 매입채무 증가 40을 더하면 영업활동 현금흐름이 마이너스 20이 된다는 흐름.">
  <rect width="720" height="300" fill="#fcfcfd"/>
  <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a2540">장사가 커지는 해의 계산 (가상의 예시)</text>

  <rect x="24" y="56" width="150" height="70" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="99" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5b6478">당기순이익</text>
  <text x="99" y="108" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1a2540">100</text>

  <text x="200" y="80" font-family="sans-serif" font-size="13" fill="#2f6b43">＋ 감가상각비 20</text>
  <text x="200" y="100" font-family="sans-serif" font-size="12" fill="#5b6478">비용으로 뺐지만 현금은 안 나갔다</text>

  <text x="200" y="134" font-family="sans-serif" font-size="13" fill="#8c3a30">－ 매출채권 증가 120</text>
  <text x="200" y="154" font-family="sans-serif" font-size="12" fill="#5b6478">더 팔았지만 그만큼 더 못 받았다</text>

  <text x="200" y="188" font-family="sans-serif" font-size="13" fill="#8c3a30">－ 재고자산 증가 60</text>
  <text x="200" y="208" font-family="sans-serif" font-size="12" fill="#5b6478">더 팔릴 것에 맞춰 더 쌓아뒀다</text>

  <text x="200" y="242" font-family="sans-serif" font-size="13" fill="#2f6b43">＋ 매입채무 증가 40</text>
  <text x="200" y="262" font-family="sans-serif" font-size="12" fill="#5b6478">재료를 더 받고 대금은 아직 안 줬다</text>

  <rect x="500" y="130" width="196" height="80" rx="8" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="598" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5b6478">영업활동 현금흐름</text>
  <text x="598" y="186" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#8c3a30">－20</text>

  <text x="24" y="282" font-family="sans-serif" font-size="12" fill="#5b6478">숫자는 설명을 위해 만든 가상의 예시이고 단위는 없다. 이익은 남았는데 그해 현금은 줄어든 모양이다.</text>
</svg>
