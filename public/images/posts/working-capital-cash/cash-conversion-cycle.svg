<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"
     aria-label="현금전환주기를 날수로 보여주는 가상의 예시 타임라인. 0일에 재료를 받고 30일에 그 대금을 지급하며 50일에 제품을 팔고 95일에 판매대금이 들어온다. 재고에 머문 50일과 대금을 기다린 45일을 더하고 지급을 미룬 30일을 빼면 현금전환주기는 65일이고, 그 65일 동안 회사 돈이 밖에 나가 있다는 도식.">
  <rect width="720" height="330" fill="#fcfcfd"/>
  <text x="24" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#1a2540">현금이 나가 있는 날수 (가상의 예시)</text>

  <line x1="60" y1="92" x2="684" y2="92" stroke="#9fb3d9" stroke-width="2"/>
  <circle cx="60" cy="92" r="5" fill="#1a2540"/>
  <circle cx="248" cy="92" r="5" fill="#1a2540"/>
  <circle cx="373" cy="92" r="5" fill="#1a2540"/>
  <circle cx="654" cy="92" r="5" fill="#1a2540"/>

  <text x="60" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">0일</text>
  <text x="248" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">30일</text>
  <text x="373" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">50일</text>
  <text x="654" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b6478">95일</text>

  <text x="60" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a2540">재료 받음</text>
  <text x="248" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a2540">재료비 지급</text>
  <text x="373" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a2540">제품 판매</text>
  <text x="654" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a2540">판매대금 입금</text>

  <rect x="60" y="140" width="313" height="26" rx="5" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="216" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8c3a30">재고에 머문 50일</text>

  <rect x="373" y="176" width="281" height="26" rx="5" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="513" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8c3a30">대금을 기다린 45일</text>

  <rect x="60" y="212" width="188" height="26" rx="5" fill="#eaf4ee" stroke="#9cc0a9"/>
  <text x="154" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#2f6b43">지급을 미룬 30일</text>

  <rect x="248" y="250" width="406" height="28" rx="5" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="451" y="269" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1a2540">현금이 밖에 나가 있는 65일</text>

  <text x="24" y="302" font-family="sans-serif" font-size="12" fill="#1a2540">50일 ＋ 45일 － 30일 ＝ 65일</text>
  <text x="24" y="320" font-family="sans-serif" font-size="12" fill="#5b6478">날수는 설명을 위해 만든 가상의 값이다. 업종에 따라 이 길이는 크게 다르고, 음수가 나오는 업종도 있다.</text>
</svg>
