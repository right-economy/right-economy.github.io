<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="과거 6개월 안에 증권시장 밖에서 10명 이상으로부터 사들여 본인과 특별관계자 보유분 합계가 발행된 주식등의 5퍼센트 이상이 되는 세 조건이 모두 겹치면 공개매수 절차를 거쳐야 한다는 것을 보여주는 도식">
  <rect width="720" height="380" fill="#fcfcfd"/>
  <text x="36" y="40" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">세 조건이 모두 겹칠 때만 공개매수 절차를 거칩니다</text>
  <text x="36" y="64" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#4a5468">자본시장법 제133조 제3항과 같은 법 시행령 제140조 기준 · 2026년 11월 5일 조회</text>

  <rect x="36" y="92" width="200" height="160" rx="10" fill="#f1f2f5" stroke="#9099ab"/>
  <text x="56" y="124" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#2b3346">기간</text>
  <text x="56" y="158" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#161e2e">사려는 날부터</text>
  <text x="56" y="182" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#161e2e">과거 6개월</text>
  <text x="56" y="216" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#3a4357">그 안에 산 것을</text>
  <text x="56" y="236" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#3a4357">합쳐서 셉니다</text>

  <rect x="260" y="92" width="200" height="160" rx="10" fill="#f1f2f5" stroke="#9099ab"/>
  <text x="280" y="124" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#2b3346">상대방 수와 장소</text>
  <text x="280" y="158" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#161e2e">증권시장 밖에서</text>
  <text x="280" y="182" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#161e2e">10명 이상에게</text>
  <text x="280" y="216" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#3a4357">거래소 호가로 산 것은</text>
  <text x="280" y="236" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#3a4357">여기 들어가지 않습니다</text>

  <rect x="484" y="92" width="200" height="160" rx="10" fill="#eaf0fa" stroke="#5a74a8"/>
  <text x="504" y="124" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13.5" font-weight="700" fill="#24375c">사고 난 뒤 보유 비율</text>
  <text x="504" y="158" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#161e2e">본인과 특별관계자</text>
  <text x="504" y="182" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#161e2e">합계가 5% 이상</text>
  <text x="504" y="216" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2b3f66">이미 들고 있던 것까지</text>
  <text x="504" y="236" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#2b3f66">더한 숫자입니다</text>

  <text x="228" y="180" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#4a5468">+</text>
  <text x="452" y="180" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#4a5468">+</text>

  <path d="M360 262 L360 286" stroke="#5a74a8" stroke-width="2"/>
  <path d="M354 280 L360 290 L366 280 Z" fill="#5a74a8"/>
  <rect x="146" y="292" width="428" height="58" rx="10" fill="#dde6f5" stroke="#5a74a8"/>
  <text x="360" y="320" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="16" font-weight="700" fill="#1d2d4d">공개매수로만 살 수 있습니다</text>
  <text x="360" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="12.5" fill="#2b3f66">가격과 기간, 살 주식 수를 먼저 공고하고 모두에게 같은 조건으로 사야 합니다</text>
</svg>
