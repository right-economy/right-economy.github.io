<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Pretendard, sans-serif" role="img" aria-label="2026년 국채 발행한도는 공공자금관리기금 227조 4천억원, 원화 외평채 13조 7천억원, 외화표시 외평채 50억 달러로 정해졌으며 세 번째는 통화 단위가 달라 앞의 두 숫자와 나란히 비교할 수 없다">
  <rect width="720" height="330" fill="#fffaf5"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">2026년에 빌리기로 정한 한도</text>
  <text x="360" y="59" text-anchor="middle" font-size="12.5" fill="#8a6d5a">기금별로 따로 정하고 국회가 의결합니다</text>

  <rect x="36" y="82" width="648" height="58" rx="8" fill="#eaf1f8" stroke="#1f5c99" stroke-width="1.4"/>
  <text x="56" y="106" font-size="13" font-weight="800" fill="#1f5c99">공공자금관리기금 (국고채)</text>
  <text x="56" y="128" font-size="11.5" fill="#5a4636">정부안 233조 7,000억원에서 6조 3,000억원 줄여 확정</text>
  <text x="664" y="118" text-anchor="end" font-size="23" font-weight="800" fill="#1f5c99">227조 4,000억원</text>

  <rect x="36" y="148" width="648" height="58" rx="8" fill="#eaf4ec" stroke="#1e7a46" stroke-width="1.4"/>
  <text x="56" y="172" font-size="13" font-weight="800" fill="#1e7a46">외국환평형기금 · 원화 외평채</text>
  <text x="56" y="194" font-size="11.5" fill="#5a4636">전액 1년물 · 조달한 돈은 전액 기존 외평채 상환용</text>
  <text x="664" y="184" text-anchor="end" font-size="23" font-weight="800" fill="#1e7a46">13조 7,000억원</text>

  <rect x="36" y="214" width="648" height="58" rx="8" fill="#f7efe7" stroke="#7c2d12" stroke-width="1.4"/>
  <text x="56" y="238" font-size="13" font-weight="800" fill="#7c2d12">외국환평형기금 · 외화표시 외평채</text>
  <text x="56" y="260" font-size="11.5" fill="#5a4636">정부안 14억 달러에서 36억 달러 늘려 확정</text>
  <text x="664" y="250" text-anchor="end" font-size="23" font-weight="800" fill="#7c2d12">50억 달러</text>

  <text x="360" y="300" text-anchor="middle" font-size="12.5" fill="#8a6d5a">세 번째는 통화가 달라 위 두 숫자와 그대로 견줄 수 없습니다 · 셋 다 한도이고 발행 실적은 따로 봅니다</text>
  <text x="360" y="320" text-anchor="middle" font-size="11.5" fill="#8a6d5a">출처: 국회예산정책처 나보포커스 제130호(2025.12.5) · 머니투데이(2025.12.26)</text>
</svg>
