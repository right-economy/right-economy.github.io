<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Pretendard, sans-serif" role="img" aria-label="국고채권과 외국환평형기금채권, 국민주택채권은 근거 법률과 부담 기금이 서로 다르지만 모두 정부가 갚을 의무를 지는 국채여서 국가채무 집계에는 함께 들어간다는 도식">
  <rect width="720" height="290" fill="#fffaf5"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">갈라지는 건 입구고, 나가는 문은 하나입니다</text>
  <text x="360" y="59" text-anchor="middle" font-size="12.5" fill="#8a6d5a">근거 법률과 기금은 달라도 국가채무에는 함께 들어갑니다</text>

  <rect x="48" y="86" width="150" height="50" rx="8" fill="#eaf1f8" stroke="#1f5c99" stroke-width="1.4"/>
  <text x="123" y="107" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f5c99">국고채권</text>
  <text x="123" y="126" text-anchor="middle" font-size="11.5" fill="#5a4636">국채법</text>

  <rect x="48" y="146" width="150" height="50" rx="8" fill="#eaf4ec" stroke="#1e7a46" stroke-width="1.4"/>
  <text x="123" y="167" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e7a46">외평기금채권</text>
  <text x="123" y="186" text-anchor="middle" font-size="11.5" fill="#5a4636">외국환거래법</text>

  <rect x="48" y="206" width="150" height="50" rx="8" fill="#f7efe7" stroke="#8a6d5a" stroke-width="1.4"/>
  <text x="123" y="227" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a6d5a">국민주택채권</text>
  <text x="123" y="246" text-anchor="middle" font-size="11.5" fill="#5a4636">주택도시기금법</text>

  <path d="M206 111 C 300 111 300 171 392 171" stroke="#8a6d5a" stroke-width="1.8" fill="none"/>
  <path d="M206 171 L392 171" stroke="#8a6d5a" stroke-width="1.8"/>
  <path d="M206 231 C 300 231 300 171 392 171" stroke="#8a6d5a" stroke-width="1.8" fill="none"/>
  <path d="M392 171 l-10 -5 v10 z" fill="#8a6d5a"/>

  <rect x="400" y="130" width="272" height="82" rx="10" fill="#fff" stroke="#7c2d12" stroke-width="1.8"/>
  <text x="536" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#7c2d12">국가채무</text>
  <text x="536" y="184" text-anchor="middle" font-size="12" fill="#5a4636">정부가 갚을 의무를 지는 빚</text>
  <text x="536" y="202" text-anchor="middle" font-size="12" fill="#5a4636">용도가 달라도 함께 집계</text>

  <text x="360" y="276" text-anchor="middle" font-size="12.5" fill="#8a6d5a">출처: 기획재정부 국채시장 국채 종류 안내 · 국가재정법상 국가채무 범위</text>
</svg>
