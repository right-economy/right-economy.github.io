<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" role="img" aria-label="택지비·공사비·가산비 상승이 분양가를 밀어올리는 원리 도식">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="32" y="42" font-size="21" font-weight="700" fill="#1f2937">분양가를 밀어올리는 요인</text>

  <!-- three drivers -->
  <rect x="32" y="78" width="168" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="116" y="112" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">택지비 ↑</text>
  <text x="116" y="138" font-size="12.5" fill="#3b82f6" text-anchor="middle">도심·역세권</text>
  <text x="116" y="156" font-size="12.5" fill="#3b82f6" text-anchor="middle">땅값 상승</text>

  <rect x="216" y="78" width="168" height="92" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="300" y="112" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">공사비 ↑</text>
  <text x="300" y="138" font-size="12.5" fill="#ea7317" text-anchor="middle">자재값·인건비</text>
  <text x="300" y="156" font-size="12.5" fill="#ea7317" text-anchor="middle">금리·물류비</text>

  <rect x="400" y="78" width="168" height="92" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="484" y="112" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle">가산비 ↑</text>
  <text x="484" y="138" font-size="12.5" fill="#7c3aed" text-anchor="middle">특화설계</text>
  <text x="484" y="156" font-size="12.5" fill="#7c3aed" text-anchor="middle">지하주차장 등</text>

  <!-- arrow down -->
  <text x="320" y="208" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">▼ 합쳐지면</text>

  <!-- result -->
  <rect x="160" y="224" width="320" height="56" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="320" y="258" font-size="18" font-weight="700" fill="#991b1b" text-anchor="middle">분양가 상승 📈</text>
</svg>
