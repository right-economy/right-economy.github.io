<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,sans-serif" role="img" aria-label="기존 기준 2.4억, 변경 기준 3.6억. 6억원 한도선 표시">
<rect width="740" height="400" fill="#fffdf9"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#2a2521">정부가 든 실제 사례 — 강북 한 단지</text>
<text x="24" y="52" font-size="12" fill="#6f665c">금융위원회 사무처장이 설명회에서 제시한 값 · 단지명은 공개되지 않았습니다</text>
<text x="24" y="72" font-size="12" font-weight="700" fill="#c2410c">1.5배 늘었습니다 — 지역 시세 차이(3.66배)만큼 늘어나지는 않습니다</text>

<line x1="100" y1="320.0" x2="690" y2="320.0" stroke="#ece4d6" stroke-width="1"/>
<text x="90" y="324.0" font-size="11" fill="#6f665c" text-anchor="end">0억</text>
<line x1="100" y1="254.9" x2="690" y2="254.9" stroke="#ece4d6" stroke-width="1"/>
<text x="90" y="258.9" font-size="11" fill="#6f665c" text-anchor="end">2억</text>
<line x1="100" y1="189.7" x2="690" y2="189.7" stroke="#ece4d6" stroke-width="1"/>
<text x="90" y="193.7" font-size="11" fill="#6f665c" text-anchor="end">4억</text>
<line x1="100" y1="124.6" x2="690" y2="124.6" stroke="#ece4d6" stroke-width="1"/>
<text x="90" y="128.6" font-size="11" fill="#6f665c" text-anchor="end">6억</text>

<rect x="177.5" y="241.8" width="140" height="78.2" fill="#d8cfc2" rx="4"/>
<text x="247.5" y="231.8" font-size="18" font-weight="700" fill="#2a2521" text-anchor="middle">2.4억</text>
<text x="247.5" y="342.0" font-size="13" font-weight="700" fill="#2a2521" text-anchor="middle">기존 기준</text>
<text x="247.5" y="360.0" font-size="11" fill="#6f665c" text-anchor="middle">종전자산에만 40%</text>

<rect x="472.5" y="202.7" width="140" height="117.3" fill="#c2410c" rx="4"/>
