<text x="542.5" y="342.0" font-size="13" font-weight="700" fill="#2a2521" text-anchor="middle">변경 기준</text>
<text x="542.5" y="360.0" font-size="11" fill="#6f665c" text-anchor="middle">둘 중 높은 쪽에 40%</text>

<line x1="100" y1="124.6" x2="690" y2="124.6" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="686" y="118" font-size="12" font-weight="700" fill="#c2410c" text-anchor="end">이주비 대출 한도 6억원 — 이 위로는 안 늘어납니다</text>

<line x1="100" y1="320.0" x2="690" y2="320.0" stroke="#6f665c" stroke-width="1.5"/>
<text x="24" y="386" font-size="11" fill="#6f665c">세로축 0에서 시작 · 기준: 2026.08.31 시행 · 출처: 금융위원회 설명(언론 보도 인용), 한도는 규제지역 기준</text>
