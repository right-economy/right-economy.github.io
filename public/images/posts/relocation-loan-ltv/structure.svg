<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="740" height="340" font-family="-apple-system,BlinkMacSystemFont,Apple SD Gothic Neo,sans-serif" role="img" aria-label="종전자산과 종후자산 중 높은 금액을 담보로 보고 LTV 40%를 적용, 최대 6억원 한도">
<rect width="740" height="340" fill="#fffdf9"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#2a2521">교체가 아니라 '둘 중 높은 쪽'입니다</text>
<text x="24" y="52" font-size="12" fill="#6f665c">종전자산으로 바꿔 끼우는 게 아니라, 두 값을 놓고 큰 쪽을 담보로 봅니다</text>

<rect x="24" y="80" width="180" height="60" fill="#f5efe4" stroke="#d8cfc2" stroke-width="1.5" rx="6"/>
<text x="114" y="105" font-size="13" font-weight="700" fill="#2a2521" text-anchor="middle">종전자산평가액</text>
<text x="114" y="124" font-size="11" fill="#6f665c" text-anchor="middle">지금 가진 낡은 집</text>

<rect x="24" y="160" width="180" height="60" fill="#f5efe4" stroke="#d8cfc2" stroke-width="1.5" rx="6"/>
<text x="114" y="185" font-size="13" font-weight="700" fill="#2a2521" text-anchor="middle">종후자산평가액</text>
<text x="114" y="204" font-size="11" fill="#6f665c" text-anchor="middle">앞으로 받을 새 아파트</text>

<path d="M204 110 L232 110 L232 150" stroke="#c2410c" stroke-width="1.5" fill="none"/>
<path d="M204 190 L232 190 L232 150" stroke="#c2410c" stroke-width="1.5" fill="none"/>
<path d="M232 150 L264 150" stroke="#c2410c" stroke-width="1.5" fill="none"/>
<path d="M258 145 L266 150 L258 155 Z" fill="#c2410c"/>

<rect x="268" y="120" width="140" height="60" fill="#c2410c" rx="6"/>
<text x="338" y="146" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">둘 중 높은 금액</text>
<text x="338" y="165" font-size="11" fill="#ffe9dc" text-anchor="middle">= 담보가치</text>

<path d="M408 150 L444 150" stroke="#6f665c" stroke-width="1.5" fill="none"/>
<path d="M438 145 L446 150 L438 155 Z" fill="#6f665c"/>

<rect x="448" y="120" width="120" height="60" fill="#f5efe4" stroke="#d8cfc2" stroke-width="1.5" rx="6"/>
<text x="508" y="146" font-size="14" font-weight="700" fill="#2a2521" text-anchor="middle">× LTV 40%</text>
<text x="508" y="165" font-size="11" fill="#6f665c" text-anchor="middle">그대로 유지</text>

<path d="M568 150 L604 150" stroke="#6f665c" stroke-width="1.5" fill="none"/>
<path d="M598 145 L606 150 L598 155 Z" fill="#6f665c"/>

<rect x="608" y="120" width="108" height="60" fill="#f5efe4" stroke="#6f665c" stroke-width="1.5" rx="6"/>
<text x="662" y="146" font-size="13" font-weight="700" fill="#2a2521" text-anchor="middle">이주비 한도</text>
<text x="662" y="165" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">최대 6억원</text>

<text x="24" y="258" font-size="12" font-weight="700" fill="#2a2521">📌 그래서 한도가 줄어드는 조합원은 없습니다</text>
<text x="24" y="280" font-size="12" fill="#6f665c">종전자산이 더 높은 경우에는 종전자산이 그대로 담보가 되니, 기존보다 불리해지지 않습니다.</text>
<text x="24" y="302" font-size="12" fill="#6f665c">바뀐 건 '무엇을 담보로 보느냐'이고, LTV 40%라는 비율은 건드리지 않았습니다.</text>
<text x="24" y="326" font-size="11" fill="#6f665c">기준: 2026.08.31 시행 · 출처: 금융위원회 「부동산 시장 안정을 위한 금융 종합대책」, 언론 보도</text>
</svg>
