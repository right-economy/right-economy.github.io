<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="2026년 1월부터 8월까지 전셋값 상승률을 세 가지 방식으로 비교하면 답이 다르다. 평균끼리 비교하면 서울 7.61퍼센트가 경기 5.17퍼센트보다 높고, 경기에서 가장 많이 오른 동탄 11.73퍼센트는 서울 평균보다 높으며, 서울에서 가장 많이 오른 성북 12.57퍼센트는 동탄보다 높다. 어느 층끼리 견주느냐가 결론을 바꾼다">
  <rect width="640" height="380" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">같은 자료인데 답이 셋이에요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2026년 1~8월 전셋값 누적 상승률 · 한국부동산원 · 한국경제 보도 인용</text>

  <rect x="32" y="92" width="576" height="78" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">① 평균끼리 견주면</text>
  <text x="52" y="146" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">서울 7.61%</text>
  <text x="180" y="146" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">&gt;</text>
  <text x="210" y="146" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4B5563">경기 5.17%</text>
  <text x="400" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F7A3D">서울이 2.44%p 높음</text>

  <rect x="32" y="182" width="576" height="78" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <text x="52" y="208" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">② 경기 한 곳 vs 서울 평균</text>
  <text x="52" y="236" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#E8642F">화성 동탄구 11.73%</text>
  <text x="240" y="236" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">&gt;</text>
  <text x="270" y="236" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4B5563">서울 7.61%</text>
  <text x="430" y="236" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">경기가 4.12%p 높음</text>

  <rect x="32" y="272" width="576" height="78" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">③ 가장 많이 오른 곳끼리</text>
  <text x="52" y="326" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">서울 성북구 12.57%</text>
  <text x="240" y="326" font-family="system-ui, sans-serif" font-size="15" fill="#4B5563">&gt;</text>
  <text x="270" y="326" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4B5563">동탄 11.73%</text>
  <text x="430" y="326" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F7A3D">서울이 0.84%p 높음</text>

  <text x="32" y="370" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">셋 다 같은 자료에서 나온 참인 문장입니다 · 어느 층끼리 견주느냐가 결론을 바꿔요</text>
</svg>
