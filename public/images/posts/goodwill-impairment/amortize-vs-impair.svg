<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="설비는 다섯 해에 20씩 나뉘어 깎이고 영업권은 세 해 동안 0이다가 네 번째 해에 400이 한꺼번에 깎이는 모양">
  <rect width="720" height="340" fill="#fcfcfd"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">해마다 조금씩과 어느 해에 한꺼번에</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">설비 100을 5년에 나눠 적고, 영업권 400은 4년차에 전액 손상으로 적는다고 둔 가상의 예시 · 단위 없음</text>

  <text x="36" y="106" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">설비의 감가상각비</text>
  <rect x="36" y="140" width="104" height="18" rx="4" fill="#eef2fb" stroke="#9fb3d9"/>
  <rect x="166" y="140" width="104" height="18" rx="4" fill="#eef2fb" stroke="#9fb3d9"/>
  <rect x="296" y="140" width="104" height="18" rx="4" fill="#eef2fb" stroke="#9fb3d9"/>
  <rect x="426" y="140" width="104" height="18" rx="4" fill="#eef2fb" stroke="#9fb3d9"/>
  <rect x="556" y="140" width="104" height="18" rx="4" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="88" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">20</text>
  <text x="218" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">20</text>
  <text x="348" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">20</text>
  <text x="478" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">20</text>
  <text x="608" y="132" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#1a2540">20</text>

  <text x="36" y="196" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">영업권에서 적히는 비용</text>
  <line x1="36" y1="284" x2="660" y2="284" stroke="#9fb3d9" stroke-width="1"/>
  <text x="88" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">0</text>
  <text x="218" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">0</text>
  <text x="348" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">0</text>
  <rect x="426" y="204" width="104" height="80" rx="4" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="478" y="196" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#8c3a30">400</text>
  <text x="608" y="278" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">0</text>

  <text x="88" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">1년차</text>
  <text x="218" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">2년차</text>
  <text x="348" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">3년차</text>
  <text x="478" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">4년차</text>
  <text x="608" y="306" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">5년차</text>
  <text x="36" y="332" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">어느 해에 적힐지를 미리 알 수 없어서, 터지는 해의 이익만 크게 깎입니다.</text>
</svg>
