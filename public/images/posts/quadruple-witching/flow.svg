<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" role="img" aria-label="만기가 오면 선물을 팔거나 다음 달로 넘기거나 현물을 정리하는데 이 판단이 마감 직전에 몰려 변동성이 생긴다">
  <rect width="660" height="250" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#1a2540">변동성 이야기가 나오는 이유</text>
  <text x="20" y="49" font-size="11" fill="#6b7280">도식 · 만기 때 투자자가 하게 되는 선택</text>

  <rect x="20" y="72" width="150" height="60" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="95" y="98" font-size="12.5" font-weight="700" fill="#1a2540" text-anchor="middle">만기가 온다</text>
  <text x="95" y="118" font-size="11" fill="#6b7280" text-anchor="middle">계약이 끝나는 날</text>

  <path d="M175 102 L205 102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/></marker></defs>

  <rect x="210" y="60" width="200" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="82" font-size="12" fill="#1a2540">정리한다 (청산)</text>
  <rect x="210" y="102" width="200" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="124" font-size="12" fill="#1a2540">다음 달로 넘긴다 (롤오버)</text>
  <rect x="210" y="144" width="200" height="34" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="224" y="166" font-size="12" fill="#1a2540">묶어둔 현물을 판다</text>

  <path d="M415 119 L445 119" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="450" y="88" width="190" height="62" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="545" y="112" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">마감 무렵에 몰림</text>
  <text x="545" y="133" font-size="11" fill="#9a3412" text-anchor="middle">그래서 종가 부근이 흔들립니다</text>

  <text x="20" y="212" font-size="11.5" fill="#475569">📌 방향을 정해서 파는 게 아니라 <tspan font-weight="700">계약을 끝내려고</tspan> 나오는 물량입니다.</text>
  <text x="20" y="232" font-size="11.5" fill="#475569">그래서 그날 움직임이 그 뒤 방향을 알려주지는 않습니다.</text>
</svg>
