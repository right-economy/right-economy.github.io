<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="PER 15배에 ROE 8퍼센트를 곱하면 PBR 1.2배가 되고, 분자와 분모의 순이익이 약분되어 시가총액을 자기자본으로 나눈 값만 남는다">
  <rect width="720" height="330" fill="#fbfbfd"/>
  <text x="24" y="38" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#1a2540">PER에 ROE를 곱하면 PBR이 나옵니다</text>
  <rect x="24" y="64" width="208" height="120" rx="12" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="128" y="94" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#8c95a6" text-anchor="middle">PER</text>
  <text x="128" y="124" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1a2540" text-anchor="middle">시가총액 1조 2,000억</text>
  <line x1="48" y1="136" x2="208" y2="136" stroke="#c9d1de" stroke-width="1.5"/>
  <text x="128" y="162" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#d6341f" text-anchor="middle">순이익 800억</text>
  <text x="248" y="132" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="24" fill="#6b7689">×</text>
  <rect x="280" y="64" width="208" height="120" rx="12" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="384" y="94" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#8c95a6" text-anchor="middle">ROE</text>
  <text x="384" y="124" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#d6341f" text-anchor="middle">순이익 800억</text>
  <line x1="304" y1="136" x2="464" y2="136" stroke="#c9d1de" stroke-width="1.5"/>
  <text x="384" y="162" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1a2540" text-anchor="middle">자기자본 1조</text>
  <text x="504" y="132" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="24" fill="#6b7689">=</text>
  <rect x="536" y="64" width="160" height="120" rx="12" fill="#eef4ff"/>
  <text x="616" y="94" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f4fd8" text-anchor="middle">PBR</text>
  <text x="616" y="124" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f4fd8" text-anchor="middle">시가총액 1조 2,000억</text>
  <line x1="556" y1="136" x2="676" y2="136" stroke="#9db6ee" stroke-width="1.5"/>
  <text x="616" y="162" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1f4fd8" text-anchor="middle">자기자본 1조</text>
  <text x="24" y="222" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#d6341f">빨간 글씨가 위아래에서 약분됩니다. 남는 건 시가총액을 자기자본으로 나눈 값입니다.</text>
  <rect x="24" y="238" width="672" height="48" rx="8" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="48" y="268" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="16" fill="#1a2540">15배 × 8.0% = 1.2배</text>
  <text x="24" y="314" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12" fill="#8c95a6">설명용으로 지어낸 금액입니다. 특정 기업의 실제 재무수치가 아닙니다.</text>
</svg>
