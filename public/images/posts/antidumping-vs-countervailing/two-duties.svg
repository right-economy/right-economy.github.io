<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="반덤핑관세는 수출가격이 정상가격보다 낮은지를 보고, 상계관세는 정부 보조금을 받았는지를 보지만, 두 관세 모두 국내 산업에 실질적 피해가 있고 그 피해와 인과관계가 있다는 판정을 함께 거쳐야 부과된다는 흐름을 두 줄로 그린 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:19px;font-weight:700;}
    .v{font-size:15px;font-weight:700;}
    .n{font-size:14px;}
    .s{font-size:13px;}
  </style>
  <rect x="0" y="0" width="720" height="340" style="fill:#ffffff"/>
  <text class="h" x="32" y="40" style="fill:#1b2733">앞칸만 다르고 뒤칸은 똑같습니다</text>

  <rect x="32" y="64" width="190" height="78" style="fill:#eaf0f6;stroke:#7fa6cc;stroke-width:1"/>
  <text class="v" x="48" y="92" style="fill:#2f6fb5">반덤핑관세</text>
  <text class="n" x="48" y="116" style="fill:#1b2733">수출가격이 정상가격</text>
  <text class="n" x="48" y="136" style="fill:#1b2733">보다 낮은가</text>

  <rect x="32" y="158" width="190" height="78" style="fill:#eaf0f6;stroke:#7fa6cc;stroke-width:1"/>
  <text class="v" x="48" y="186" style="fill:#2f6fb5">상계관세</text>
  <text class="n" x="48" y="210" style="fill:#1b2733">정부나 공공기관의</text>
  <text class="n" x="48" y="230" style="fill:#1b2733">보조금을 받았는가</text>

  <path d="M222 103 L262 103" style="stroke:#5b6b7a;stroke-width:2;fill:none"/>
  <path d="M256 98 L266 103 L256 108 Z" style="fill:#5b6b7a"/>
  <path d="M222 197 L262 197" style="stroke:#5b6b7a;stroke-width:2;fill:none"/>
  <path d="M256 192 L266 197 L256 202 Z" style="fill:#5b6b7a"/>

  <rect x="266" y="64" width="186" height="172" style="fill:#f2f5f8;stroke:#c9d4de;stroke-width:1"/>
  <text class="v" x="282" y="96" style="fill:#1b2733">국내 산업에</text>
  <text class="v" x="282" y="118" style="fill:#1b2733">실질적 피해가 있는가</text>
  <text class="n" x="282" y="150" style="fill:#3b4754">그 피해가 덤핑이나</text>
  <text class="n" x="282" y="170" style="fill:#3b4754">보조금 때문인가</text>
  <text class="s" x="282" y="200" style="fill:#5b6b7a">세 요건 중 하나라도</text>
  <text class="s" x="282" y="218" style="fill:#5b6b7a">안 되면 부과 안 됩니다</text>

  <path d="M452 150 L492 150" style="stroke:#5b6b7a;stroke-width:2;fill:none"/>
  <path d="M486 145 L496 150 L486 155 Z" style="fill:#5b6b7a"/>

  <rect x="496" y="64" width="192" height="172" style="fill:#2f6fb5"/>
  <text class="v" x="512" y="100" style="fill:#ffffff">관세 부과</text>
  <text class="n" x="512" y="130" style="fill:#ffffff">조사·판정은 무역위원회</text>
  <text class="n" x="512" y="152" style="fill:#ffffff">부과는 기획재정부</text>
  <text class="s" x="512" y="184" style="fill:#d6e4f2">세율은 업체별로</text>
  <text class="s" x="512" y="202" style="fill:#d6e4f2">따로 나옵니다</text>

  <text class="s" x="32" y="272" style="fill:#5b6b7a">무엇을 보여주는지: 반덤핑관세와 상계관세의 부과 요건 비교. 단위 없음(절차 도식)</text>
  <text class="s" x="32" y="294" style="fill:#5b6b7a">기준: 관세법상 덤핑방지관세·상계관세 제도와 WTO 반덤핑협정·보조금협정의 공통 요건</text>
  <text class="s" x="32" y="316" style="fill:#5b6b7a">출처: 산업통상자원부 무역위원회 제도 안내, WTO 협정문</text>
</svg>
