<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="전날 종가를 기준으로 위아래 30퍼센트까지만 움직일 수 있다는 가격제한폭 도식. 위쪽 끝이 상한가 아래쪽 끝이 하한가다">
  <style>
    .t{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .h{font-size:16px;font-weight:700;fill:#292524}
    .lb{font-size:15px;font-weight:700}
    .s{font-size:13px;fill:#57534e}
    .sm{font-size:12px;fill:#a8a29e}
  </style>
  <rect width="720" height="320" fill="#fffdfa"/>
  <text class="t h" x="24" y="34">하루에 움직일 수 있는 폭이 정해져 있어요</text>

  <rect x="150" y="60" width="420" height="46" rx="10" fill="#c2410c"/>
  <text class="t lb" x="360" y="90" text-anchor="middle" fill="#ffffff">상한가 — 전날 종가 +30%</text>

  <line x1="360" y1="106" x2="360" y2="150" stroke="#d6d3d1" stroke-width="3" stroke-dasharray="5 4"/>

  <rect x="150" y="150" width="420" height="46" rx="10" fill="#fff2ec" stroke="#ece4d6" stroke-width="2"/>
  <text class="t lb" x="360" y="180" text-anchor="middle" fill="#292524">전날 종가 — 기준점</text>

  <line x1="360" y1="196" x2="360" y2="240" stroke="#d6d3d1" stroke-width="3" stroke-dasharray="5 4"/>

  <rect x="150" y="240" width="420" height="46" rx="10" fill="#57534e"/>
  <text class="t lb" x="360" y="270" text-anchor="middle" fill="#ffffff">하한가 — 전날 종가 −30%</text>

  <text class="t s" x="24" y="180">이 밖으로는</text>
  <text class="t s" x="24" y="200">못 나갑니다</text>

  <text class="t sm" x="24" y="308">코스피·코스닥 기준 · 기준점은 매일 새로 잡힙니다 · 옳은경제 개념 도식</text>
</svg>
