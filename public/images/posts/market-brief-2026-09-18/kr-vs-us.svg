<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="같은 날 미국 증시는 올랐지만 한국은 코스피가 0.04퍼센트 내리고 원달러 환율이 13원 60전 올라 1382원 20전으로 마감했다는 비교">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">같은 날, 한국은 달랐다</text>

  <rect x="42" y="64" width="310" height="164" rx="10" fill="#f2f6f3" stroke="#3f8f5a" stroke-width="2"/>
  <text x="197" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="#2f7d54">미국 (9월 17일)</text>
  <text x="197" y="134" text-anchor="middle" font-size="26" font-weight="900" fill="#2f7d54">다 올랐다</text>
  <text x="197" y="166" text-anchor="middle" font-size="14" fill="#5b4636">다우 +0.61% · S&amp;P +1.14%</text>
  <text x="197" y="192" text-anchor="middle" font-size="14" fill="#5b4636">나스닥 +1.69%</text>

  <rect x="368" y="64" width="310" height="164" rx="10" fill="#fdf1e6" stroke="#e8853b" stroke-width="2"/>
  <text x="523" y="94" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">한국 (9월 17일)</text>
  <text x="523" y="130" text-anchor="middle" font-size="20" font-weight="900" fill="#8a6d5a">코스피 −0.04%</text>
  <text x="523" y="164" text-anchor="middle" font-size="20" font-weight="900" fill="#c2410c">환율 +13.6원</text>
  <text x="523" y="192" text-anchor="middle" font-size="14" fill="#5b4636">1,382.20원 마감</text>

  <text x="360" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c2d12">미국 금리가 오르면 달러가 강해지는 쪽입니다</text>
  <text x="360" y="280" text-anchor="middle" font-size="11.5" fill="#b08968">코스피는 보도값 · 환율은 서울 외환시장 매매기준율(오후 3시 30분) · 출처: 언론 보도</text>
</svg>
