<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="직장가입자는 보수월액만으로 보험료를 매기고 지역가입자는 소득과 재산과 자동차를 합쳐 매긴다는 비교 그림">
  <rect width="640" height="300" fill="#fbfaf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">무엇에 매기느냐가 달라집니다</text>

  <rect x="30" y="52" width="260" height="200" rx="8" fill="#eef3ec" stroke="#7a9a72"/>
  <text x="160" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2b2b2b">직장가입자</text>
  <rect x="60" y="96" width="200" height="40" rx="5" fill="#d9e5d4" stroke="#7a9a72"/>
  <text x="160" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#2b2b2b">보수월액 (월급)</text>
  <text x="160" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">집·차는 안 봅니다</text>
  <text x="160" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">절반은 회사가 냅니다</text>
  <text x="160" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">월급이 같으면 보험료도 같습니다</text>

  <rect x="350" y="52" width="260" height="200" rx="8" fill="#f5eeee" stroke="#c38b8b"/>
  <text x="480" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2b2b2b">지역가입자</text>
  <rect x="380" y="96" width="200" height="22" rx="4" fill="#ecdada" stroke="#c38b8b"/>
  <text x="480" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">소득</text>
  <rect x="380" y="122" width="200" height="22" rx="4" fill="#ecdada" stroke="#c38b8b"/>
  <text x="480" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">재산</text>
  <rect x="380" y="148" width="200" height="22" rx="4" fill="#ecdada" stroke="#c38b8b"/>
  <text x="480" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">자동차</text>
  <text x="480" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">전액을 본인이 냅니다</text>
  <text x="480" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">소득이 0이어도 집·차로 매겨집니다</text>

  <text x="320" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">출처: 국민건강보험공단 자격·보험료 안내 (조회 2026년 10월 5일)</text>
</svg>
