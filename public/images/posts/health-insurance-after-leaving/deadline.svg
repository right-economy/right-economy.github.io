<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="퇴직 후 지역가입자 보험료를 처음 고지받고 그 납부기한에서 두 달이 지나기 전까지 임의계속가입을 신청해야 한다는 시간표 그림">
  <rect width="640" height="230" fill="#fbfaf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">신청할 수 있는 창이 짧습니다</text>

  <line x1="60" y1="110" x2="580" y2="110" stroke="#bbb" stroke-width="2"/>

  <circle cx="100" cy="110" r="7" fill="#8b9dc3"/>
  <text x="100" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">퇴직</text>
  <text x="100" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">자격 상실</text>

  <circle cx="265" cy="110" r="7" fill="#8b9dc3"/>
  <text x="265" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">첫 지역보험료 고지</text>
  <text x="265" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">여기서부터 셉니다</text>

  <rect x="265" y="156" width="230" height="30" rx="5" fill="#eef3ec" stroke="#7a9a72"/>
  <text x="380" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#2b2b2b">납부기한에서 2개월 지나기 전까지</text>

  <circle cx="495" cy="110" r="7" fill="#c38b8b"/>
  <text x="495" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">신청 마감</text>
  <text x="495" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">지나면 못 합니다</text>

  <text x="320" y="212" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">근거: 국민건강보험법 · 공단 임의계속가입 안내 (조회 2026년 10월 5일)</text>
</svg>
