<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="국고채 발행 입찰 참여 구조 도식. 정부가 국고채 입찰을 열면 국고채전문딜러가 입찰에 참여해 인수하고, 예비 국고채전문딜러는 제한된 한도로 참여하며, 그 밖의 투자자는 입찰에 직접 들어가지 않고 유통시장에서 산다">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">입찰에 들어가는 쪽과 그 뒤에서 사는 쪽</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 기획재정부 국채시장 안내 · 옳은경제 정리</text>

  <rect x="40" y="88" width="150" height="76" rx="8" fill="#f0e4d8"/>
  <text x="115" y="120" text-anchor="middle" font-size="14" font-weight="800" fill="#5a4636">정부</text>
  <text x="115" y="144" text-anchor="middle" font-size="12" fill="#5a4636">국고채 입찰을 엽니다</text>

  <path d="M198 126 L236 126" stroke="#a97c58" stroke-width="2.5"/>
  <path d="M236 120 L248 126 L236 132 Z" fill="#a97c58"/>

  <rect x="256" y="74" width="196" height="50" rx="8" fill="#eaf1f8"/>
  <text x="354" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#1f5c99">국고채전문딜러</text>
  <text x="354" y="113" text-anchor="middle" font-size="11.5" fill="#5a4636">입찰에 들어가 인수합니다</text>

  <rect x="256" y="130" width="196" height="50" rx="8" fill="#eaf4ec"/>
  <text x="354" y="150" text-anchor="middle" font-size="13" font-weight="800" fill="#1e7a46">예비 국고채전문딜러</text>
  <text x="354" y="169" text-anchor="middle" font-size="11.5" fill="#5a4636">더 좁은 한도로 들어갑니다</text>

  <path d="M460 126 L498 126" stroke="#a97c58" stroke-width="2.5"/>
  <path d="M498 120 L510 126 L498 132 Z" fill="#a97c58"/>

  <rect x="518" y="88" width="162" height="76" rx="8" fill="#f7efe2"/>
  <text x="599" y="114" text-anchor="middle" font-size="13" font-weight="800" fill="#5a4636">그 밖의 투자자</text>
  <text x="599" y="136" text-anchor="middle" font-size="11.5" fill="#6f5443">입찰 대신 유통시장에서</text>
  <text x="599" y="154" text-anchor="middle" font-size="11.5" fill="#6f5443">사고팝니다</text>

  <rect x="40" y="200" width="640" height="68" rx="8" fill="#f0e4d8"/>
  <text x="360" y="228" text-anchor="middle" font-size="13" font-weight="800" fill="#5a4636">딜러를 지정해 두면 입찰이 비는 일이 줄고,</text>
  <text x="360" y="252" text-anchor="middle" font-size="13" fill="#6f5443">발행 뒤에도 사고팔 상대가 시장에 남습니다</text>
</svg>
