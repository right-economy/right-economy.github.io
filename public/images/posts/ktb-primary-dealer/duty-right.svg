<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Pretendard, sans-serif" role="img" aria-label="국고채전문딜러의 의무와 권한을 짝으로 정리한 표. 의무는 입찰 물량의 8퍼센트 이상 인수, 매도와 매수 양방향 호가 10개 제시, 국고채 평균잔액 1조원 이상 보유이고, 권한은 입찰 물량의 30퍼센트까지 인수와 평가 실적에 따른 비경쟁인수 및 저리 융자다">
  <rect width="720" height="280" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">의무와 권한이 짝으로 붙어 있습니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 기획재정부 국채시장 안내</text>

  <rect x="40" y="80" width="310" height="168" rx="8" fill="#eaf1f8"/>
  <text x="195" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#1f5c99">져야 하는 것</text>
  <text x="195" y="140" text-anchor="middle" font-size="12.5" fill="#5a4636">입찰 물량의 8% 이상 인수</text>
  <text x="195" y="172" text-anchor="middle" font-size="12.5" fill="#5a4636">사겠다·팔겠다 호가 10개 제시</text>
  <text x="195" y="204" text-anchor="middle" font-size="12.5" fill="#5a4636">국고채 평균잔액 1조원 이상 보유</text>
  <text x="195" y="232" text-anchor="middle" font-size="11.5" fill="#6f5443">업권별 평균 거래량의 110% 이상 거래</text>

  <rect x="370" y="80" width="310" height="168" rx="8" fill="#eaf4ec"/>
  <text x="525" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#1e7a46">받는 것</text>
  <text x="525" y="140" text-anchor="middle" font-size="12.5" fill="#5a4636">입찰 물량의 30%까지 인수</text>
  <text x="525" y="172" text-anchor="middle" font-size="12.5" fill="#5a4636">평가 실적에 따른 비경쟁인수</text>
  <text x="525" y="204" text-anchor="middle" font-size="12.5" fill="#5a4636">평가 실적에 따른 저리 융자</text>
  <text x="525" y="232" text-anchor="middle" font-size="11.5" fill="#6f5443">상위 6개는 우수 딜러로 선정</text>
</svg>
