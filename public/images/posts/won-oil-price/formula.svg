<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" role="img" aria-label="국제유가에서 소비자 가격까지의 단계">
  <rect width="640" height="200" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#1a2540">뉴스가 말하는 유가와 내가 내는 값 사이에는 두 단계가 더 있습니다</text>

  <rect x="24" y="60" width="120" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="84" y="82" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">국제 유가</text>
  <text x="84" y="100" font-size="11" fill="#92400e" text-anchor="middle">달러 표시</text>

  <text x="158" y="92" font-size="18" fill="#6b7280">×</text>

  <rect x="180" y="60" width="120" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="240" y="82" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">원/달러 환율</text>
  <text x="240" y="100" font-size="11" fill="#92400e" text-anchor="middle">여기서 갈린다</text>

  <text x="314" y="92" font-size="18" fill="#6b7280">=</text>

  <rect x="336" y="60" width="130" height="52" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="401" y="82" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">원화 환산 유가</text>
  <text x="401" y="100" font-size="11" fill="#991b1b" text-anchor="middle">수입 원가</text>

  <text x="480" y="92" font-size="18" fill="#6b7280">+</text>

  <rect x="500" y="60" width="118" height="52" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="559" y="82" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">세금·유통</text>
  <text x="559" y="100" font-size="11" fill="#374151" text-anchor="middle">주유소 가격</text>

  <text x="24" y="148" font-size="11" fill="#4b5563">이 글이 계산한 건 세 번째 칸까지입니다. 주유소에서 보는 값은 네 번째 칸을 지난 뒤라 움직이는 폭과 시점이 또 다릅니다.</text>
  <text x="24" y="176" font-size="10" fill="#9ca3af">도식 · 국제 유가에서 소비자 가격까지의 단계</text>
</svg>
