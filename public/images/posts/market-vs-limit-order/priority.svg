<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-label="체결 우선순위. 먼저 가격이 유리한 주문이 앞서고, 같은 가격이면 먼저 넣은 주문이 앞선다. 그래서 같은 값에 걸어도 늦게 넣으면 뒤에서 기다린다">
  <rect width="640" height="352" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">값이 닿아도 줄이 끝나야 내 차례예요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">체결은 두 단계로 순서를 정합니다</text>

  <rect x="32" y="88" width="576" height="76" rx="10" fill="#FFFFFF" stroke="#9FC69A" stroke-width="2"/>
  <circle cx="62" cy="126" r="15" fill="#1F7A3D"/>
  <text x="62" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <text x="92" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F7A3D">가격 우선</text>
  <text x="92" y="142" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">더 비싸게 사겠다는 주문 · 더 싸게 팔겠다는 주문이 앞선다</text>

  <rect x="32" y="176" width="576" height="76" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <circle cx="62" cy="214" r="15" fill="#E8642F"/>
  <text x="62" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <text x="92" y="206" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#B4501F">시간 우선</text>
  <text x="92" y="230" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">가격이 같으면 먼저 넣은 주문이 앞선다</text>

  <line x1="32" y1="274" x2="608" y2="274" stroke="#E5E0D0"/>
  <text x="32" y="298" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">그래서 「그 값까지 왔는데 나만 체결이 안 됐다」가 생깁니다</text>
  <text x="32" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">값은 닿았지만 앞사람 물량이 아직 다 소화되지 않은 것입니다.</text>
  <text x="32" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">한국거래소 매매체결 원칙 · 세부 적용은 시장·호가 종류에 따라 다를 수 있습니다</text>
</svg>
