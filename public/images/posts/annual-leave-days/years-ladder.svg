<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="계속근로 1년이면 연차 15일, 3년 16일, 5년 17일, 10년 19일이고 21년 이상은 상한인 25일에 닿는다는 막대 그림">
  <rect width="660" height="300" fill="#fbfaf7"/>
  <text x="330" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">3년째부터 2년마다 하루씩 붙고 25일에서 멈춥니다</text>
  <line x1="52" y1="236" x2="620" y2="236" stroke="#d6d2c8" stroke-width="1"/>
  <rect x="70" y="146.0" width="68" height="90.0" rx="4" fill="#a8bfa1"/>
  <text x="104" y="137" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">15일</text>
  <text x="104" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">1년</text>
  <rect x="174" y="140.0" width="68" height="96.0" rx="4" fill="#a8bfa1"/>
  <text x="208" y="131" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">16일</text>
  <text x="208" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">3년</text>
  <rect x="278" y="134.0" width="68" height="102.0" rx="4" fill="#a8bfa1"/>
  <text x="312" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">17일</text>
  <text x="312" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">5년</text>
  <rect x="382" y="122.0" width="68" height="114.0" rx="4" fill="#a8bfa1"/>
  <text x="416" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">19일</text>
  <text x="416" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">10년</text>
  <rect x="486" y="86.0" width="68" height="150.0" rx="4" fill="#7a9a72"/>
  <text x="520" y="77" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">25일</text>
  <text x="520" y="257" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">21년 이상</text>
  <line x1="52" y1="86" x2="620" y2="86" stroke="#c9b8a8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="620" y="78" text-anchor="end" font-family="system-ui,sans-serif" font-size="11.5" fill="#8a7a6a">상한 25일</text>
  <text x="330" y="282" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#666">근로기준법 제60조 제2항·제4항 · 단위: 일 · 출근율 80% 이상 기준 · 옳은경제</text>
</svg>
