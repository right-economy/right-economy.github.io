<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="1990년 4조8600억원, 2003년 4000억원, 2008년 5150억원은 실제로 주식을 샀고 2020년 10조7600억원과 2022년은 조성 또는 가동 준비에 그쳐 집행액이 0원이었다는 것을 연도별 가로 막대로 비교한 그림">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:19px;font-weight:700;}
    .n{font-size:15px;}
    .v{font-size:15px;font-weight:700;}
    .s{font-size:13px;}
  </style>
  <rect x="0" y="0" width="720" height="400" style="fill:#ffffff"/>
  <text class="h" x="32" y="40" style="fill:#1b2733">다섯 번 거론됐고, 주식을 실제로 산 것은 세 번입니다</text>

  <text class="n" x="32" y="86" style="fill:#3b4754">1990년</text>
  <rect x="120" y="70" width="300" height="24" rx="4" style="fill:#2f6fb5"/>
  <text class="v" x="432" y="88" style="fill:#1b2733">4조 8,600억원 집행</text>

  <text class="n" x="32" y="130" style="fill:#3b4754">2003년</text>
  <rect x="120" y="114" width="26" height="24" rx="4" style="fill:#2f6fb5"/>
  <text class="v" x="158" y="132" style="fill:#1b2733">4,000억원 집행</text>

  <text class="n" x="32" y="174" style="fill:#3b4754">2008년</text>
  <rect x="120" y="158" width="33" height="24" rx="4" style="fill:#2f6fb5"/>
  <text class="v" x="165" y="176" style="fill:#1b2733">5,150억원 집행</text>

  <text class="n" x="32" y="218" style="fill:#3b4754">2020년</text>
  <rect x="120" y="202" width="440" height="24" rx="4" style="fill:#ffffff;stroke:#c2562f;stroke-width:1.5;stroke-dasharray:6 4"/>
  <text class="v" x="134" y="220" style="fill:#c2562f">10조 7,600억원 약정 · 집행 0원</text>

  <text class="n" x="32" y="262" style="fill:#3b4754">2022년</text>
  <rect x="120" y="246" width="440" height="24" rx="4" style="fill:#ffffff;stroke:#c2562f;stroke-width:1.5;stroke-dasharray:6 4"/>
  <text class="v" x="134" y="264" style="fill:#c2562f">2020년 펀드 재가동 추진 · 집행 0원</text>

  <rect x="120" y="292" width="18" height="12" rx="3" style="fill:#2f6fb5"/>
  <text class="s" x="146" y="302" style="fill:#5a6672">실제 매입</text>
  <rect x="236" y="292" width="18" height="12" rx="3" style="fill:#ffffff;stroke:#c2562f;stroke-width:1.5;stroke-dasharray:4 3"/>
  <text class="s" x="262" y="302" style="fill:#5a6672">약정·준비에 그침</text>

  <text class="s" x="32" y="340" style="fill:#5a6672">막대 길이는 금액에 비례합니다. 2022년은 새로 돈을 모은 것이 아니라 2020년 펀드를 다시 쓰려 한 것입니다.</text>
  <text class="s" x="32" y="362" style="fill:#5a6672">2008년 규모는 보도에 따라 약 5,000억원으로도 적힙니다.</text>
  <text class="s" x="32" y="384" style="fill:#5a6672">단위: 원 · 기준: 2026년 11월 23일 보도 시점 · 출처: 쿠키뉴스·비즈워치(2026.11.23)</text>
</svg>
