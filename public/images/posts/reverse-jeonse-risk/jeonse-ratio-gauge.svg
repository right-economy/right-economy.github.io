<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" font-family="'Noto Sans KR', sans-serif" role="img" aria-label="전세가율이 70%를 넘으면 주의, 90%를 넘으면 깡통전세 가능성이 커진다는 위험 게이지">
  <rect width="660" height="260" fill="#ffffff"/>
  <text x="330" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">전세가율로 보는 위험 신호</text>
  <text x="330" y="60" text-anchor="middle" font-size="13" fill="#6b7280">전세가율 = 매매가 대비 전세가 · 높을수록 보증금 위험 ↑</text>

  <!-- gauge bar -->
  <rect x="80" y="100" width="500" height="40" rx="8" fill="#e5e7eb"/>
  <!-- 0~60 안전 (green) 60% of 500 → but map 0-100% to bar. 안전 ~70, 주의 70-90, 위험 90+ -->
  <rect x="80" y="100" width="350" height="40" rx="8" fill="#86efac"/>
  <rect x="430" y="100" width="100" height="40" fill="#fde68a"/>
  <rect x="530" y="100" width="50" height="40" rx="8" fill="#fca5a5"/>

  <!-- ticks -->
  <text x="80" y="166" text-anchor="middle" font-size="12" fill="#6b7280">0%</text>
  <text x="430" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">70%</text>
  <text x="530" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">90%</text>
  <text x="580" y="166" text-anchor="middle" font-size="12" fill="#6b7280">100%</text>

  <!-- labels -->
  <text x="255" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">안전권</text>
  <text x="480" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">주의</text>
  <text x="555" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">위험</text>

  <text x="330" y="210" text-anchor="middle" font-size="13" fill="#374151">70% 넘으면 주의 · <tspan font-weight="700" fill="#b91c1c">90% 넘으면 깡통전세 가능성</tspan> (매매가≈보증금)</text>
  <text x="330" y="236" text-anchor="middle" font-size="11" fill="#9ca3af">※ 참고선이며 지역·물건·시점에 따라 안전선은 달라져요</text>
</svg>
