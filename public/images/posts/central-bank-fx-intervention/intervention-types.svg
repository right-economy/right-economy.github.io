<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="직접 개입·구두 개입·스무딩 오퍼레이션 세 가지 외환 개입 방식을 강도순으로 비교한 도표">
  <rect width="740" height="320" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#1a1a1a">외환 당국의 개입 방식 3가지</text>
  <text x="40" y="56" font-size="13" fill="#6b7280">돈을 실제로 쓰는 것부터 '말'로 하는 것까지, 강도가 달라요</text>

  <!-- 카드1 -->
  <rect x="40" y="80" width="216" height="200" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="148" y="112" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">💵 직접 개입</text>
  <text x="60" y="146" font-size="12.5" fill="#1e40af">실제로 달러를 사고팔아</text>
  <text x="60" y="168" font-size="12.5" fill="#1e40af">환율에 힘을 가하는 방식</text>
  <text x="60" y="198" font-size="12.5" fill="#64748b">가장 직접적·강력</text>
  <text x="60" y="220" font-size="12.5" fill="#64748b">외환보유고를 씀</text>
  <text x="60" y="250" font-size="11.5" fill="#94a3b8">효과 강함 / 실탄 소모</text>

  <!-- 카드2 -->
  <rect x="262" y="80" width="216" height="200" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="370" y="112" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">🗣️ 구두 개입</text>
  <text x="282" y="146" font-size="12.5" fill="#166534">"과도한 쏠림은 바람직</text>
  <text x="282" y="168" font-size="12.5" fill="#166534">하지 않다" 같은 발언</text>
  <text x="282" y="198" font-size="12.5" fill="#64748b">돈 안 쓰고 신호만</text>
  <text x="282" y="220" font-size="12.5" fill="#64748b">시장 심리에 경고</text>
  <text x="282" y="250" font-size="11.5" fill="#94a3b8">비용 적음 / 효과 일시적</text>

  <!-- 카드3 -->
  <rect x="484" y="80" width="216" height="200" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="592" y="112" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">🌊 스무딩 오퍼레이션</text>
  <text x="504" y="146" font-size="12.5" fill="#78350f">방향은 놔두되 '속도'만</text>
  <text x="504" y="168" font-size="12.5" fill="#78350f">부드럽게 다듬는 개입</text>
  <text x="504" y="198" font-size="12.5" fill="#64748b">급변동만 완화</text>
  <text x="504" y="220" font-size="12.5" fill="#64748b">추세엔 맞서지 않음</text>
  <text x="504" y="250" font-size="11.5" fill="#94a3b8">변동성 관리 목적</text>

  <text x="40" y="306" font-size="11.5" fill="#94a3b8">* 목적은 대체로 '변동성 완화'이며, 환율의 방향(추세) 자체를 오래 거스르긴 어려워요 · 출처: 옳은경제 정리</text>
</svg>
