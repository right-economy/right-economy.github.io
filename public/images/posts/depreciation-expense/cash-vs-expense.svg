<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="설비 대금은 산 해에 한 번 나가고 비용은 다섯 해에 나뉘어 적히는 모양">
  <rect width="720" height="320" fill="#fcfcfd"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">돈이 나간 해와 비용으로 적히는 해</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">취득원가 100, 쓰는 기간 5년, 끝에 남는 가치 0으로 둔 가상의 예시 · 단위 없음</text>

  <text x="36" y="110" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">통장에서 나간 현금</text>
  <rect x="36" y="120" width="104" height="46" rx="8" fill="#fdeeec" stroke="#d9a79f"/>
  <text x="88" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#8c3a30">-100</text>
  <text x="160" y="150" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#5b6478">산 해에 한 번. 그 뒤로는 0입니다.</text>

  <text x="36" y="206" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">손익계산서에 적히는 감가상각비</text>
  <rect x="36" y="216" width="104" height="46" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="88" y="246" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1a2540">-20</text>
  <rect x="166" y="216" width="104" height="46" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="218" y="246" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1a2540">-20</text>
  <rect x="296" y="216" width="104" height="46" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="348" y="246" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1a2540">-20</text>
  <rect x="426" y="216" width="104" height="46" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="478" y="246" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1a2540">-20</text>
  <rect x="556" y="216" width="104" height="46" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="608" y="246" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#1a2540">-20</text>
  <text x="88" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">1년차</text>
  <text x="218" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">2년차</text>
  <text x="348" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">3년차</text>
  <text x="478" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">4년차</text>
  <text x="608" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">5년차</text>
  <text x="36" y="312" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">같은 100인데 현금은 한 해에, 비용은 다섯 해에 나뉘어 적힙니다.</text>
</svg>
