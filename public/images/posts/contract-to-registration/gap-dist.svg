<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="계약에서 등기까지 걸린 기간 분포. 61~90일이 33.8%, 91~120일이 32.7%로 둘을 합치면 66.5%다. 30일 이하는 10.1%뿐이고 121일 이상은 3.9%다. 다만 아직 등기가 끝나지 않은 건은 이 표본에 없어 실제 중앙값은 이보다 길 수 있다">
  <rect width="640" height="400" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">셋 중 둘은 두세 달 걸려요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">계약일에서 등기일까지 · 서울 아파트 매매 17,889건 · 2026년 3~5월 계약분</text>

  <text x="130" y="106" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">30일 이하</text>
  <rect x="142" y="90" width="61" height="22" rx="3" fill="#D8D2C0"/>
  <text x="211" y="107" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">10.1%</text>
  <text x="290" y="107" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">1,811건</text>

  <text x="130" y="146" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">31~60일</text>
  <rect x="142" y="130" width="117" height="22" rx="3" fill="#E8A87C"/>
  <text x="267" y="147" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">19.5%</text>
  <text x="346" y="147" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">3,487건</text>

  <text x="130" y="186" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">61~90일</text>
  <rect x="142" y="170" width="203" height="22" rx="3" fill="#E8642F"/>
  <text x="353" y="187" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">33.8%</text>
  <text x="432" y="187" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">6,049건</text>

  <text x="130" y="226" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">91~120일</text>
  <rect x="142" y="210" width="196" height="22" rx="3" fill="#E8642F"/>
  <text x="346" y="227" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#B4501F">32.7%</text>
  <text x="425" y="227" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">5,843건</text>

  <text x="130" y="266" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">121일 이상</text>
  <rect x="142" y="250" width="23" height="22" rx="3" fill="#D8D2C0"/>
  <text x="173" y="267" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8A8F98">3.9%</text>
  <text x="252" y="267" font-family="system-ui, sans-serif" font-size="12" fill="#8A8F98">699건</text>

  <line x1="32" y1="292" x2="608" y2="292" stroke="#E5E0D0"/>
  <text x="32" y="316" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">중앙값 79일 · 61~120일에 66.5%가 몰려 있어요</text>
  <text x="32" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#B4501F" font-weight="700">⚠️ 아직 등기 안 된 건은 이 표본에 없어요 — 실제 중앙값은 이보다 길 수 있습니다</text>
  <text x="32" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">다섯 칸 합 17,889건 · 막대는 0부터 · 3~5월 계약 전체 20,677건 중 등기일이 있는 건만</text>
  <text x="32" y="382" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">서울 20개 자치구 · 국토교통부 실거래 · 2026년 9월 15일 집계</text>
</svg>
