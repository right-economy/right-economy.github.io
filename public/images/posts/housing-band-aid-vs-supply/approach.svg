<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="임시방편과 근본 공급을 비교한 도식 — 임시방편은 빠르나 총량이 그대로, 근본 공급은 느리나 살 집이 늘어남">
  <rect width="740" height="340" fill="#ffffff"/>
  <text x="370" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">주거난 해법, 두 갈래 접근</text>
  <text x="370" y="62" text-anchor="middle" font-size="13" fill="#888">임시방편은 빠르지만 물량을 못 늘리고, 근본 공급은 느리지만 총량을 바꿔요</text>

  <!-- 임시방편 박스 -->
  <rect x="40" y="90" width="320" height="210" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#b91c1c">🚌 임시방편</text>
  <text x="60" y="156" font-size="13.5" fill="#444">• 폐버스 개조·임대·단기 공공주택</text>
  <text x="60" y="182" font-size="13.5" fill="#444">• 빠르게 내놓을 수 있음</text>
  <text x="60" y="208" font-size="13.5" fill="#444">• 그러나 '살 집 총량'은 안 늘어</text>
  <text x="60" y="234" font-size="13.5" fill="#444">• 수요는 그대로 → 가격 압력 지속</text>
  <text x="200" y="276" text-anchor="middle" font-size="13" fill="#b91c1c">체감: 대증요법 (열만 내림)</text>

  <!-- 근본공급 박스 -->
  <rect x="380" y="90" width="320" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="122" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">🏗️ 근본 공급</text>
  <text x="400" y="156" font-size="13.5" fill="#444">• 재건축·재개발·도심 주택 정상화</text>
  <text x="400" y="182" font-size="13.5" fill="#444">• 인허가~입주까지 시간이 걸림</text>
  <text x="400" y="208" font-size="13.5" fill="#444">• 그러나 '실제 살 집'이 늘어남</text>
  <text x="400" y="234" font-size="13.5" fill="#444">• 총량 확대 → 가격 안정 효과</text>
  <text x="540" y="276" text-anchor="middle" font-size="13" fill="#15803d">체감: 근본 치료 (원인 제거)</text>

  <text x="370" y="326" text-anchor="middle" font-size="11" fill="#aaa">개념 비교 도식 · 옳은경제 정리 · 2026.08</text>
</svg>
