<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="직거래와 중개거래를 그냥 비교하면 55퍼센트 차이로 보이지만 직거래는 전용 36.7제곱미터 중개거래는 76.0제곱미터라 크기가 다르다. 같은 단지 같은 면적끼리 맞춰 비교하면 격차는 21퍼센트다">
  <rect width="640" height="340" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">그냥 비교하면 55%, 맞춰 비교하면 21%</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">서울 아파트 매매 14,092건 · 2026년 6~8월 · 국토교통부 실거래</text>

  <rect x="32" y="92" width="576" height="94" rx="10" fill="#FFFFFF" stroke="#E5E0D0" stroke-dasharray="5 3"/>
  <text x="52" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8A8F98">① 그냥 중앙값끼리 비교하면</text>
  <text x="52" y="146" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">직거래 4.25억 · 중개거래 9.50억</text>
  <text x="380" y="146" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#8A8F98">−55%</text>
  <text x="52" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#B4501F" font-weight="700">그런데 전용면적이 36.7㎡ vs 76.0㎡ — 애초에 다른 집을 비교한 거예요</text>

  <rect x="32" y="200" width="576" height="94" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <text x="52" y="226" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1F2328">② 같은 단지 · 같은 면적끼리만 비교하면</text>
  <text x="52" y="254" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">둘 다 거래된 조합 153개에서</text>
  <text x="380" y="254" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#E8642F">−20.9%</text>
  <text x="52" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#1F2328" font-weight="700">단지와 평형이 고정되니 남는 차이가 줄어듭니다</text>

  <text x="32" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">해제 신고된 거래는 뺀 값입니다 · 격차는 조합별 중앙값의 중앙값이라 평균과 다를 수 있어요</text>
</svg>
