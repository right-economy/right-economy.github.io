<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="같은 단지 같은 면적에서 직거래와 중개거래가 둘 다 있었던 153개 조합 중 직거래가 더 싼 조합이 131개, 더 비싼 조합이 20개, 같은 조합이 2개다. 30퍼센트 이상 싼 조합은 48개다">
  <rect width="640" height="320" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">153개 중 131개에서 직거래가 더 쌌어요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">같은 단지·같은 면적에서 두 방식이 모두 거래된 조합만 셌습니다</text>

  <text x="126" y="112" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">직거래가 싸다</text>
  <rect x="136" y="94" width="420" height="26" rx="4" fill="#E8642F"/>
  <text x="156" y="113" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">131개</text>
  <text x="566" y="113" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8642F">86%</text>

  <text x="126" y="152" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">직거래가 비싸다</text>
  <rect x="136" y="134" width="64" height="26" rx="4" fill="#B8B2A0"/>
  <text x="210" y="153" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4B5563">20개</text>

  <text x="126" y="192" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#4B5563">같다</text>
  <rect x="136" y="174" width="7" height="26" rx="2" fill="#D8D2C0"/>
  <text x="153" y="193" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#8A8F98">2개</text>

  <line x1="32" y1="222" x2="608" y2="222" stroke="#E5E0D0"/>
  <text x="32" y="248" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1F2328">격차가 30%를 넘는 조합도 48개(31%)나 됩니다</text>
  <text x="32" y="272" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">다만 조합마다 직거래가 한두 건뿐인 경우가 많아 개별 단지 시세로 읽으면 안 돼요</text>

  <text x="32" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">2026년 6~8월 서울 아파트 매매 실거래 · 해제 신고분 제외 · 국토교통부</text>
</svg>
