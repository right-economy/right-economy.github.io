<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="통화스와프 발동 시 한국은행이 원화를 맡기고 달러를 받아 국내 은행과 기업에 공급하고 만기에 계약 시점 환율로 되돌리는 돈의 흐름 도식">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="40" y="36" font-size="20" font-weight="700" fill="#1a1a1a">통화스와프가 발동되면 돈은 이렇게 움직인다</text>
  <text x="40" y="58" font-size="13" fill="#6b7280">한도를 실제로 끌어 쓸 때의 흐름 (개념 도식)</text>

  <!-- 중앙은행 2개 -->
  <rect x="50" y="96" width="180" height="70" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="140" y="126" font-size="15" font-weight="700" fill="#c2410c" text-anchor="middle">한국은행</text>
  <text x="140" y="148" font-size="12" fill="#9a3412" text-anchor="middle">원화를 내놓는 쪽</text>

  <rect x="530" y="96" width="180" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="620" y="126" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">상대국 중앙은행</text>
  <text x="620" y="148" font-size="12" fill="#1e40af" text-anchor="middle">달러를 내놓는 쪽</text>

  <!-- 교환 화살표 -->
  <defs>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#F97316"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <line x1="235" y1="118" x2="524" y2="118" stroke="#F97316" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="380" y="110" font-size="12.5" font-weight="700" fill="#c2410c" text-anchor="middle">① 원화를 맡긴다</text>

  <line x1="524" y1="146" x2="235" y2="146" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="380" y="166" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">② 달러를 받아온다</text>

  <!-- 국내 공급 경로 -->
  <line x1="140" y1="171" x2="140" y2="206" stroke="#F97316" stroke-width="2.5" marker-end="url(#arrO)"/>
  <rect x="50" y="210" width="180" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="140" y="238" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">국내 은행</text>
  <text x="140" y="258" font-size="11.5" fill="#64748b" text-anchor="middle">외화 대출·경쟁입찰 방식</text>

  <line x1="235" y1="241" x2="296" y2="241" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrB)"/>
  <rect x="300" y="210" width="180" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="390" y="238" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">수입·해외차입 기업</text>
  <text x="390" y="258" font-size="11.5" fill="#64748b" text-anchor="middle">결제 대금·만기 상환</text>

  <!-- 만기 되돌림 -->
  <rect x="300" y="300" width="410" height="62" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="505" y="326" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="middle">③ 만기에 계약 시점 환율로 되돌린다</text>
  <text x="505" y="348" font-size="11.5" fill="#166534" text-anchor="middle">그 사이 환율이 올라도 갚을 원화 금액은 그대로</text>

  <line x1="620" y1="171" x2="620" y2="296" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrB)"/>

  <text x="50" y="384" font-size="11" fill="#94a3b8">통화스와프 발동 시의 자금 흐름을 단순화한 개념 도식</text>
</svg>
