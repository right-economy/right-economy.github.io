<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="실업급여는 이직 사유, 가입 기간, 재취업 활동 순으로 통과해야 하고 첫 관문에서 막히면 뒤는 보지 않는다는 그림">
  <rect width="660" height="250" fill="#fbfaf7"/>
  <text x="330" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">앞에서 막히면 뒤는 안 봅니다</text>

  <rect x="30" y="60" width="170" height="92" rx="8" fill="#f5eeee" stroke="#c38b8b"/>
  <text x="115" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">1. 이직 사유</text>
  <text x="115" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">비자발적으로</text>
  <text x="115" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">그만뒀는가</text>

  <rect x="245" y="60" width="170" height="92" rx="8" fill="#f3f1e8" stroke="#b5a86a"/>
  <text x="330" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">2. 가입 기간</text>
  <text x="330" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">퇴직 전 18개월 중</text>
  <text x="330" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">180일 이상</text>

  <rect x="460" y="60" width="170" height="92" rx="8" fill="#eef3ec" stroke="#7a9a72"/>
  <text x="545" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2b2b2b">3. 재취업 활동</text>
  <text x="545" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">일할 의사와 능력</text>
  <text x="545" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">실제로 구직</text>

  <path d="M205 106 L240 106" stroke="#999" stroke-width="2"/>
  <path d="M233 100 L241 106 L233 112 Z" fill="#999"/>
  <path d="M420 106 L455 106" stroke="#999" stroke-width="2"/>
  <path d="M448 100 L456 106 L448 112 Z" fill="#999"/>

  <text x="115" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#8a5a5a">여기서 막히면</text>
  <text x="115" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#8a5a5a">2·3은 보지 않습니다</text>
  <text x="330" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#777">재직일수가 아니라</text>
  <text x="330" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#777">보수를 받은 날</text>

  <text x="330" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">출처: 고용보험(ei.go.kr) 안내 · 고용노동부 민원마당</text>
</svg>
