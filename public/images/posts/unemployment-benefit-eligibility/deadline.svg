<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 215" role="img" aria-label="퇴직한 날의 다음 날부터 12개월이 지나면 남은 소정급여일수가 사라진다는 시간표 그림">
  <rect width="660" height="215" fill="#fbfaf7"/>
  <text x="330" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#2b2b2b">받을 수 있는 창이 12개월입니다</text>

  <line x1="60" y1="98" x2="600" y2="98" stroke="#ccc" stroke-width="3"/>
  <circle cx="60" cy="98" r="7" fill="#7a9a72"/>
  <circle cx="600" cy="98" r="7" fill="#c38b8b"/>

  <text x="60" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2b2b2b">퇴직 다음 날</text>
  <text x="60" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#555">여기서 셉니다</text>

  <text x="600" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#2b2b2b">12개월</text>
  <text x="600" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11.5" fill="#8a5a5a">남은 날짜는 사라짐</text>

  <rect x="150" y="88" width="300" height="20" rx="4" fill="#eef3ec" stroke="#7a9a72"/>
  <text x="300" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2b2b2b">실제로 받는 기간 (소정급여일수)</text>

  <text x="330" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">늦게 신청하면 150일을 받을 수 있어도</text>
  <text x="330" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#444">12개월이 끝나는 날 거기서 멈춥니다</text>

  <text x="330" y="202" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#777">출처: 고용보험(ei.go.kr) 안내</text>
</svg>
