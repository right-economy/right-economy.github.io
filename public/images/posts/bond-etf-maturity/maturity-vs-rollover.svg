<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, sans-serif" role="img" aria-label="채권을 직접 보유하면 만기일에 액면금액을 받고 투자가 끝나지만, 일반 채권 ETF는 편입한 채권이 만기에 가까워지면 팔고 더 긴 채권을 사들여 평균 잔존만기를 유지하므로 원금을 받는 날짜가 생기지 않는다는 비교">
  <rect width="720" height="360" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">원금을 받는 날이 있나</text>
  <text x="360" y="61" text-anchor="middle" font-size="12.5" fill="#8a6d5a">같은 채권을 담아도 상환일이 생기는 쪽과 생기지 않는 쪽이 있습니다</text>

  <rect x="34" y="88" width="652" height="112" rx="14" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="56" y="116" font-size="15" font-weight="800" fill="#c2410c">채권을 직접 보유</text>
  <line x1="56" y1="152" x2="600" y2="152" stroke="#e0852f" stroke-width="3"/>
  <circle cx="56" cy="152" r="6" fill="#e0852f"/>
  <circle cx="600" cy="152" r="9" fill="#c2410c"/>
  <text x="56" y="140" font-size="12" fill="#5a4636">매수</text>
  <text x="600" y="138" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">만기일</text>
  <text x="600" y="176" text-anchor="middle" font-size="12.5" fill="#5a4636">액면금액 상환</text>
  <text x="300" y="176" text-anchor="middle" font-size="12.5" fill="#8a6d5a">중간에 가격이 내려가도 만기까지 들면 액면금액</text>

  <rect x="34" y="214" width="652" height="112" rx="14" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="56" y="242" font-size="15" font-weight="800" fill="#c0392b">일반 채권 ETF</text>
  <line x1="56" y1="278" x2="660" y2="278" stroke="#c0392b" stroke-width="3" stroke-dasharray="1 0"/>
  <circle cx="56" cy="278" r="6" fill="#c0392b"/>
  <circle cx="236" cy="278" r="6" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <circle cx="416" cy="278" r="6" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <circle cx="596" cy="278" r="6" fill="#fff" stroke="#c0392b" stroke-width="3"/>
  <text x="236" y="266" text-anchor="middle" font-size="11.5" fill="#5a4636">채권 교체</text>
  <text x="416" y="266" text-anchor="middle" font-size="11.5" fill="#5a4636">채권 교체</text>
  <text x="596" y="266" text-anchor="middle" font-size="11.5" fill="#5a4636">채권 교체</text>
  <text x="56" y="266" font-size="12" fill="#5a4636">매수</text>
  <text x="360" y="302" text-anchor="middle" font-size="12.5" fill="#8a6d5a">만기가 가까워진 채권을 팔고 더 긴 채권을 사서 평균 잔존만기를 유지</text>
  <text x="672" y="282" text-anchor="middle" font-size="18" font-weight="800" fill="#c0392b">…</text>

  <text x="360" y="348" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7c2d12">일반 채권 ETF에는 액면금액을 돌려받는 날짜가 없습니다</text>
</svg>
