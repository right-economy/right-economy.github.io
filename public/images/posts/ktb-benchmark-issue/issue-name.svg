<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="국고채 종목명칭 읽는 법 도식. 기획재정부 설명으로 종목명칭은 국고 표면금리 만기년월 순서로 적으며, 국고04500-1503은 표면금리가 4.500퍼센트이고 만기가 2015년 3월인 국고채권을 뜻한다. 종목명에는 발행일이 들어가지 않는다">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">종목 이름에 숫자 두 개가 들어갑니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 기획재정부 국채시장 안내 FAQ(종목명칭) · 2026년 11월 16일 조회</text>

  <rect x="150" y="82" width="420" height="58" rx="8" fill="#f0e4d8"/>
  <text x="200" y="120" text-anchor="middle" font-size="22" font-weight="800" fill="#5a4636">국고</text>
  <text x="300" y="120" text-anchor="middle" font-size="22" font-weight="800" fill="#1f5c99">04500</text>
  <text x="372" y="120" text-anchor="middle" font-size="22" font-weight="800" fill="#5a4636">-</text>
  <text x="450" y="120" text-anchor="middle" font-size="22" font-weight="800" fill="#2c5c3f">1503</text>

  <path d="M300 146 L300 166" stroke="#1f5c99" stroke-width="2"/>
  <path d="M450 146 L450 166" stroke="#2c5c3f" stroke-width="2"/>

  <rect x="196" y="170" width="208" height="62" rx="6" fill="#eaf1f8"/>
  <text x="300" y="194" text-anchor="middle" font-size="13" font-weight="800" fill="#1f5c99">표면금리</text>
  <text x="300" y="216" text-anchor="middle" font-size="12.5" fill="#1f5c99">4.500%</text>

  <rect x="346" y="170" width="208" height="62" rx="6" fill="#eaf4ec"/>
  <text x="450" y="194" text-anchor="middle" font-size="13" font-weight="800" fill="#1e7a46">만기년월</text>
  <text x="450" y="216" text-anchor="middle" font-size="12.5" fill="#1e7a46">2015년 3월</text>

  <text x="50" y="264" font-size="12.5" fill="#5a4636">기획재정부 설명으로 국고채 종목명칭은 국고 표면금리 만기년월 순서로 표기합니다.</text>
  <text x="50" y="285" font-size="12.5" fill="#6f5443">종목 이름에는 발행일이 들어가지 않습니다. 같은 이름 아래 여러 달의 발행분이 묶여 있습니다.</text>
</svg>
