  <text x="388" y="143" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5c3f">5년물</text>

  <rect x="50" y="166" width="124" height="40" rx="6" fill="#cfe3d5"/>
  <text x="112" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5c3f">10년물</text>
