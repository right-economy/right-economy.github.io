<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Pretendard, sans-serif" role="img" aria-label="국고채 지표종목 구성표. 재정경제부 국채시장 FAQ 기준으로 지표종목은 2년물 3년물 5년물 10년물 20년물 30년물 50년물 일반 국고채 일곱 개와 물가연동 10년물 하나를 합해 모두 여덟 개 종목이다. 물가연동국고채는 같은 만기여도 따로 센다">
  <rect width="720" height="350" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">지표종목은 한 번에 여덟 개입니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 재정경제부 국채시장 안내 FAQ(지표종목) · 2026년 11월 16일 조회</text>

  <rect x="50" y="80" width="400" height="30" rx="5" fill="#eaf1f8"/>
