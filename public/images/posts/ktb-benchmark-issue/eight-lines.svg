  <text x="250" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5c3f">20년물</text>
  <rect x="326" y="166" width="124" height="40" rx="6" fill="#cfe3d5"/>
  <text x="388" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#2c5c3f">30년물</text>

