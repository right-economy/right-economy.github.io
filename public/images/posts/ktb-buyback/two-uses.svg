<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Pretendard, sans-serif" role="img" aria-label="바이백의 두 가지 쓰임 비교로 정례 바이백은 매달 발행계획에 함께 적혀 만기가 몰린 해의 부담을 미리 더는 용도이며 2026년 11월에는 2년 3년 5년물 경과종목 대상 2조원 규모였고, 긴급 바이백은 금리가 급등할 때 시장을 달래려고 꺼내는 조치로 2026년 3월에는 두 차례에 걸쳐 5조원 규모였다">
  <rect width="720" height="300" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">같은 바이백인데 쓰임이 둘입니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">출처: 신아일보(2026.10.29)·한국경제(2026.3.26)</text>

  <rect x="36" y="80" width="312" height="180" rx="10" fill="#eaf1f8" stroke="#1f5c99" stroke-width="1.4"/>
  <text x="192" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#1f5c99">정례 바이백</text>
  <text x="192" y="142" text-anchor="middle" font-size="12.5" fill="#5a4636">매달 발행계획에 함께 적힙니다</text>
  <text x="192" y="166" text-anchor="middle" font-size="12.5" fill="#5a4636">만기가 몰린 해의 부담을</text>
  <text x="192" y="188" text-anchor="middle" font-size="12.5" fill="#5a4636">미리 덜어 둡니다</text>
  <text x="192" y="222" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f5c99">2026년 11월 2조원</text>
  <text x="192" y="244" text-anchor="middle" font-size="12" fill="#6f5443">2·3·5년물 경과종목 대상</text>

  <rect x="372" y="80" width="312" height="180" rx="10" fill="#f7efe2" stroke="#c9873a" stroke-width="1.4"/>
  <text x="528" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#8a5a2b">긴급 바이백</text>
  <text x="528" y="142" text-anchor="middle" font-size="12.5" fill="#5a4636">금리가 갑자기 뛸 때</text>
  <text x="528" y="166" text-anchor="middle" font-size="12.5" fill="#5a4636">따로 꺼내는 시장 안정 조치입니다</text>
  <text x="528" y="190" text-anchor="middle" font-size="12.5" fill="#5a4636">일정도 그때 정합니다</text>
  <text x="528" y="222" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8a5a2b">2026년 3월 5조원</text>
  <text x="528" y="244" text-anchor="middle" font-size="12" fill="#6f5443">두 차례로 나눠 시행</text>
</svg>
