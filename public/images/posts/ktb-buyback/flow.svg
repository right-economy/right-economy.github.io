<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="국고채 바이백의 순서를 보여주는 도식으로 정부가 만기 전 국고채를 시장에서 사들이면 그 채권은 조기상환으로 사라지고 그해 만기 물량이 줄며 동시에 채권을 사는 수요가 생겨 가격이 오르고 금리는 내린다">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">바이백은 두 가지를 동시에 합니다</text>
  <text x="360" y="57" text-anchor="middle" font-size="12.5" fill="#6f5443">정부가 만기 전 국고채를 사들일 때 생기는 일 · 출처: 옳은경제 정리</text>

  <rect x="36" y="82" width="190" height="78" rx="10" fill="#eaf1f8" stroke="#1f5c99" stroke-width="1.4"/>
  <text x="131" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#1f5c99">정부가 사들입니다</text>
  <text x="131" y="138" text-anchor="middle" font-size="12" fill="#5a4636">만기가 남은 국고채를</text>

  <path d="M232 121 L264 121" stroke="#c9a37a" stroke-width="2.2"/>
  <path d="M264 121 l-9 -5 v10 z" fill="#c9a37a"/>

  <rect x="270" y="82" width="190" height="78" rx="10" fill="#eaf4ec" stroke="#1e7a46" stroke-width="1.4"/>
  <text x="365" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#1e7a46">그 빚이 사라집니다</text>
  <text x="365" y="138" text-anchor="middle" font-size="12" fill="#5a4636">만기 전에 갚은 셈입니다</text>

  <path d="M466 121 L498 121" stroke="#c9a37a" stroke-width="2.2"/>
  <path d="M498 121 l-9 -5 v10 z" fill="#c9a37a"/>

  <rect x="504" y="82" width="180" height="78" rx="10" fill="#f7efe2" stroke="#c9873a" stroke-width="1.4"/>
  <text x="594" y="112" text-anchor="middle" font-size="14" font-weight="800" fill="#8a5a2b">그해 갚을 돈이</text>
  <text x="594" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#8a5a2b">줄어듭니다</text>

  <rect x="36" y="188" width="648" height="96" rx="10" fill="#fff" stroke="#d8c6b4" stroke-width="1.3"/>
  <text x="56" y="216" font-size="13.5" font-weight="800" fill="#7c2d12">사는 동안 시장에서는</text>
  <text x="56" y="244" font-size="12.5" fill="#5a4636">정부가 채권을 사면 그만큼 사려는 쪽이 늘어 채권 가격이 오릅니다. 채권 가격과 금리는 반대로 움직이니</text>
  <text x="56" y="268" font-size="12.5" fill="#5a4636">시장금리는 내려갑니다. 금리가 갑자기 뛸 때 정부가 바이백을 꺼내는 이유가 여기 있습니다.</text>
</svg>
