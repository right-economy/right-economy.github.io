<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Pretendard, sans-serif" role="img" aria-label="15세 이상 인구는 경제활동인구와 비경제활동인구로 나뉘고, 경제활동인구는 다시 취업자와 실업자로 나뉜다. 실업률의 분모는 경제활동인구뿐이고, 고용률과 경제활동참가율의 분모는 15세 이상 인구 전체다. 그래서 실업자가 구직을 멈추면 비경제활동인구로 옮겨가 실업률의 분모와 분자에서 함께 빠진다">
  <rect width="720" height="360" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">같은 고용 통계, 분모가 다릅니다</text>
  <text x="360" y="61" text-anchor="middle" font-size="12.5" fill="#8a6d5a">어디까지를 세느냐에 따라 숫자가 갈립니다</text>

  <rect x="34" y="84" width="652" height="40" rx="10" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="360" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">15세 이상 인구</text>

  <rect x="34" y="146" width="430" height="106" rx="12" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="249" y="172" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b3261e">경제활동인구 (일하거나, 일을 찾는 중)</text>
  <rect x="50" y="186" width="198" height="50" rx="9" fill="#fff6f4" stroke="#f2c4c4"/>
  <text x="149" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#5a4636">취업자</text>
  <rect x="258" y="186" width="190" height="50" rx="9" fill="#fff6f4" stroke="#f2c4c4"/>
  <text x="353" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#5a4636">실업자</text>

  <rect x="478" y="146" width="208" height="106" rx="12" fill="#f3f0ea" stroke="#ded7cc"/>
  <text x="582" y="172" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6b5b4a">비경제활동인구</text>
  <text x="582" y="199" text-anchor="middle" font-size="12" fill="#8a6d5a">구직을 멈춘 사람,</text>
  <text x="582" y="218" text-anchor="middle" font-size="12" fill="#8a6d5a">학업·육아·질병 등으로</text>
  <text x="582" y="237" text-anchor="middle" font-size="12" fill="#8a6d5a">일을 찾지 않는 사람</text>

  <rect x="34" y="274" width="208" height="62" rx="11" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="138" y="297" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">실업률</text>
  <text x="138" y="320" text-anchor="middle" font-size="12" fill="#5a4636">분모 = 경제활동인구</text>

  <rect x="256" y="274" width="208" height="62" rx="11" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="360" y="297" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">고용률</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#5a4636">분모 = 15세 이상 인구</text>

  <rect x="478" y="274" width="208" height="62" rx="11" fill="#fef3ec" stroke="#eaddd3"/>
  <text x="582" y="297" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">경제활동참가율</text>
  <text x="582" y="320" text-anchor="middle" font-size="12" fill="#5a4636">분모 = 15세 이상 인구</text>
</svg>
