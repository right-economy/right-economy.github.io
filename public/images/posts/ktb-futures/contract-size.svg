<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="국채선물 한 계약 액면 1억원과 호가 0.01포인트의 금액 1만원, 1670계약의 명목금액 1670억원을 보여주는 도식">
  <style>
    text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
    .h{font-size:17px;font-weight:700;}
    .big{font-size:26px;font-weight:700;}
    .s{font-size:14px;}
    .cap{font-size:12px;}
  </style>
  <rect x="0" y="0" width="720" height="400" style="fill:#ffffff"/>

  <text x="24" y="38" class="h" style="fill:#1f2933">계약 수를 금액으로 바꾸는 세 단계</text>

  <rect x="24" y="58" width="208" height="128" rx="12" style="fill:#fff3e6;stroke:#e8743b;stroke-width:2"/>
  <text x="128" y="88" class="s" text-anchor="middle" style="fill:#8a3b12">1계약의 액면</text>
  <text x="128" y="126" class="big" text-anchor="middle" style="fill:#8a3b12">1억원</text>
  <text x="128" y="156" class="s" text-anchor="middle" style="fill:#8a3b12">3·5·10·30년물</text>
  <text x="128" y="174" class="s" text-anchor="middle" style="fill:#8a3b12">모두 같습니다</text>

  <rect x="256" y="58" width="208" height="128" rx="12" style="fill:#f5f7fa;stroke:#9aa5b1;stroke-width:2"/>
  <text x="360" y="88" class="s" text-anchor="middle" style="fill:#1f2933">호가 0.01포인트가</text>
  <text x="360" y="126" class="big" text-anchor="middle" style="fill:#1f2933">1만원</text>
  <text x="360" y="156" class="s" text-anchor="middle" style="fill:#1f2933">3년·5년물 기준</text>
  <text x="360" y="174" class="s" text-anchor="middle" style="fill:#1f2933">(계약 1개당)</text>

  <rect x="488" y="58" width="208" height="128" rx="12" style="fill:#eef6ff;stroke:#2f6fa8;stroke-width:2"/>
  <text x="592" y="88" class="s" text-anchor="middle" style="fill:#1b4a73">1,670계약이면</text>
  <text x="592" y="126" class="big" text-anchor="middle" style="fill:#1b4a73">1,670억원</text>
  <text x="592" y="156" class="s" text-anchor="middle" style="fill:#1b4a73">액면으로 환산한</text>
  <text x="592" y="174" class="s" text-anchor="middle" style="fill:#1b4a73">명목 금액입니다</text>

  <rect x="24" y="212" width="672" height="106" rx="12" style="fill:#fafbfc;stroke:#cbd2d9;stroke-width:1.5"/>
  <text x="44" y="242" class="s" style="fill:#1f2933">2026년 11월 18일 외국인은 3년 국채선물 316계약, 10년 국채선물 1,670계약을 순매수했습니다.</text>
  <text x="44" y="266" class="s" style="fill:#1f2933">액면으로 환산하면 각각 316억원과 1,670억원입니다.</text>
  <text x="44" y="296" class="s" style="fill:#8a3b12">실제로 넣는 돈은 이 금액이 아니라 증거금이라, 명목 금액은 포지션의 크기를 재는 단위입니다.</text>

  <text x="24" y="356" class="cap" style="fill:#616e7c">계약 수 출처: 스페셜타임스(2026.11.18) · 거래단위와 호가단위 출처: 재정경제부 국채시장, 한국거래소 상품명세</text>
  <text x="24" y="378" class="cap" style="fill:#616e7c">환산식: 계약 수 × 액면 1억원 · 기준: 2026년 11월 18일</text>
</svg>
