<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="한국산 유정용 강관의 예치금률과 재심 확정 세율을 비교한 막대그래프입니다. 원심에서 정해진 기타 기업 예치금률은 5.24퍼센트인데, 2023년에서 2024년 재심에서 확정된 세율은 세아제강 9.80퍼센트, 개별 조사를 받지 않은 기업 19.49퍼센트, 넥스틸 29.18퍼센트였습니다.">
<style>
text{font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#1b2733}
.t{font-size:17px;font-weight:700}
.n{font-size:13px;font-weight:700}
.v{font-size:13px;font-weight:700;fill:#1b2733}
.c{font-size:12px;fill:#5b6b7a}
</style>
<rect width="720" height="330" fill="#ffffff"/>
<text class="t" x="28" y="34">예치금률과 재심에서 확정된 세율</text>

<line x1="210" y1="58" x2="210" y2="258" stroke="#5b6b7a" stroke-width="2"/>
<line x1="347" y1="58" x2="347" y2="258" stroke="#eaf0f6"/>
<line x1="483" y1="58" x2="483" y2="258" stroke="#eaf0f6"/>
<line x1="620" y1="58" x2="620" y2="258" stroke="#eaf0f6"/>
<text class="c" x="206" y="276">0</text>
<text class="c" x="337" y="276">10%</text>
<text class="c" x="473" y="276">20%</text>
<text class="c" x="610" y="276">30%</text>

<text class="n" x="28" y="82">원심 기타 기업 예치금률</text>
<rect x="210" y="66" width="72" height="24" fill="#b4531a"/>
<text class="v" x="290" y="85">5.24%</text>

<text class="n" x="28" y="132">세아제강 확정</text>
<rect x="210" y="116" width="134" height="24" fill="#2f6fb5"/>
<text class="v" x="352" y="135">9.80%</text>

<text class="n" x="28" y="182">개별 조사 안 받은 기업</text>
<rect x="210" y="166" width="266" height="24" fill="#2f6fb5"/>
<text class="v" x="484" y="185">19.49%</text>

<text class="n" x="28" y="232">넥스틸 확정</text>
<rect x="210" y="216" width="399" height="24" fill="#2f6fb5"/>
<text class="v" x="617" y="235">29.18%</text>

<text class="c" x="28" y="304">주황 막대는 원심에서 정해져 지금도 쓰이는 기타 기업 예치금률이고, 파란 막대는 2023년 9월부터 2024년 8월까지를</text>
<text class="c" x="28" y="320">대상으로 한 재심에서 확정된 세율이다. 기준: 2026년 11월 16일 정정 공고 · 출처: 91 FR 60583, FR Doc 2026-23258</text>
</svg>
