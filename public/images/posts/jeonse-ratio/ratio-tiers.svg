<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" role="img" aria-label="전세가율 구간별 위험 신호를 안전·보통·주의·위험 4단계로 나눈 도표">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="32" y="46" font-size="22" font-weight="700" fill="#1f2937">전세가율 구간별 위험 신호</text>
  <text x="32" y="72" font-size="13" fill="#6b7280">전세보증금 ÷ 매매가 × 100 (%)</text>

  <!-- row 1: safe -->
  <rect x="32" y="92" width="576" height="52" rx="10" fill="#ecfdf5"/>
  <rect x="32" y="92" width="8" height="52" rx="4" fill="#10b981"/>
  <circle cx="72" cy="118" r="12" fill="#10b981"/>
  <text x="100" y="115" font-size="17" font-weight="700" fill="#065f46">60% 이하 · 안전</text>
  <text x="100" y="135" font-size="13" fill="#047857">집값 대비 보증금 여유가 넉넉해요</text>

  <!-- row 2: normal -->
  <rect x="32" y="152" width="576" height="52" rx="10" fill="#f7fee7"/>
  <rect x="32" y="152" width="8" height="52" rx="4" fill="#84cc16"/>
  <circle cx="72" cy="178" r="12" fill="#84cc16"/>
  <text x="100" y="175" font-size="17" font-weight="700" fill="#3f6212">60~70% · 보통</text>
  <text x="100" y="195" font-size="13" fill="#4d7c0f">평범한 수준, 등기부·시세는 확인</text>

  <!-- row 3: caution -->
  <rect x="32" y="212" width="576" height="52" rx="10" fill="#fff7ed"/>
  <rect x="32" y="212" width="8" height="52" rx="4" fill="#f59e0b"/>
  <circle cx="72" cy="238" r="12" fill="#f59e0b"/>
  <text x="100" y="235" font-size="17" font-weight="700" fill="#92400e">70~80% · 주의</text>
  <text x="100" y="255" font-size="13" fill="#b45309">근저당·반환보증을 꼼꼼히 챙길 구간</text>

  <!-- row 4: danger -->
  <rect x="32" y="272" width="576" height="52" rx="10" fill="#fef2f2"/>
  <rect x="32" y="272" width="8" height="52" rx="4" fill="#ef4444"/>
  <circle cx="72" cy="298" r="12" fill="#ef4444"/>
  <text x="100" y="295" font-size="17" font-weight="700" fill="#991b1b">80% 초과 · 위험</text>
  <text x="100" y="315" font-size="13" fill="#b91c1c">집값이 조금만 빠져도 깡통전세 위험</text>
</svg>
