<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="신규 택지 착공 소요기간을 68개월에서 37개월로 단축하는 막대그래프">
  <rect width="720" height="330" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1f2937">이번 대책의 진짜 핵심 — 착공까지 걸리는 시간</text>
  <text x="40" y="68" font-size="14" fill="#6b7280">신규 택지 조성~착공 소요기간 목표 (약 31개월 단축)</text>

  <!-- scale: 1 month = 8px, start x=180 -->
  <!-- 기존 68개월 -> 544px -->
  <rect x="180" y="110" width="544" height="44" rx="4" fill="#9ca3af"/>
  <text x="170" y="138" font-size="15" fill="#374151" text-anchor="end">기존</text>
  <text x="712" y="138" font-size="15" font-weight="700" fill="#4b5563" text-anchor="end">68개월</text>

  <!-- 목표 37개월 -> 296px -->
  <rect x="180" y="180" width="296" height="44" rx="4" fill="#f59e0b"/>
  <text x="170" y="208" font-size="15" fill="#374151" text-anchor="end">목표</text>
  <text x="464" y="208" font-size="15" font-weight="700" fill="#b45309" text-anchor="end">37개월</text>

  <!-- delta bracket -->
  <line x1="476" y1="250" x2="724" y2="250" stroke="#ef4444" stroke-width="1"/>
  <text x="600" y="272" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">▼ 31개월 단축</text>

  <text x="180" y="308" font-size="12" fill="#9ca3af">기준: 2026.8.13 공급대책 발표 · 단위: 개월 · 출처: 국토교통부(이투데이 2026.8.13 보도 재구성)</text>
</svg>
