<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="즉시·2027년·2030년으로 나뉘는 시행 시점 타임라인 도식">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1f2937">언제 체감될까 — 대책마다 시차가 달라요</text>
  <text x="40" y="68" font-size="14" fill="#6b7280">'발표'와 '입주'는 다른 시간표예요. 투기 규제는 즉시, 공급은 수년 뒤</text>

  <line x1="90" y1="165" x2="650" y2="165" stroke="#d1d5db" stroke-width="3"/>

  <circle cx="150" cy="165" r="13" fill="#ef4444"/>
  <text x="150" y="128" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">즉시</text>
  <text x="150" y="200" font-size="13" fill="#374151" text-anchor="middle">그린벨트·인접지</text>
  <text x="150" y="219" font-size="13" fill="#374151" text-anchor="middle">토지거래허가 5년</text>

  <circle cx="370" cy="165" r="13" fill="#f59e0b"/>
  <text x="370" y="128" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">2027.1</text>
  <text x="370" y="200" font-size="13" fill="#374151" text-anchor="middle">청년미래보금자리론</text>
  <text x="370" y="219" font-size="13" fill="#374151" text-anchor="middle">청년 주거지원 3종</text>

  <circle cx="590" cy="165" r="13" fill="#6b7280"/>
  <text x="590" y="128" font-size="15" font-weight="700" fill="#374151" text-anchor="middle">~2030</text>
  <text x="590" y="200" font-size="13" fill="#374151" text-anchor="middle">신규 택지 착공</text>
  <text x="590" y="219" font-size="13" fill="#374151" text-anchor="middle">(입주는 그 이후)</text>

  <text x="90" y="278" font-size="12" fill="#9ca3af">출처: 국토교통부 2026.8.13 공급대책(이투데이·파이낸셜뉴스 2026.8.13 보도 재구성)</text>
</svg>
