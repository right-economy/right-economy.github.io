<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="투자원금 400만 원과 융자 600만 원을 합쳐 1000만 원을 투자한 뒤, 처분금액이 530만 원에 그쳐 융자금 600만 원에 70만 원이 모자라고, 투자원금 400만 원에 추가 입금 70만 원을 더한 총손실이 470만 원이 되는 구조">
  <rect width="720" height="310" fill="#ffffff"/>
  <text x="24" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1f2937">처분금액이 빌린 돈에 못 미치면 모자란 만큼 더 넣는다</text>

  <text x="24" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">살 때</text>
  <rect x="100" y="52" width="200" height="30" fill="#93c5fd"/>
  <rect x="300" y="52" width="300" height="30" fill="#2563eb"/>
  <text x="200" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e3a5f">내 돈 400만</text>
  <text x="450" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">빌린 돈 600만</text>
  <text x="608" y="72" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280">합 1,000만 원</text>

  <text x="24" y="136" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">팔린 뒤</text>
  <rect x="100" y="122" width="265" height="30" fill="#9ca3af"/>
  <text x="232" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">처분금액 530만</text>
  <rect x="365" y="122" width="35" height="30" fill="#e0331a"/>
  <text x="412" y="142" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e0331a">70만 원 모자람 → 따로 입금</text>
  <line x1="100" y1="160" x2="400" y2="160" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">빌린 돈 600만 원을 먼저 갚는다</text>

  <text x="24" y="226" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">남은 것</text>
  <rect x="100" y="212" width="200" height="30" fill="#f3b0b0"/>
  <rect x="300" y="212" width="35" height="30" fill="#e0331a"/>
  <text x="200" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d">잃은 원금 400만</text>
  <text x="347" y="232" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e0331a">+70만 = 총손실 470만 원</text>

  <text x="24" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#4b5563">내 돈만 썼다면 같은 손실이 나오려면 주가가 47% 내려야 한다. 빌린 돈이 섞이면 39% 구간에서 나온다.</text>
  <text x="24" y="296" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">가로 길이는 금액에 비례한다 (1,000만 원 = 500px). 한국투자증권 신용거래설명서 예시</text>
</svg>
