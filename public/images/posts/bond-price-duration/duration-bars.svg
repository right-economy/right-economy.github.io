<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="시장 금리가 1퍼센트포인트 오를 때 채권값이 대략 얼마나 떨어지는지를 듀레이션별로 비교한 가로 막대 그래프. 듀레이션 2년은 약 2퍼센트, 5년은 약 5퍼센트, 10년은 약 10퍼센트, 20년은 약 20퍼센트 떨어진다">
  <rect width="760" height="360" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .lbl{font-size:13.5px;font-weight:600}
    .val{font-size:13.5px;font-weight:700;fill:#c2410c}
    .note{font-size:12px;fill:#7a7066}
    .bar{fill:#f4a97b}
    .bar4{fill:#c2410c}
    .axis{stroke:#c9bfae;stroke-width:1.5}
  </style>

  <text class="title" x="30" y="36">금리가 1%p 오를 때 채권값 변화 (근사)</text>
  <text class="note" x="30" y="58">듀레이션이 2배면 값이 흔들리는 폭도 대략 2배가 된다</text>

  <line class="axis" x1="150" y1="76" x2="150" y2="300"/>

  <text class="lbl" x="30" y="105">듀레이션 2년</text>
  <rect class="bar" x="150" y="88" width="52" height="28" rx="4"/>
  <text class="val" x="212" y="107">−2%</text>

  <text class="lbl" x="30" y="163">듀레이션 5년</text>
  <rect class="bar" x="150" y="146" width="130" height="28" rx="4"/>
  <text class="val" x="290" y="165">−5%</text>

  <text class="lbl" x="30" y="221">듀레이션 10년</text>
  <rect class="bar" x="150" y="204" width="260" height="28" rx="4"/>
  <text class="val" x="420" y="223">−10%</text>

  <text class="lbl" x="30" y="279">듀레이션 20년</text>
  <rect class="bar4" x="150" y="262" width="520" height="28" rx="4"/>
  <text class="val" x="680" y="281">−20%</text>

  <text class="note" x="30" y="330">계산: 가격 변화율 ≈ −(듀레이션 × 금리 변화폭). 실제 값은 볼록성 때문에 이 근사보다 덜 떨어진다.</text>
</svg>
