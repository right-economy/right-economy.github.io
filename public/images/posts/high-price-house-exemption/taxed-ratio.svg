<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="1세대 1주택 비과세에서 집값이 12억을 넘을 때 양도차익 중 과세되는 비율을 보여주는 막대 도식. 12억은 0퍼센트, 13억 7.7퍼센트, 15억 20퍼센트, 18억 33.3퍼센트, 20억 40퍼센트, 24억 50퍼센트로 집값이 오를수록 과세 비율이 커지지만 전액이 과세되지는 않는다">
  <rect width="760" height="340" fill="#ffffff"/>
  <style>
    text{font-family:'Pretendard',system-ui,sans-serif;fill:#2a2521}
    .title{font-size:17px;font-weight:700}
    .note{font-size:12px;fill:#7a7066}
    .lbl{font-size:13px;font-weight:700}
    .val{font-size:13px;font-weight:800;fill:#c2410c}
    .sub{font-size:11.5px;fill:#7a7066}
  </style>

  <text class="title" x="30" y="34">12억을 넘어도 전부 과세되지는 않는다</text>
  <text class="note" x="30" y="56">양도차익 중 과세되는 비율 = (양도가액 − 12억) ÷ 양도가액. 1세대 1주택 요건을 갖춘 경우</text>

  <text class="lbl" x="30" y="100">12억</text>
  <rect x="100" y="86" width="2" height="20" fill="#c9bfae"/>
  <text class="val" x="116" y="101">0%</text>
  <text class="sub" x="170" y="101">전액 비과세</text>

  <text class="lbl" x="30" y="136">13억</text>
  <rect x="100" y="122" width="46" height="20" fill="#f4a97b"/>
  <text class="val" x="156" y="137">7.7%</text>

  <text class="lbl" x="30" y="172">15억</text>
  <rect x="100" y="158" width="120" height="20" fill="#f4a97b"/>
  <text class="val" x="230" y="173">20%</text>
  <text class="sub" x="282" y="173">아래 계산 예시가 이 자리</text>

  <text class="lbl" x="30" y="208">18억</text>
  <rect x="100" y="194" width="200" height="20" fill="#e8854f"/>
  <text class="val" x="310" y="209">33.3%</text>

  <text class="lbl" x="30" y="244">20억</text>
  <rect x="100" y="230" width="240" height="20" fill="#e8854f"/>
  <text class="val" x="350" y="245">40%</text>

  <text class="lbl" x="30" y="280">24억</text>
  <rect x="100" y="266" width="300" height="20" fill="#c2410c"/>
  <text class="val" x="410" y="281">50%</text>
  <text class="sub" x="462" y="281">24억이어야 절반이 과세된다</text>

  <text class="sub" x="30" y="322">기준: 소득세법 제89조 제1항 제3호 · 같은 법 시행령 제160조 · 2026년 10월 4일 확인</text>
</svg>
