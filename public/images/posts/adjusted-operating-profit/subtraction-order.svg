<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="매출액에서 매출원가와 판매비와관리비를 차례로 빼면 영업이익이 되는 뺄셈 순서 도표">
  <rect width="720" height="320" fill="#fcfcfd"/>
  <text x="36" y="42" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700" fill="#1a2540">영업이익까지는 빼는 순서가 기준서에 적혀 있습니다</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">매출액 1,000, 매출원가 600, 판매비와관리비 300으로 둔 가상의 예시 · 단위 없음 · 기준은 K-IFRS 제1001호(2012년 개정)</text>

  <rect x="36" y="92" width="624" height="40" rx="8" fill="#eef2fb" stroke="#9fb3d9"/>
  <text x="52" y="118" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#1a2540">매출액</text>
  <text x="644" y="118" text-anchor="end" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" font-weight="700" fill="#1a2540">1,000</text>

  <text x="52" y="160" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#8c3a30">− 매출원가</text>
  <text x="644" y="160" text-anchor="end" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#8c3a30">600</text>
  <text x="52" y="188" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#8c3a30">− 판매비와관리비</text>
  <text x="644" y="188" text-anchor="end" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="15" fill="#8c3a30">300</text>
  <line x1="36" y1="202" x2="660" y2="202" stroke="#c7cedd"/>

  <rect x="36" y="214" width="624" height="46" rx="8" fill="#e9f3ec" stroke="#8fba9d"/>
  <text x="52" y="243" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700" fill="#1f5133">영업이익</text>
  <text x="644" y="243" text-anchor="end" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700" fill="#1f5133">100</text>

  <text x="36" y="292" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="14" fill="#1a2540">이 세 줄은 손익계산서 본문에 그대로 실리고, 회사가 순서나 항목을 바꿀 수 없습니다.</text>
  <text x="36" y="312" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="13" fill="#5b6478">출처: 금융위원회 K-IFRS 제1001호 영업손익 산정 관련 개정(2012-12-31 시행)</text>
</svg>
