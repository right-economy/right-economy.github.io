<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="전세대출 DSR은 1주택자가 수도권 또는 규제지역에서 전세대출을 받을 때 적용되고, 무주택자는 2026년 9월 기준 적용되지 않으며, 정책 목적 전세대출은 제외된다">
  <rect width="640" height="340" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">내 전세대출도 DSR에 들어갈까요</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">2025년 10월 29일 시행 · 2026년 9월 기준 · 금융위원회 발표문</text>

  <rect x="32" y="90" width="576" height="66" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <text x="52" y="118" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">1주택자 + 수도권·규제지역에서 전세대출</text>
  <text x="52" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">보유한 집이 어디에 있는지는 따지지 않아요</text>
  <text x="574" y="130" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#E8642F">적용</text>

  <rect x="32" y="168" width="576" height="56" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="192" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">무주택자</text>
  <text x="52" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">확대할지는 검토 중이라고 밝혔어요</text>
  <text x="574" y="200" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">해당 없음</text>

  <rect x="32" y="236" width="576" height="56" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="260" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">정책적 목적의 전세대출</text>
  <text x="52" y="282" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">발표문에 제외로 적혀 있어요</text>
  <text x="574" y="268" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A8F98">제외</text>

  <text x="32" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">2주택 이상은 이 발표문에 기준이 따로 적혀 있지 않습니다 · 실제 적용은 은행 심사 기준을 확인해야 해요</text>
</svg>
