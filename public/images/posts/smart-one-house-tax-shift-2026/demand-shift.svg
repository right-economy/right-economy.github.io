<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="초고가 40억+에서 20~30억 준상급지로 매수 시선이 이동하는 흐름 도식">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2937">'똘똘한 한 채'에서 '덜 똘똘한 한 채'로?</text>
  <text x="40" y="66" font-size="14" fill="#6b7280">세금이 '어떤 집을 살까'의 기준을 흔든다는 시장 전망</text>

  <!-- from box -->
  <rect x="60" y="110" width="230" height="90" rx="10" fill="#fef2f2" stroke="#f87171"/>
  <text x="175" y="145" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">초고가 '똘똘한 한 채'</text>
  <text x="175" y="172" font-size="13" fill="#991b1b" text-anchor="middle">40억+ 세부담↑ → 관망</text>

  <!-- arrow -->
  <line x1="300" y1="155" x2="418" y2="155" stroke="#9ca3af" stroke-width="3"/>
  <polygon points="418,148 434,155 418,162" fill="#9ca3af"/>
  <text x="367" y="142" font-size="13" fill="#6b7280" text-anchor="middle">시선 이동</text>

  <!-- to box -->
  <rect x="440" y="110" width="230" height="90" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text x="555" y="145" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">20억~30억 준상급지</text>
  <text x="555" y="172" font-size="13" fill="#065f46" text-anchor="middle">과세선 아래·대단지·역세권</text>

  <text x="60" y="238" font-size="12" fill="#9ca3af">관측·전망이며 확정된 흐름은 아니에요 · 출처: 헤럴드경제·파이낸셜뉴스 2026.8 보도 재구성</text>
</svg>
