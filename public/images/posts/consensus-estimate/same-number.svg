<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="같은 발표값이라도 컨센서스가 어디에 있었느냐에 따라 서프라이즈와 쇼크로 갈린다">
  <rect width="720" height="330" fill="#fbfbfd"/>
  <text x="24" y="38" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" fill="#1a2540">같은 발표값인데 반대로 읽히는 이유</text>
  <rect x="24" y="64" width="320" height="226" rx="12" fill="#ffffff" stroke="#dfe4ec"/>
  <rect x="376" y="64" width="320" height="226" rx="12" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="48" y="98" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="15" fill="#6b7689">컨센서스가 아래에 있었다면</text>
  <text x="400" y="98" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="15" fill="#6b7689">컨센서스가 위에 있었다면</text>
  <text x="48" y="140" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#8c95a6">컨센서스</text>
  <text x="140" y="140" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#8c95a6">영업이익 1조</text>
  <text x="400" y="140" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#8c95a6">컨센서스</text>
  <text x="492" y="140" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#8c95a6">영업이익 1조 4천억</text>
  <text x="48" y="178" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1a2540">발표값</text>
  <text x="140" y="178" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1a2540">영업이익 1조 2천억</text>
  <text x="400" y="178" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" fill="#1a2540">발표값</text>
  <text x="492" y="178" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="700" fill="#1a2540">영업이익 1조 2천억</text>
  <rect x="48" y="206" width="272" height="56" rx="8" fill="#eef4ff"/>
  <rect x="400" y="206" width="272" height="56" rx="8" fill="#fdeeea"/>
  <text x="68" y="241" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#1f4fd8">전망을 웃돈 쪽으로 읽힙니다</text>
  <text x="420" y="241" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" fill="#d6341f">전망에 못 미친 쪽으로 읽힙니다</text>
  <text x="24" y="318" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12" fill="#8c95a6">설명용으로 지어낸 금액입니다. 특정 기업의 실제 실적이 아닙니다.</text>
</svg>
