<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" role="img" aria-label="주택연금이 어떻게 돈이 도는지 보여주는 3단계 도식과 정산 방식 설명">
  <rect width="760" height="340" fill="#fffdf9"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1f2937">주택연금은 어떻게 돈이 도는 걸까?</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="200" height="90" rx="12" fill="#fff2e6" stroke="#f28c28" stroke-width="2"/>
  <text x="130" y="105" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">① 내 집을 담보로</text>
  <text x="130" y="132" font-size="13" fill="#374151" text-anchor="middle">공적기관에 맡겨요</text>
  <text x="130" y="150" font-size="13" fill="#374151" text-anchor="middle">(소유·거주는 그대로)</text>

  <!-- arrow -->
  <line x1="230" y1="115" x2="290" y2="115" stroke="#9ca3af" stroke-width="3" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="290" y="70" width="200" height="90" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="390" y="105" font-size="16" font-weight="700" fill="#1d4ed8" text-anchor="middle">② 매달 연금 수령</text>
  <text x="390" y="132" font-size="13" fill="#374151" text-anchor="middle">평생 or 정해진 기간</text>
  <text x="390" y="150" font-size="13" fill="#374151" text-anchor="middle">동안 다달이 받아요</text>

  <line x1="490" y1="115" x2="550" y2="115" stroke="#9ca3af" stroke-width="3" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="550" y="70" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="650" y="105" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">③ 계속 그 집에 거주</text>
  <text x="650" y="132" font-size="13" fill="#374151" text-anchor="middle">이사 안 가도 되고</text>
  <text x="650" y="150" font-size="13" fill="#374151" text-anchor="middle">평생 살 수 있어요</text>

  <!-- Bottom: settlement -->
  <rect x="30" y="200" width="720" height="100" rx="12" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="55" y="232" font-size="16" font-weight="700" fill="#1f2937">나중에 정산은?</text>
  <text x="55" y="262" font-size="14" fill="#374151">• 부부 모두 사망 시 → 집을 팔아 그동안 받은 연금·이자를 갚아요.</text>
  <text x="55" y="286" font-size="14" fill="#374151">• 집값이 남으면 <tspan font-weight="700" fill="#15803d">상속인에게 지급</tspan>, 모자라도 <tspan font-weight="700" fill="#b45309">상속인에게 청구하지 않아요.</tspan></text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
