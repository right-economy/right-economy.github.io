<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="갱신요구권을 썼다고 표기된 전세 갱신 2만703건 중 보증금을 5.01퍼센트 넘게 올린 계약은 0건이고 최댓값 5.0036퍼센트는 만원 단위로 올림하며 생긴 차이다. 권리 표기가 없는 갱신 1만7764건에서는 39.7퍼센트인 7054건이 5퍼센트를 넘었다">
  <rect width="640" height="330" fill="#FDF6E3"/>
  <text x="32" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#1F2328">권리를 쓰면 5%가 천장이 됩니다</text>
  <text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">서울 아파트 전세 갱신계약 · 2026년 1~8월 · 국토교통부 실거래</text>

  <rect x="32" y="92" width="576" height="92" rx="10" fill="#FFFFFF" stroke="#E8642F" stroke-width="2"/>
  <text x="52" y="120" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">갱신요구권 「사용」 표기 · 20,703건</text>
  <text x="52" y="148" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">보증금을 5% 넘게 올린 계약</text>
  <text x="300" y="148" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#E8642F">0건</text>
  <text x="52" y="172" font-family="system-ui, sans-serif" font-size="12" fill="#B4501F" font-weight="700">최댓값 5.0036%는 만원 단위 올림 탓 · 절반(52.7%)은 정확히 5.00%</text>

  <rect x="32" y="196" width="576" height="92" rx="10" fill="#FFFFFF" stroke="#E5E0D0"/>
  <text x="52" y="224" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1F2328">권리 표기가 없는 갱신 · 17,764건</text>
  <text x="52" y="252" font-family="system-ui, sans-serif" font-size="13" fill="#6B7280">보증금을 5% 넘게 올린 계약</text>
  <text x="300" y="252" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#4B5563">7,054건</text>
  <text x="386" y="252" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4B5563">39.7%</text>
  <text x="52" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">넘은 계약들의 인상률 중앙값은 +12.0%</text>

  <text x="32" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#8A8F98">월세 없는 순수 전세만 셌습니다 · 「표기 없음」이 권리를 안 썼다는 뜻인지는 이 자료로 알 수 없어요</text>
</svg>
