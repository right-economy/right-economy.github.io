<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Pretendard, sans-serif" role="img" aria-label="국내주식형 ETF 는 매매차익이 비과세이고 분배금만 과세되며, 채권형과 해외지수형은 매매차익도 과세되고 과표기준가가 수익을 따라 오르며, 국내 주식 관련 레버리지와 인버스는 과세 대상으로 분류되지만 기초자산 소득이 비과세라 과표기준가 상승분이 작다는 세 경우 비교">
  <rect width="720" height="320" fill="#fffaf5"/>
  <text x="360" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#7c2d12">세 경우가 다르게 움직입니다</text>
  <text x="360" y="61" text-anchor="middle" font-size="12.5" fill="#8a6d5a">같은 「국내 상장 ETF」인데 과세되는 자리가 갈라집니다</text>

  <rect x="24" y="88" width="216" height="186" rx="14" fill="#eaf4ec" stroke="#cfe3d4"/>
  <text x="132" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#1f7a4d">국내주식형</text>
  <text x="132" y="142" text-anchor="middle" font-size="12" fill="#5a4636">코스피200 같은</text>
  <text x="132" y="160" text-anchor="middle" font-size="12" fill="#5a4636">국내 주식 지수 추종</text>
  <text x="132" y="192" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f7a4d">매매차익 비과세</text>
  <text x="132" y="216" text-anchor="middle" font-size="12.5" fill="#5a4636">분배금만 15.4%</text>
  <text x="132" y="250" text-anchor="middle" font-size="12" fill="#8a6d5a">과표기준가를 볼 일이</text>
  <text x="132" y="266" text-anchor="middle" font-size="12" fill="#8a6d5a">거의 없다</text>

  <rect x="252" y="88" width="216" height="186" rx="14" fill="#fdecec" stroke="#f2c4c4"/>
  <text x="360" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#c0392b">채권형·해외지수형</text>
  <text x="360" y="142" text-anchor="middle" font-size="12" fill="#5a4636">원자재·통화형도</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#5a4636">같은 칸</text>
  <text x="360" y="192" text-anchor="middle" font-size="12.5" font-weight="800" fill="#c0392b">매매차익도 15.4%</text>
  <text x="360" y="216" text-anchor="middle" font-size="12.5" fill="#5a4636">분배금도 15.4%</text>
  <text x="360" y="250" text-anchor="middle" font-size="12" fill="#8a6d5a">수익이 거의 다 과세</text>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="#8a6d5a">대상이라 같이 오른다</text>

  <rect x="480" y="88" width="216" height="186" rx="14" fill="#fff4e8" stroke="#eaddd3"/>
  <text x="588" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">국내 주식 레버리지·인버스</text>
  <text x="588" y="142" text-anchor="middle" font-size="12" fill="#5a4636">기초가 국내 주식이어도</text>
  <text x="588" y="160" text-anchor="middle" font-size="12" fill="#5a4636">세법상 기타 ETF</text>
  <text x="588" y="192" text-anchor="middle" font-size="12.5" font-weight="800" fill="#c2410c">과세 대상이지만</text>
  <text x="588" y="216" text-anchor="middle" font-size="12.5" fill="#5a4636">상승분이 작을 수 있다</text>
  <text x="588" y="250" text-anchor="middle" font-size="12" fill="#8a6d5a">기초자산 소득이 비과세라</text>
  <text x="588" y="266" text-anchor="middle" font-size="12" fill="#8a6d5a">과표기준가가 덜 오른다</text>

  <text x="360" y="304" text-anchor="middle" font-size="12" fill="#5a4636">실제 값은 ETF마다 다릅니다. 내 종목은 증권사 거래내역의 과표기준가로 확인합니다.</text>
</svg>
